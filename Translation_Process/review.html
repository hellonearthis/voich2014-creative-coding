inal": "\u9006\u306b\u767a\u6563\u3057\u306a\u3044\u5024\u306f\u3001\u5024\u304c\u52d5\u304b\u306a\u304b\u3063\u305f\u308a\u3001+\u5074\u3068-\u5074\u3067\u884c\u3063\u305f\u308a\u6765\u305f\u308a", "translated": "Conversely, values that do not diverge do not move, or go back and forth between + and - sides"}, {"original": "\u90e8\u5206\u3092\u8868\u3057\u305f\u3082\u306e\u3068\u3044\u3046\u3053\u3068\u3067\u3059\u3002", "translated": "It means it represents the part."}, {"original": "\u914d\u8272\u3092\u5de5\u592b\u3057\u305f\u308a\u3001\u62e1\u5927\u3059\u308b\u306b\u5f93\u3063\u3066\u767a\u6563\u307e\u3067\u306e\u8a08\u7b97\u56de\u6570\u3092\u5897\u3084\u3057", "translated": "Devised color schemes, and increased calculation count until divergence as it expands"}, {"original": "\u91cd\u306d\u308b\u3053\u3068\u306b\u3088\u308a\u7c21\u6613\u30d6\u30eb\u30fc\u30e0\u3068\u30d6\u30e9\u30fc\u3092\u4e21\u65b9\u9069\u7528\u3059\u308b\u3053\u3068\u306b\u6311\u6226\u3057\u3066", "translated": "Challenging to apply both simple bloom and blur by layering"}, {"original": "\u95a2\u4fc2\u3067\u6b63\u5e38\u306b\u52d5\u4f5c\u3057\u306a\u3044\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002", "translated": "There is a possibility it may not work correctly due to relations."}, {"original": "\u984d\u88c5\u306e\u96f0\u56f2\u6c17\u306f\u3001\u4e2d\u5c71 \u54f2\u6cd5\u3055\u3093(@tetunori_lego)\u306e", "translated": "The atmosphere of framing is from Tetsunori Nakayama-san (@tetunori_lego)"}, {"original": "\uff08v1.5\u306f\u591a\u5c11\u4f59\u97fb\u3092\u3082\u305f\u305b\u305f\u30d0\u30fc\u30b8\u30e7\u30f3\u3067\u3059\uff09", "translated": "(v1.5 is a version with some lingering effect)"}, {"original": "\uff08\u30d7\u30e9\u30a4\u30d9\u30fc\u30c8HP\u306f\u30d7\u30ed\u30d0\u30a4\u30c0\u306eHP\u30b5\u30fc\u30d3\u30b9\u7d42\u4e86\u306b\u3088\u308a\u516c\u958b\u505c\u6b62\u3055\u308c\u307e\u3057\u305f\uff09", "translated": "(Private HP was closed due to termination of provider's HP service)"}, {"original": "\uff08\u8a66\u884c\u932f\u8aa4\u3057\u306a\u304c\u3089\u5c11\u3057\u305a\u3064\u6574\u7406\u4e2d\u3067\u3059\uff09", "translated": "(Organizing little by little while experimenting)"}, {"original": "", "translated": ""}];

        const tableBody = document.querySelector('#translationTable tbody');
        const searchInput = document.getElementById('searchInput');
        const countSpan = document.getElementById('count');

        function renderTable(data) {
            tableBody.innerHTML = '';
            let count = 0;
            const filter = searchInput.value.toLowerCase();

            data.forEach((item, index) => {
                if (!filter || (item.original && item.original.toLowerCase().includes(filter)) || (item.translated && item.translated.toLowerCase().includes(filter))) {
                    const row = document.createElement('tr');
                    
                    const cellIndex = document.createElement('td');
                    cellIndex.textContent = index + 1;
                    row.appendChild(cellIndex);

                    const cellOriginal = document.createElement('td');
                    cellOriginal.textContent = item.original || '';
                    row.appendChild(cellOriginal);

                    const cellTranslated = document.createElement('td');
                    cellTranslated.textContent = item.translated || '';
                    row.appendChild(cellTranslated);

                    tableBody.appendChild(row);
                    count++;
                }
            });
            countSpan.textContent = `Showing ${count} of ${translations.length} rows`;
        }

        searchInput.addEventListener('input', () => {
            renderTable(translations);
        });

        // Initial render
        renderTable(translations);
    </script>
