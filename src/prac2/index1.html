function setup_bloom()
{
	// Preparation for Bloom Processing
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	let scale = 0.5;
	const num = (g_scale == 1.0) ? 2 : 1;
	for(let i = 0;i < num;++i)
	{
		const cv   = document.createElement("canvas");
		const ctx  = cv.getContext("2d");
		const cv_w = sc_w * scale;
		const cv_h = sc_h * scale;
		
		cv.width  = sc_w * scale;
		cv.height = sc_h * scale;
		cv.style.display = "none";
		
		let info =
		{
			cv: cv, cv_w: cv_w, cv_h: cv_h,
			ctx: ctx
		};
		g_bloom_offscs.push(info);
		
		scale /= 2.0;
	}
}

function do_bloom(ctx,draw_screen)
{
	// Execute Bloom Processing
	
	// Apply filter to image after rendering
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	//
	// Doing simple bloom processing.
	//
	// Because it's not extracting only high luminance parts, but whole thing looks glowing,
	// I think it's a bit different from original bloom processing, but anyway
	// Might be easy if you want to make it glow easily (*´ω｀*)
	//
	
	// To off-screen canvas with resolution lowered by half vertically and horizontally in multiple stages
	// Apply Canvas Blur filter, enlarge and additive blend
	const offsc_num = g_bloom_offscs.length;
	let blur_w = [ 4,12 ];
	for(let idx = 0;idx < offsc_num;++idx)
	{
		// Get current state from canvas displayed on screen
		let offsc = g_bloom_offscs[idx];
		offsc.ctx.clearRect(0,0,offsc.cv_w,offsc.cv_h);
		offsc.ctx.drawImage(draw_screen,0,0,sc_w,sc_h,0,0,offsc.cv_w,offsc.cv_h);

		// Reflect on screen (additive blending) while applying filter to reduced image
		ctx.save();
		ctx.globalAlpha = 1.0;
		ctx.globalCompositeOperation = 'lighter';
		ctx.filter="blur("+blur_w[idx]+"px)";
		ctx.drawImage(offsc.cv,0,0,offsc.cv_w,offsc.cv_h,0,0,sc_w,sc_h);
		ctx.restore();
		
		// If draw_screen is the same as the display canvas
		// ^ Get the composited result and enlarge it, so blur
		// I think ... is applied tightly.
	}
}

function create_obstacle(cv,ctx)
{
	
	// Create obstacle figure
	
	// Get canvas size
	const cv_w = cv.width;
	const cv_h = cv.height;
	
	// Fill with black
	ctx.fillStyle = "#000";
	ctx.fillRect(0,0,cv_w,cv_h);
	
	// Parameter preparation
	const w2    = cv_w / 2;
	const h2    = cv_h / 2;
	const cx    = w2;
	const cy    = h2;
	const scale = 0.65;
	let palette = shuffle(g_col.slice());

	let pos       = [];
	let pa        = random(0,TAU);
	const add_pa  = random(2,20) / 10;
	const pos_num = random(3,5);
	for(let p = 0;p < pos_num;++p)
	{
		const type = 0;
		
		let info = {};
		{
			const sr = w2 * random(20,90) / 100;
			const r  = w2 * random(10,50) / 100;
			const rs = rad(random(0,360));
			const re = rs + rad(random(40,270));
			const lw = random(3,15) * g_scale;
			
			info.type = type;
			info.x    = sr * scale;
			info.y    = 0;
			info.r    = r * scale;
			info.rs   = rs;
			info.re   = re;
			info.lw   = lw;
			info.a    = pa;
		}
		
		info.col1 = palette[(pos.length + 0) % palette.length];
		info.col2 = palette[(pos.length + 1) % palette.length];
		pa += add_pa;

		pos.push(info);
	}

	ctx.save();
	
	ctx.translate(cx,cy);
	const add_ra = TAU / random(3,7);
	
	for(let i = 0;i < pos.length;++i)
	{
		const p = pos[i];
		for(let ra = 0;ra < TAU;ra += add_ra)
		{
			const pa    = ra + p.a;

			ctx.save();

			ctx.rotate(ra + p.a);
			ctx.beginPath();
			
			// Create gradation according to arc tilt
			const sx  = p.x + p.r * Math.cos(p.rs);
			const sy  = p.y + p.r * Math.sin(p.rs);
			const ex  = p.x + p.r * Math.cos(p.re);
			const ey  = p.y + p.r * Math.sin(p.re);
			const gra = ctx.createLinearGradient(sx,sy,ex,ey);
			gra.addColorStop(0.0 ,p.col1);
		    gra.addColorStop(1.0 ,p.col2);
		    
			ctx.strokeStyle = gra;
			{
				ctx.lineWidth = p.lw;
				ctx.arc(p.x,p.y,p.r,p.rs,p.re);
				ctx.stroke();
			}
			
			ctx.restore();
		}
	}
	
	ctx.restore();

}

	adjust_screen();
	
	// Preparation of object
	setup_obj();
	
	// Preparation for Bloom Processing
	setup_bloom();

	// Determine initial value
	// * Calling reset() twice because start value becomes undefined if called once
	reset();
	create_obstacle(g_next_cv,g_next_ctx);
	g_nextsc = g_next_ctx.getImageData(0,0,g_start_cv.width,g_start_cv.height);
	reset();

}

function reset()

	// Determine sand color
	const pal  = g_sand_collist[random(0,g_sand_collist.length-1)|0];
	g_sand_col = shuffle(pal.slice())[0];
	
	// Set obstacle figure
	g_start_ctx.drawImage(g_next_cv,0,0);
	
	// Update off-screen data
	g_offsc = g_nextsc;
	setTimeout(function()
	{
		// Delayed execution because smartphone might freeze during getImageData
		create_obstacle(g_next_cv,g_next_ctx);
		g_nextsc = g_next_ctx.getImageData(0,0,g_start_cv.width,g_start_cv.height);
		
	},10);
	
	// Reset sand info
	g_sand = [];
	for(let i = 0;i < g_sand_num;++i)
	{
		const info =
		{
			x: 0, y: 0, v: 1, a: 0,
			free: true
		};
		g_sand.push(info);
	}
}

function create_sand()
{

	// Generate new sand
	const num  = random(g_create_num_min,g_create_num_max);
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	const w    = sc_w * 0.6;
	const w2   = w / 2;
	
	// Sort so empty gathers at front (search efficiency improves slightly)
	g_sand.sort((a,b) => (!a.free && b.free)?1:-1);
	
	let   cnt = 0;
	for(let i = 0;i < g_sand_num;++i)
	{
		let sand = g_sand[i];
		
		// Generate in empty place
		if(sand.free)
		{
			sand.x    = (sc_w / 2) - w2 + random(0,w);
			sand.y    = 0;
			sand.v    = 1;
			sand.a    = random(ACCEL_MIN,ACCEL_MAX) / 10;
			sand.free = false;
			
			cnt++;
			if(cnt == num)
			{	break;	}
		}
		else
		{
			// Since sorted so empty elements gather at front,
			// Loop end if non-empty comes
			break;
		}
	}
	
}

function is_space(x,y)
{
	
	// Determine if specified coordinate is empty
	const data = g_offsc.data;
	const offw = g_start_cv.width;
	
	const p = (y * offw + x) << 2;
	if((data[p]+data[p+1]+data[p+2]) == 0)
	{
		// Empty
		return true;
	}
	
	// Not empty
	return false;

}

function put_data(x,y,col)
{
	
	// Add to obstacle figure data
	const data = g_offsc.data;
	const offw = g_start_cv.width;
	
	const p = (y * offw + x) << 2;
	data[p] = col;

}


function move_sand()
{
	
	// Move sand
	const offw = g_start_cv.width;
	const offh = g_start_cv.height;
	
	for(let i = 0;i < g_sand_num;++i)
	{
		let sand = g_sand[i];
		if(!sand.free)
		{
			let fall = true;
			const v  = sand.v | 0;	// Convert to integer
			
			put_data(sand.x,sand.y,0);
			for(let s = 0;s < v;++s)
			{
				// Is the coordinate one below a movable place?
				if(is_space(sand.x,sand.y+1))
				{
					// Fall because there is no obstacle
					sand.y++;
				}
				else
				{
					// Randomly move horizontally because there is an obstacle
					// If horizontal movement amount is not large, it will get stuck immediately...
					const tx = sand.x + (random(3,6) * ((random(100) < 50) ? -1 : 1));
					if(is_space(tx,sand.y))
					{
						// Move OK
						sand.x = tx;
					}
					fall = false;
					sand.v = 1;
				}
				
				// Delete if it goes off-screen
				if((sand.x < 0) || (sand.x >= offw) || (sand.y >= (offh-1)))
				{
					fall = false;
					sand.free = true;
					break;
				}
			}
			
			// Accelerate if falling
			if(fall)
			{	sand.v += sand.a;	}
			
			if(!sand.free)
			{
				// Remember sand is at moved position
				put_data(sand.x,sand.y,1);
			}
		}
	}

}

function draw_sand()
{

	// Draw sand
	const ctx  = g_screen_ctx;
	
	for(let i = 0;i < g_sand_num;++i)
	{
		let sand = g_sand[i];
		if(!sand.free)
		{
			ctx.strokeStyle = g_sand_col;
			ctx.beginPath();
			ctx.moveTo(sand.x  ,sand.y);
			ctx.lineTo(sand.x+1,sand.y);
			ctx.stroke();
		}
	}

}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// Add to FPS history
		g_fps_list.push(g_fps_count);
		if(g_fps_list.length > 10)
		{	
			// Delete first and keep up to past n times
			// Use average of FPS (moving average)
			g_fps_list.shift();
		}
		let fps_ave = 0;
		for(let i = 0;i < g_fps_list.length;++i)
		{	fps_ave += g_fps_list[i];	}
		fps_ave /= g_fps_list.length;
		
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (fps_ave*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;
		g_fps = fps_ave;
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function toggle_fps_visible()
{
	// Toggle FPS display ON/OFF
	
	// Invert display flag
	g_fps_visible = !g_fps_visible;
	
	// Control visible based on display flag
	let fps_div = document.getElementById("fps");
	fps_div.style.display = g_fps_visible ? "block" : "none";

}

function draw()
{

	// Drawing Core
	
	// Save start time
	if(g_start_time == 0)
	{
		g_start_time = g_time;
		g_next_time  = g_time + MORPH_TIME;
	}
	
	// Screen Clear
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	const ctx  = g_screen_ctx;
	ctx.drawImage(g_start_cv,0,0);
	
	ctx.save();
	
	// Generate/Move/Draw Sand
	create_sand();
	move_sand();
	draw_sand();

	ctx.restore();
	
	// Bloom Processing
	let screen = document.getElementById("game-screen");
	do_bloom(ctx,screen);

	ctx.save();
	
	// Fade In/Out
	const time_ms = g_time - g_start_time;
	if(time_ms < FADE_TIME)
	{
		ctx.globalAlpha = 1.0 - (time_ms / FADE_TIME);
		ctx.fillStyle = "#000";
		ctx.fillRect(0,0,sc_w,sc_h);
	}
	else if(time_ms >= (MORPH_TIME - FADE_TIME))
	{
		ctx.globalAlpha = (time_ms - (MORPH_TIME - FADE_TIME)) / FADE_TIME;
		ctx.fillStyle = "#000";
		ctx.fillRect(0,0,sc_w,sc_h);
	}

	ctx.restore();
	
	if(g_time >= g_next_time)
	{
		// Determine next break time and reset
		g_start_time = g_time;
		g_next_time  = g_start_time + MORPH_TIME;
		reset();
	}
	
}

function render()
{
	
	// Drawing processing for every turn
	
	// Time Calculation
	const last_time = g_time;
	g_time = (new Date).getTime();
	if(last_time == 0)
	{	g_dtime = 0;	}
	else
	{	g_dtime = g_time - last_time;	}
	
	// Drawing Core
	draw();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render);

}

</script>
</head>
<body onload="init()">
	<div id="fps"></div>
	<canvas id="game-screen"></canvas>
</body>
</html>
