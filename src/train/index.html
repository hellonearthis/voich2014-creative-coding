<!DOCTYPE html>
<html>
<head>
<title>Papa's AA Train</title>
<meta charset="utf-8">
<meta name="viewport" content="width=320, user-scalable=no, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<!--
	This demo is based on a SmileBASIC work published by neko800 (@nekohachi1)
	Inspired by Stosstruppe-san (@Stosstruppe) starting to port in JavaScript
	Voich (@voich2014) tried making it himself.
	
	Overwhelming thanks to the original creators for publishing such wonderful works!!
	
	neko800-san's AA TRAIN https://twitter.com/nekohachi1/status/1197642791079182337
	Stosstruppe-san's AA TRAIN http://www.maroon.dti.ne.jp/lance/js/trial/aatrain5.html

-->
<style type="text/css">
<!--
	html
	{
	    overflow: hidden;
	}

	body
	{
		overflow: hidden;
		background-color: black;
		color: #fff;
	}

	*
	{
		-webkit-user-select: none;
		   -moz-user-select: none;
		    -ms-user-select: none;
		        user-select: none;
	}

	#fps
	{
		position:absolute;
		color: #FFF;
		bottom:0px;
		z-index: 100;
	}

	#game-screen 
	{
		position:absolute;
	}

	#aa-chip
	{
		display: none;
	}

	#aa-star
	{
		display: none;
	}
-->
</style>
<script type="text/javascript">

// Global Object
var g_game_width             = 320;
var g_game_height            = 500;

// Types of sprite models
//
// 0: Railroad
// 1: Grass 1
// 2: Grass 2
// 3: Signboard
// 4: Tree
// 5: Pole
//

const g_model_0 = "/====\\";

const g_model_1 = ".ww.w.";

const g_model_2 = "..www.";

const g_model_3 = "#==#\n"+
                  "#--#\n"+
                  "#  #";

const g_model_4 = "    %%     \n"+
                  "   %%.%    \n"+
                  "  %%**%    \n"+
                  "  %%%% %   \n"+
                  " %%** .%   \n"+
                  " %%% %% %  \n"+
                  "%%%* *..   \n"+
                  "%%%  %%.%* \n"+
                  " *%%..**.' \n"+
                  " ''*# .''  \n"+
                  "    # .    \n"+
                  ".._## ##_..";

const g_model_5 = "|X|\n"+
                  "===\n"+
                  "===\n"+
                  "|X|\n"+
                  "|X|\n"+
                  "|X|\n"+
                  "|X|\n"+
                  "|X|\n"+
                  "|#|\n"+
                  "|#|\n"+
                  "|X|\n"+
                  "|X|";

const g_sprite_num  = 512*3;	// Total number of sprites (Track + Left side + Right side)
const g_line_num    = 512;		// Number of tracks
const g_obj_offset  = 64;		// Movement width of track

var g_model         = [];
var g_sprite        = [];
var g_pos_tg        = 0;
var g_pos_x         = 0;
var g_pos_z         = 0;
var g_pos_a         = 0;
var g_pos_aa        = 0;

var g_last_fps_time = 0;
var g_fps_count     = 0;

function rad(deg)
{
	// Degree -> Radian conversion
	return deg * Math.PI / 180;
}

function rnd(x)
{
	// Get random number
	return Math.floor(Math.random() * x);
}

function init_game()
{
	
	// Game initialization processing
	
	// Screen Adjustment
	adjust_screen();
	
	// Generation of objects necessary for game
	create_obj();
	for(var i = 0;i < g_line_num;++i)
	{	set_obj_pos();	}

	// Preparation of requestAnimationFrame (compatible with various browsers)
	var requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render_game);
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	var now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// FPS Display
		var fps_div = document.getElementById("fps");
		fps_div.innerText = "FPS:"+(g_fps_count*(1000/(now_time - g_last_fps_time)));
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function adjust_screen()
{
	// Screen Adjustment
	
	// Get window size
	var window_w = window.innerWidth;
	var window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 1280;
		g_game_height = 720;
	}
	
	// Place game screen in center
	var screen  = document.getElementById("game-screen");
	var game_x  = (window_w - g_game_width) / 2;
	var game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

}

function create_obj()
{
	// Object Generation
	
	// Prepare sprite chips
	var aa_chip = document.getElementById("aa-chip");
	var ctx_aa  = aa_chip.getContext("2d");
	var sp,lines;
	
	aa_chip.width  = 320;
	aa_chip.height = 240;
	
	ctx_aa.font         = "16px 'Courier New'";
	//ctx_aa.strokeStyle  = '#0F0';	
	// ^ If you uncomment and delete aa-chip css
	//  You will be able to see how it is pasted
  	ctx_aa.textBaseline = "top";
   	
  	// Define model paste location
	g_model[0] = { x:  0, y:  0, w: 58, h: 16 };
	g_model[1] = { x:  0, y: 16, w: 58, h: 16 };
	g_model[2] = { x:  0, y: 32, w: 58, h: 16 };
	g_model[3] = { x:  0, y: 48, w: 39, h: 48 };
	g_model[4] = { x: 60, y:  0, w:106, h:192 };
	g_model[5] = { x:180, y:  0, w: 29, h:192 };
	
	sp = g_model[0];
	ctx_aa.strokeRect(sp.x,sp.y,sp.w,sp.h);
	ctx_aa.fillStyle = '#FFF';
	ctx_aa.fillText(g_model_0,sp.x,sp.y);
	
	sp = g_model[1];
	ctx_aa.strokeRect(sp.x,sp.y,sp.w,sp.h);
	ctx_aa.fillStyle = '#0F0';
	ctx_aa.fillText(g_model_1,sp.x,sp.y);
	
	sp = g_model[2];
	ctx_aa.strokeRect(sp.x,sp.y,sp.w,sp.h);
	ctx_aa.fillStyle = '#0F0';
	ctx_aa.fillText(g_model_2,sp.x,sp.y);
	
	sp = g_model[3];
	ctx_aa.strokeRect(sp.x,sp.y,sp.w,sp.h);
	ctx_aa.fillStyle = '#FF0';
	lines = g_model_3.split(/\n/);
	for(var i = 0;i < lines.length;i++)
	{	ctx_aa.fillText(lines[i],sp.x,sp.y+16*i);	}
	
	sp = g_model[4];
	ctx_aa.strokeRect(sp.x,sp.y,sp.w,sp.h);
	ctx_aa.fillStyle = '#FFF';
	lines = g_model_4.split(/\n/);
	for(var i = 0;i < lines.length;i++)
	{	ctx_aa.fillText(lines[i],sp.x,sp.y+16*i);	}
	
	sp = g_model[5];
	ctx_aa.strokeRect(sp.x,sp.y,sp.w,sp.h);
	ctx_aa.fillStyle = '#FFF';
	lines = g_model_5.split(/\n/);
	for(var i = 0;i < lines.length;i++)
	{	ctx_aa.fillText(lines[i],sp.x,sp.y+16*i);	}

	
	// Prepare background starry sky
	var screen  = document.getElementById("game-screen");
	var aa_star = document.getElementById("aa-star");
	var ctx_s   = aa_star.getContext("2d");
	
	aa_star.width  = screen.width;
	aa_star.height = screen.height;
	
	ctx_s.font         = "16px 'Courier New'";
	ctx_s.textBaseline = "top";
  	ctx_s.fillStyle    = "#FFF";
	for(var i = 0;i < 64;++i)
	{	ctx_s.fillText("*."[rnd(2)],rnd(160)*8,rnd(24)*8);	}


	// Initialize sprite object information
	for(var i = 0;i < g_sprite_num;++i)
	{
		var obj = { x: 0, y: 0, z: 0, a: 0, m: 0, v: 1 };
		g_sprite.push(obj);
	}

}

function set_obj_pos()
{
	// Determine object position
	
	if((g_pos_tg % 32) == 0)
	{	g_pos_aa = rnd(3) - 1;	}
	g_pos_a = (g_pos_a + g_pos_aa + 360) % 360;
	
	// Move in Z direction and sway in X direction
	//
	// Z
	// ^
	// |-----+
	// |    /
	// |θ/  
	// |/  
	// +------> X
	// 
	//
	var a = rad(g_pos_a);
	g_pos_x += Math.sin(a) * g_obj_offset;
	g_pos_z += Math.cos(a) * g_obj_offset;

	// Set position of track sprite
	g_sprite[g_pos_tg].x = g_pos_x;
	g_sprite[g_pos_tg].z = g_pos_z;
	g_sprite[g_pos_tg].a = g_pos_a;	// Direction track is facing [deg]
	g_sprite[g_pos_tg].m = 0;
	g_sprite[g_pos_tg].v = ((g_pos_tg % 8) == 0) ? 1 : 0;
	
	
	// Set sprites to place on left and right of track
	var side_a = rad(g_pos_a + 90);
	var id     = g_pos_tg;
	for(var s = 0;s < 2;++s)
	{
		id += g_line_num;
		var m = 0;
		var d = 0;
		
		if((id % 8) == 0)
		{
			// Billboard or Tree
			switch(rnd(3))
			{
				case 1:	// Tree
					d = rnd(16) * 64 + 512;
					m = 4;
					break;
					
				case 2: // Billboard
					d = 240;
					m = 3;
					break;
			}
		}
		if((id % 64) == 0)
		{
			// Pole
			d = 420;
			m = 5;
		}
		if(m == 0)
		{
			// Grass
			d = rnd(8) * 128 + 256;
			m = rnd(2) + 1;
		}
		
		d = (s == 0) ? -d: d;
		g_sprite[id].x = g_pos_x + d * Math.sin(side_a);
		g_sprite[id].z = g_pos_z + d * Math.cos(side_a);
		g_sprite[id].a = 0;
		g_sprite[id].m = m;
		g_sprite[id].v = 1;
	}
	
	g_pos_tg = (g_pos_tg + 1) % g_line_num;
	
}

function draw_train()
{
	// AA Train drawing processing	
	var screen  = document.getElementById("game-screen");	// Drawing destination canvas
	var aa_chip = document.getElementById("aa-chip");		// Canvas for sprite
	var aa_star = document.getElementById("aa-star");		// Canvas for starry sky

	// Screen clear for every turn
	var ctx = screen.getContext("2d");
	ctx.clearRect(0,0,screen.width,screen.height);
	
	// Set new position of object
	set_obj_pos();
	
	// Set camera position along the track
	var cp     = (g_pos_tg + 16) % g_line_num;
	var cx     = g_sprite[cp].x;
	var cy     = 150;	// View from slightly above
	var cz     = g_sprite[cp].z;
	var ca     = rad(g_sprite[cp].a);
	var ca_sin = Math.sin(ca);
	var ca_cos = Math.cos(ca)
	
	var nZ     = 100;				//nearZ
	var fZ     = 8000;				//farZ
	var va     = rad(110);			// Field of View
	var va_tan = Math.tan(va*0.5);
	
	var sc_w  = screen.width;
	var sc_h  = screen.height;
	var sc_w2 = sc_w / 2;
	var sc_h2 = sc_h / 2;
	var ar    = sc_h / sc_w;		// Coefficient to make screen width 1:1 with height
	
	// Move Starry Sky
	var bx = Math.floor(aa_star.width * g_sprite[cp].a / 360);
	ctx.drawImage(aa_star,-bx,0);
	ctx.drawImage(aa_star,aa_star.width-bx,0);
	
	// Transform position of all objects according to camera
	for(var i = 0;i < g_sprite_num;++i)
	{
		if(g_sprite[i].v)
		{
			// Translate and rotate according to camera position
			
			// Translation
			var mx = g_sprite[i].x - cx;
			var my = g_sprite[i].y - cy;
			var mz = g_sprite[i].z - cz;
			
			// Rotate around Y axis
			var rx = mx * ca_cos - mz * ca_sin;
			var ry = my;
			var rz = mx * ca_sin + mz * ca_cos;
			
			if((nZ <= rz) && (rz < fZ))
			{	
				// Visible at rz position relative to field of view
				// Normalize with range maximum as 1
				var nd = va_tan * rz;
				var nx = (rx * ar) / nd;
				var ny = ry / nd;
				
				// Convert to canvas screen coordinate system here
				var md    = g_model[g_sprite[i].m];
				var scale = sc_h / nd;
				var sw    = md.w * scale;
				var sh    = md.h * scale;
				var sx    = sc_w2 + (sc_w2 * nx) - (sw / 2);
				var sy    = sc_h2 - (sc_h2 * ny) - sh;
				
				if((0 <= sx) && (sx < sc_w) &&
				   (0 <= sy) && (sy < sc_h))
				{	ctx.drawImage(aa_chip,md.x,md.y,md.w,md.h,sx,sy,sw,sh);	}
			}
		}
	}

}

function render_game()
{
	
	// Game drawing processing
	
	// AA TRAIN Drawing
	draw_train();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render_game);

}

</script>
</head>
<body onload="init_game()">
	<div id="fps"></div>
	<canvas id="game-screen"></canvas>
	<canvas id="aa-chip"></canvas>
	<canvas id="aa-star"></canvas>
</body>
</html>
