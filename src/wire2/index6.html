		this.mtx_viewport.copy(m);
	}
	
	// Pre-drawing processing
	drawBegin()
	{
		this.funcDrawBegin(this.sc_ctx,this.sc_w,this.sc_h);
	}
	
	// Post-drawing processing
	drawEnd()
	{
		this.funcDrawEnd(this.sc_ctx,this.sc_w,this.sc_h);
	}
	
	// Draw Primitives
	drawIndexedPrimitive(vertex_list,vertex_count,index_list,primitive_count)
	{
		//
		// vertex_list		Object vertex data list
		// vertex_count		Number of items in vertex list
		// index_list		Vertex order list
		// primitive_count	Number of primitives
		//					Since one primitive is a triangle with 3 vertices
		//					Number of vertex order lists divided by 3
		//

		// Create matrix for MVP (Model View Projection) transformation
		let m = new MatrixMan4();
		m.mul(this.mtx_model);		// Origin of local coordinates in world coordinates
									// Convert to position
		m.mul(this.mtx_view)		// Adjust entire world to camera position
									// Move/Rotate
		m.mul(this.mtx_projection);	// Project and normalize coordinates to visible range
		
		// Perform up to MVP transformation
		let dst_vertex_list = [];
		
		for(let i = 0;i < vertex_count;++i)
		{
			// Model-View Transformation
			//
			// From local coordinate system of each 3D object to world coordinate system
			// Transform coordinates so that it becomes the scenery seen from the camera at
			//
			// Projection Transformation
			//
			// In this projection transformation, coordinates are normalized by delimiting the visible range (frustum) from the viewpoint
			// do.											
			// By this, the range of X/Y/Z values in the visible range is converted to -1.0 to 1.0,
			// Need to transform coordinates according to drawing destination screen resolution by next ViewPort transformation
			// There are.
			// Becomes left-handed coordinate system after projection transformation,
			//
			// X = (Left)   -1.0 to 1.0 (Right)
			// Y = (Bottom)   -1.0 to 1.0 (Top)
			// Z = (nearZ)-1.0 ～ 1.0(farZ)
			//
			// It is converted to the range.
			//
			dst_vertex_list.push( new VertexMan());
			dst_vertex_list[i].copy(vertex_list[i]);
			dst_vertex_list[i].vv.mul_matrix(m);
			
			// Dividing projected X/Y/Z coordinates by w completes X/Y/Z scaling
			dst_vertex_list[i].vv.x /= dst_vertex_list[i].vv.w;
			dst_vertex_list[i].vv.y /= dst_vertex_list[i].vv.w;
			dst_vertex_list[i].vv.z /= dst_vertex_list[i].vv.w;
			// Since w value is not needed after scaling, initialize to 1.0
			dst_vertex_list[i].vv.w = 1.0;
		}

		// Draw Polygon
		this.funcDrawPrimitive(dst_vertex_list,index_list,primitive_count);

	}
	
	// Draw polygon in wireframe
	drawPolygonWithWireframe(vertex_list,index_list,primitive_count)
	{
		// Draw primitives in order
		let point_index = 0;
		while(primitive_count > 0)
		{
			// Draw triangle in wireframe

			let i1 = index_list[point_index    ];
			let i2 = index_list[point_index + 1];
			let i3 = index_list[point_index + 2];
			
			const x1 = Math.abs(vertex_list[i1].vv.x);
			const x2 = Math.abs(vertex_list[i2].vv.x);
			const x3 = Math.abs(vertex_list[i3].vv.x);
			const y1 = Math.abs(vertex_list[i1].vv.y);
			const y2 = Math.abs(vertex_list[i2].vv.y);
			const y3 = Math.abs(vertex_list[i3].vv.y);
			const z1 = Math.abs(vertex_list[i1].vv.z);
			const z2 = Math.abs(vertex_list[i2].vv.z);
			const z3 = Math.abs(vertex_list[i3].vv.z);
			
			//
			// Draw only what is included in visible range
			//
			// Coordinates passed through projection transformation matrix are as clipping space,
			// X/Y/Z are converted to the range of -1.0 to 1.0.
			// Values with absolute value greater than 1 can be excluded as outside field of view.
			//
			if((x1 <= 1.0) || (x2 <= 1.0) || (x3 <= 1.0) ||
			   (y1 <= 1.0) || (y2 <= 1.0) || (y3 <= 1.0) ||
			   (z1 <= 1.0) || (z2 <= 1.0) || (z3 <= 1.0))
			{
				// Create copy to apply ViewPort transformation
				let vertex1 = new VectorMan4(); vertex1.copy(vertex_list[i1].vv);
				let vertex2 = new VectorMan4(); vertex2.copy(vertex_list[i2].vv);
				let vertex3 = new VectorMan4(); vertex3.copy(vertex_list[i3].vv);
				
				// ViewPort Transformation
				//
				// Matching the direction of Y coordinate to screen coordinate system, and X/Y
				// The coordinate values of ... from the range of -1.0 to 1.0 to the screen width/height
				// Convert to number of pixels.
				// Z value remains as is.
				//
				vertex1.mul_matrix(this.mtx_viewport);
				vertex2.mul_matrix(this.mtx_viewport);
				vertex3.mul_matrix(this.mtx_viewport);
				
				// Draw triangle (Bresenham)
				this.funcDrawLine(this.sc_ctx,this.sc_w,this.sc_h,
								  vertex1.x,vertex1.y,
						   		  vertex2.x,vertex2.y);

				this.funcDrawLine(this.sc_ctx,this.sc_w,this.sc_h,
								  vertex2.x,vertex2.y,
								  vertex3.x,vertex3.y);

				this.funcDrawLine(this.sc_ctx,this.sc_w,this.sc_h,
								  vertex3.x,vertex3.y,
								  vertex1.x,vertex1.y);
			}

			// Update index
			point_index += DEF_VERTEX_NUM_FOR_PRIMITIVE;

			// Reduce Primitives
			primitive_count--;
		}
	}
	
	// Calculate normal vector of triangle polygon
	getNormalVectorFromPolygon(v1,v2,v3)
	{
		let n = new VectorMan3();
		let a = new VectorMan3();
		let b = new VectorMan3();

		// Vector a extending from vertex v1 to vertex v2 and
		// Calculate vector b extending from vertex v1 to vertex v3
		a.x = v2.x - v1.x;
		a.y = v2.y - v1.y;
		a.z = v2.z - v1.z;
		b.x = v3.x - v1.x;
		b.y = v3.y - v1.y;
		b.z = v3.z - v1.z;

		// Taking cross product of vectors a,b results in
		// Vector n perpendicular to plane is obtained.
		n.crossProduct(a,b);

		// The unit vector version of this vector is from vertices v1, v2, v3
		// Becomes normal vector of triangle polygon that becomes
		n.normalize();

		return n;
	}
	
	// Edge function
	edgeFunction(a,b,c)
	{
		//
		// It becomes the cross product of the vector extending from a to b and the vector extending from a to c.
		// The absolute value of the cross product result is the area of the parallelogram with two vectors as two sides
		// It becomes.
		// Also, the sign of the cross product value can be used for polygon front/back determination and polygon inside/outside determination.
		//
		return (c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x);
	}
	
	// Draw polygon with flat shading
	drawPolygonWithFlatShading(vertex_list,index_list,primitive_count)
	{
		// Draw primitives in order
		let point_index = 0;
		while(primitive_count > 0)
		{
			// Draw triangle polygon with flat shading
			
			let i1 = index_list[point_index    ];
			let i2 = index_list[point_index + 1];
			let i3 = index_list[point_index + 2];

			const x1 = Math.abs(vertex_list[i1].vv.x);
			const x2 = Math.abs(vertex_list[i2].vv.x);
			const x3 = Math.abs(vertex_list[i3].vv.x);
			const y1 = Math.abs(vertex_list[i1].vv.y);
			const y2 = Math.abs(vertex_list[i2].vv.y);
			const y3 = Math.abs(vertex_list[i3].vv.y);
			const z1 = Math.abs(vertex_list[i1].vv.z);
			const z2 = Math.abs(vertex_list[i2].vv.z);
			const z3 = Math.abs(vertex_list[i3].vv.z);
			
			//
			// Draw only what is included in visible range
			//
			// Coordinates passed through projection transformation matrix are as clipping space,
			// X/Y/Z are converted to the range of -1.0 to 1.0.
			// Values with absolute value greater than 1 can be excluded as outside field of view.
			//
			if((x1 <= 1.0) || (x2 <= 1.0) || (x3 <= 1.0) ||
			   (y1 <= 1.0) || (y2 <= 1.0) || (y3 <= 1.0) ||
			   (z1 <= 1.0) || (z2 <= 1.0) || (z3 <= 1.0))
			{
				// Calculate normal vector of polygon
				let vNormal = this.getNormalVectorFromPolygon(vertex_list[i1].vv,vertex_list[i2].vv,vertex_list[i3].vv);
				
				// Take dot product of line of sight/light source and polygon normal
				let lightDot = vNormal.dotProduct(this.vLight);	// With light source vector
																// Dot product result with normal vector
				const eyeDot = vNormal.dotProduct(this.vEye);	// With line of sight vector
																// Dot product result with normal vector
				
				//
				// If the dot product result is a negative value, the line of sight vector and the polygon's normal vector
				// Represents that they are roughly facing each other, and if the result is a positive value, the view vector
				// and the normal vector are facing roughly the same direction, meaning it is invisible
				// So, draw only if it's a negative value facing each other.
				// * When performing perspective correction, this judgment may not be correct...
				//
				if(eyeDot < 0.0)
				{
					//
					// Calculate surface color
					// * lightDot is the ratio of light hitting the polygon surface relative to the light ray,
					//   Adjust the diffuse light value.
					//   However, the dot product result of the polygon's normal vector and the light ray vector is negative
					//   value, so multiply by minus to invert it to positive.
					//
					//   If the dot product result becomes a positive number, it means light does not hit
					//   So correct it to 0.
					//
					if(lightDot > 0.0){ lightDot = 0.0; }
					let r = Math.floor((this.vAmbientColor.x + -lightDot * this.vDiffuseColor.x) * 255);
					let g = Math.floor((this.vAmbientColor.y + -lightDot * this.vDiffuseColor.y) * 255);
					let b = Math.floor((this.vAmbientColor.z + -lightDot * this.vDiffuseColor.z) * 255);

					// Saturate to range 0-255
					if(r < 0){ r = 0; }
					else if(r > 255){ r = 255; }
					if(g < 0){ g = 0; }
					else if(g > 255){ g = 255; }
					if(b < 0){ b = 0; }
					else if(b > 255){ b = 255; }

					// Set color
					const color = { r: r, g: g, b: b };
					
					// Create copy to apply ViewPort transformation
					let vertex1 = new VectorMan4(); vertex1.copy(vertex_list[i1].vv);
					let vertex2 = new VectorMan4(); vertex2.copy(vertex_list[i2].vv);
					let vertex3 = new VectorMan4(); vertex3.copy(vertex_list[i3].vv);
					
					// ViewPort Transformation
					//
					// Matching the direction of Y coordinate to screen coordinate system, and X/Y
					// The coordinate values of ... from the range of -1.0 to 1.0 to the screen width/height
					// Convert to number of pixels.
					// Z value remains as is.
					//
					vertex1.mul_matrix(this.mtx_viewport);
					vertex2.mul_matrix(this.mtx_viewport);
					vertex3.mul_matrix(this.mtx_viewport);
					
					// Create bounding box surrounding 3 vertices of polygon
					const v1 = vertex1;
					const v2 = vertex2;
					const v3 = vertex3;
					let minX = v1.x,minY = v1.y,maxX = v1.x+2,maxY = v1.y+2;
					if(v2.x      < minX){ minX = v2.x;      }
					if(v3.x      < minX){ minX = v3.x;      }
					if(minX      < 0   ){ minX = 0;         }
					if(maxX      < v2.x){ maxX = v2.x+2;    }
					if(maxX      < v3.x){ maxX = v3.x+2;    }
					if(this.sc_w < maxX){ maxX = this.sc_w; }
					if(v2.y      < minY){ minY = v2.y;      }
					if(v3.y      < minY){ minY = v3.y;      }
					if(minY      < 0   ){ minY = 0;         }
					if(maxY      < v2.y){ maxY = v2.y+2;    }
					if(maxY      < v3.y){ maxY = v3.y+2;    }
					if(this.sc_h < maxY){ maxY = this.sc_h; }
					minX = Math.floor(minX);
					maxX = Math.floor(maxX);
					minY = Math.floor(minY);
					maxY = Math.floor(maxY);

					for(let y = minY;y < maxY;++y)
					{
						// Calculate address of drawing destination Y coordinate
						const pos = this.sc_w * y;

						for(let x = minX;x < maxX;++x)
						{
							// Interpolate Z coordinate of pixel center
							const p  = new VectorMan4(x+0.5,y+0.5,1,1);
							
							//
							// Virtual ... obtained by adding 0.5 to candidate X,Y coordinates
							// Pixel center coordinates and coordinates of each polygon vertex
							// using EdgeFunction (2D cross product calculation) from
							// Can calculate ratio of attribute information of 3 vertices occupied by point p.
							//
							// Also, the value obtained by EdgeFunction means point p is inside
							// Can be used to determine if it exists.
							// In the case of a polygon with counter-clockwise vertex order, 0 or positive
							// If it becomes a value, it can be determined as inside.
							//
							// This topic is about EdgeFunction, barycentric coordinate system, etc.
							// I think various things come up if you search.
							// 
							// Reference
							// https://qiita.com/N-H-Shimada/items/edf02a8dc21a4a14c8b0
							// https://www.scratchapixel.com/lessons/3d-basic-rendering/rasterization-practical-implementation/rasterization-stage
							//
							
							let area = this.edgeFunction(v1,v2,v3);	// Becomes denominator for ratio calculation
							let w0   = this.edgeFunction(v2,v3,p);	// Cross product of vector v2->p and vector v2->v3, usable for v1 vertex info ratio
							let w1   = this.edgeFunction(v3,v1,p);	// Cross product of vector v3->p and vector v3->v1, usable for v2 vertex info ratio
							let w2   = this.edgeFunction(v1,v2,p);	// Cross product of vector v1->p and vector v1->v2, usable for v3 vertex info ratio
							
							if(!((w0 >= 0) && (w1 >= 0) && (w2 >= 0)))
							{
								// Skip if not existing inside polygon
								continue;
							}
							
							//
							// The answer of EdgeFunction is also the area value, so the whole
							// Ratio of attribute info of each vertex can be calculated by dividing by area
							//
							w0 /= area;
							w1 /= area;
							w2 /= area;
							
							//
							// Also regarding the Z value used for front/back determination in Z buffer
							// With correction considering perspective (perspective correction),
							// Need to interpolate Z value, confirmed with quite complicated calculation
							// As a result of doing,
							//
							// 1/Z = w0 * 1/v1.z + w1 * 1/v2.z + w2 * 1/v3.z
							//
							// Found that the relationship holds.
							// In other words, calculate as Z = 1 / (1/Z).
							//
							// Reference
							// https://qiita.com/N-H-Shimada/items/edf02a8dc21a4a14c8b0
							// https://www.scratchapixel.com/lessons/3d-basic-rendering/rasterization-practical-implementation/perspective-correct-interpolation-vertex-attributes
							//
						
							// Convert to 1/z form in advance
							let z1 = 1 / v1.z;
							let z2 = 1 / v2.z;
							let z3 = 1 / v3.z;
							
							let Z = 1 / (w0 * z1 + w1 * z2 + w2 * z3); 
							
							// Draw if it is in front of Z coordinate of pixel already drawn
							if(this.aZBuffer[pos + x] > Z)
							{
								const c = { r: color.r, g: color.g, b: color.b, a: 255 };

								this.drawPoint_bresenham(this.sc_w,this.sc_h,x,y,c);
								this.aZBuffer [pos + x] = Z;	// Update Z value of pixel
							}
						}
					}
				}
			}
			
			// To next polygon vertex index
			point_index += DEF_VERTEX_NUM_FOR_PRIMITIVE;

			// Reduce Primitives
			primitive_count--;
		}
	}

}


// Global Object
let g_game_width    = 320;
let g_game_height   = 500;

let g_offsc;							// Off-screen for manual drawing
let g_draw_algo;						// Index of currently selected drawing algorithm
let g_renderingman;						// Rendering Manager

let g_obj;								// Object for display
let g_rY = 0;							// Rotation angle during overall rotation

const g_accel_add   = 0.02;				// Acceleration/deceleration per turn
const g_angle_unit  = 2;				// Base angular velocity [deg]
const g_obj_delay   = 0.05;				// Delay per object
const g_obj_num     = 8;				// Number of objects
const g_wait        = 1.0;				// Wait time
let   g_accel_limit = 2.0;				// Maximum acceleration

// For each object
let   g_accel       = [];				// Current acceleration
let   g_next_accel  = [];				// Next start acceleration
let   g_a_dir       = [];				// Acceleration direction (accelerate/decelerate)
let   g_r_dir       = [];				// Rotation direction (forward/reverse)
let   g_rz          = [];				// Z rotation angle per object

let g_last_fps_time = 0;
let g_fps_count     = 0;

function init_game()
{
	
	// Game initialization processing
	
	// Screen Adjustment
	adjust_screen();
	
	// Generation of objects necessary for game
	create_obj();
	
	// Prepare drawing processing method
	g_draw_algo = 4-1;
	change_draw_algorithm();
	window.onmousedown = change_draw_algorithm;
	window.ontouchdown = change_draw_algorithm;
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render_game);
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// FPS Display
		let fps_div = document.getElementById("fps");
		fps_div.innerText = "FPS:"+(g_fps_count*(1000/(now_time - g_last_fps_time)));
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function adjust_screen()
{
	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 1280;
		g_game_height = 720;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width) / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

	// Create ImageData for off-screen
	let ctx = screen.getContext("2d");
	g_offsc = ctx.createImageData(g_game_width,g_game_height);
	
}

function create_obj()
{
	// Object Generation
	
	// Prepare rendering handler
	const screen     = document.getElementById("game-screen");	// Drawing destination canvas
	const algo_label = document.getElementById("algo");
	g_renderingman = new RenderingMan(screen,g_offsc,algo_label);
	
	// Set ViewPort matrix and Projection matrix
	let mtx_viewport   = new MatrixMan4();
	let mtx_projection = new MatrixMan4();
	
	mtx_viewport.viewPort(0,0,g_game_width,g_game_height);
	mtx_projection.projectionOpenGL(NEAR_Z_POS,FAR_Z_POS,rad(60),g_game_width/g_game_height);
	g_renderingman.setViewPortMatrix(mtx_viewport);
	g_renderingman.setProjectionMatrix(mtx_projection);
	
	// Set View Matrix
	let vFrom    = new VectorMan3(0.0,0.0,25.0);
	let vTo      = new VectorMan3(0.0,0.0,20.0);
	let vUp      = new VectorMan3(0.0,1.0,0.0);
	let mtx_view = new MatrixMan4();
		
	mtx_view.view(vFrom,vTo,vUp);
	g_renderingman.setViewMatrix(mtx_view);

	// Set diffuse light color
	g_renderingman.setDefuseLightColor(0.0,0.0,1.0);
	
		
	// Preparation of object
	g_obj = new SquareRingObjMan();
	for(let i = 0;i < g_obj_num;++i)
	{
		g_accel.push(g_accel_limit);
		g_next_accel.push(new Array());
		g_a_dir.push(-1);
		g_r_dir.push(1);
		g_rz.push(0);
	}
	
}

function change_draw_algorithm()
{
	// Selection of drawing algorithm
	
	g_draw_algo = (g_draw_algo + 1) % 5;
	
	switch(g_draw_algo)
	{
		case 0:	// Context LINE drawing
			g_renderingman.setupContextLine();
			break;
			
		case 1:	// Bresenham LINE Drawing
			g_renderingman.setupBresenhamLine();
			break;
			
		case 2:	// Double Step Bresenham LINE Drawing
			g_renderingman.setupDoubleStepBresenhamLine();
			break;
		
		case 3:	// Anti-aliased Bresenham LINE Drawing
			g_renderingman.setupBresenhamLineAA();
			break;
			
		case 4:	// Flat Shading Drawing
			g_renderingman.setupFlatShading();
			break;
	}

}

function draw_wire()
{
	// Drawing processing for wireframes etc.
	
	// Pre-drawing processing
	g_renderingman.drawBegin();
	
	// Prepare matrices related to entire object
	let mtx_scale   = new MatrixMan4();
	let mtx_rotateY = new MatrixMan4();
	let mtx_move    = new MatrixMan4();
	
	// Enlarge object size by 16 times
	mtx_scale.scale(16.0,16.0,16.0);
	
	// Rotate whole around Y axis
	mtx_rotateY.rotateY(rad(g_rY));
	g_rY += 0.8;
	g_rY = g_rY % 360;
	
	// Place slightly in the back
	mtx_move.translate(0,0,-20);

	// Move object
	for(let i = 0;i < g_obj_num;++i)
	{
		let mtx_model   = new MatrixMan4();
		let mtx_pos     = new MatrixMan4();
		let mtx_rotateZ = new MatrixMan4();
		
		// Individual Z axis rotation
		let z     = g_rz[i];
		let accel = g_accel[i];
		if(accel < 0){ accel = 0; }
		z += (accel * g_angle_unit * g_r_dir[i]);
		g_rz[i] = z;
		mtx_rotateZ.rotateZ(rad(z));
		mtx_model.mul(mtx_rotateZ);
		
		// Move to individual position
		const w = 1.0/(g_obj_num*2);	// Width when arranged with one skipped
		let pos = -0.5 + (i * 2) * w;	// Arrange to become one side of a square
		mtx_pos.translate(0,0,pos);
		mtx_model.mul(mtx_pos);
		
		// Scale
		mtx_model.mul(mtx_scale);
		
		// Horizontal Rotation
		mtx_model.mul(mtx_rotateY);
		
		// Place in back
		mtx_model.mul(mtx_move);
		
		// Set to renderer
		g_renderingman.setModelMatrix(mtx_model);
		
		// Object Drawing
		g_renderingman.drawIndexedPrimitive(g_obj.vertexList,g_obj.vertexNum,
											g_obj.polyIndexList,g_obj.primitiveNum);
											
											
		// Update velocity
		g_accel[i] += (g_accel_add * g_a_dir[i]);
		
		// Switch to deceleration if max speed reached during acceleration
		if((g_a_dir[i] > 0) && (g_accel[i] >= g_accel_limit))
		{
			g_accel[i] = g_accel_limit;
			g_a_dir[i] *= -1;
		}
		
		// If state without acceleration continues for a while, update acceleration and rotate in reverse
		if((i == 0) && (g_a_dir[i] < 0) && g_accel[i] < -g_wait)
		{
			g_accel_limit = rnd(4) + 1;
			
			let d = rnd(6);
			for(let j = 0;j < g_obj_num;++j)
			{
				// Generate delay for each object
				g_next_accel[j].push(-(g_accel_limit / 3 + g_accel_add * d * j));
			}
			
			// First ring starts reverse rotation from here
			g_accel[0]  = g_next_accel[0][0];	g_next_accel[0].shift();
			g_a_dir[0] *= -1;
			g_r_dir[0] *= -1;
			
			// Reset if all acceleration is finished and angles are aligned
			if(g_accel[g_obj_num-1] <= 0)
			{
				for(let j = 1;j < g_obj_num;++j)
				{
					// Start reverse rotation with delay from here
					g_accel[j]  = g_next_accel[j][0];	g_next_accel[j].shift();
					g_a_dir[j] *= -1;
					g_r_dir[j] *= -1;
				}
			}
		}
		else if((i != 0) && (g_a_dir[i] < 0) && g_accel[i] < -g_wait)
		{
			if(g_next_accel[i].length > 0)
			{
				// Start reverse rotation with delay for each object
				g_accel[i]  = g_next_accel[i][0];	g_next_accel[i].shift();
				g_a_dir[i] *= -1;
				g_r_dir[i] *= -1;
			}
		}
	}

	// Post-drawing processing (Transfer to screen)
	g_renderingman.drawEnd();

}

function render_game()
{
	
	// Game drawing processing
	
	// Drawing wireframes etc.
	draw_wire();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render_game);

}

</script>
</head>
<body onload="init_game()">
	<div id="fps"></div>
	<div id="algo"></div>
	<canvas id="game-screen"></canvas>
</body>
</html>
