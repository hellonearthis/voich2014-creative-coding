<!DOCTYPE html>
<html>
<head>
<title>Papa's Stretching Cube 3</title>
<meta charset="utf-8">
<meta name="viewport" content="width=320, user-scalable=no, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<!--

	This demo attempts high-speed display using pseudo-3D display in JavaScript.
	
	This time, I used chaosgroove(@chaosgroove)-san's work as a base.
	https://twitter.com/chaosgroove/status/1215251400994648064?s=20
	
	Overwhelming thanks to the original author chaosgroove-san!
	
	(C)2020 Voich(@voich2014)


-->
<style type="text/css">
<!--
	html
	{
	    overflow: hidden;
	}

	body
	{
		overflow: hidden;
		background-color: black;
		color: #fff;
	}

	*
	{
		-webkit-user-select: none;
		   -moz-user-select: none;
		    -ms-user-select: none;
		        user-select: none;
	}

	#fps
	{
		position:absolute;
		color: #FFF;
		bottom:0px;
		z-index: 100;
	}

	.rotate
	{
		-webkit-transform: rotateX(56deg);
		   -moz-transform: rotateX(56deg);
		    -ms-transform: rotateX(56deg);
		     -o-transform: rotateX(56deg);
		        transform: rotateX(56deg);
	}
	
	#game-screen 
	{
		position:absolute;
	}

	#cube-chip
	{
		display: none;
	}

	#cube-mask
	{
		position:absolute;
	}

-->
</style>
<script type="text/javascript">

// Global Object
let g_game_width        = 320;
let g_game_height       = 500;

const COLOR_STEP        = 5;
const BLOCK_WIDTH       = 10;			// Diagonal of square
const BLOCK_HEIGHT      = 120;
const BLOCK_WIDTH_HIGH  = 16;			// For high resolution
const BLOCK_HEIGHT_HIGH = 180;

const BLOCK_W_NUM       = 32;
const BLOCK_H_NUM       = 32;
const CHECK_INTERVAL    = 1000;
const COLOR_CHANGE_WAIT = 1200;

let g_blocks            = [];			// For block management
let g_block_w_num       = BLOCK_W_NUM;	// Number of block columns
let g_block_h_num       = BLOCK_H_NUM;	// Number of block rows
let g_block_width       = BLOCK_WIDTH;
let g_block_height      = BLOCK_HEIGHT;
let g_last_check        = 0;			// Time last checked
let g_last_action       = 0;			// Time last moved
let g_last_color_change = 0;			// Time color was last changed
let g_color             = 0;			// Block color

const g_first_speed     = 0.942;		// Base initial velocity
const g_gravi_accel_up  = -0.027;		// Gravitational acceleration while ascending
const g_down_speed      = -0.045;		// Speed while descending
const g_delay_speed     = 0.55;			// Delay speed
const g_down_accel      = 0.095;		// Downward acceleration

let g_last_fps_time     = 0;
let g_fps_count         = 0;
let g_fps               = 60;

function rad(deg)
{
	// Degree -> Radian conversion
	return deg * Math.PI / 180;
}

function rnd(x)
{
	// Get random number
	return Math.floor(Math.random() * x);
}

function HEX02X(v)
{
	// %02X Conversion
	return (('00' + v.toString(16).toUpperCase()).substr(-2));
}

function hls2rgb(h,s,l)
{
	// Convert HLS to RGB
	//
	//  h(hue)       : Hue  Value from 0-359 [degrees]
	//  s(saturation): Saturation  Value from 0-1.0 [%]
	//  l(lightness) : Lightness  Value from 0-1.0 [%]
	//
	let max,min;
	let r,g,b;
	
	// Correct H just in case
	h = h % 360;

	if(l < 0.5)
	{
		max = 255 * (l + l * (s / 1.0));
		min  = 255 * (l - l * (s / 1.0));
	}
	else
	{
		max = 255 * (l + (1.0 - l) * (s / 1.0));
		min = 255 * (l - (1.0 - l) * (s / 1.0)); 
	}
	 
	if(h < 60)
	{
		r = max;
		g = min + (max - min) * (h / 60);
		b = min;
	}
	else if((h >= 60) && (h < 120))
	{
		r = min + (max - min) * ((120 - h) / 60);
		g = max;
		b = min;
	 }
	 else if((h >= 120) && (h < 180))
	 {
		r = min;
		g = max;
		b = min + (max - min) * ((h - 120) / 60);        
	}
	else if((h >= 180) && (h < 240))
	{
		r = min;
		g = min + (max - min) * ((240 - h) / 60);
		b = max;
	}
	else if((h >= 240) && (h < 300))
	{
		r = min + (max - min) * ((h - 240) / 60);
		g = min;
		b = max;
	}
	else if((h >= 300) && (h < 360))
	{
		r = max;
		g = min;
		b = min + (max - min) * ((360 - h) / 60); 
	}

	r =  Math.round(r);
	g =  Math.round(g);
	b =  Math.round(b);
	
	return `rgb(${r},${g},${b})`;
}

function init_game()
{
	
	// Game initialization processing
	
	// Screen Adjustment
	adjust_screen();
	
	// Generation of objects necessary for game
	create_obj();
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render_game);
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (g_fps_count*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;
		g_fps = (g_fps + fps) / 2;			// Mitigate FPS changes referenced during speed adjustment by averaging
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function adjust_screen()
{
	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width   = 1280;
		g_game_height  = 720;
		
		g_block_width  = BLOCK_WIDTH_HIGH;
		g_block_height = BLOCK_HEIGHT_HIGH;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width) / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;
	
	// Place mask
	let mask = document.getElementById("cube-mask");
	mask.style.left   = game_x+"px";
	mask.style.top    = game_y+"px";
	mask.width        = g_game_width;
	mask.height       = g_game_height;

}

function create_obj()
{
	// Object Generation
	
	// Prepare sprite chips
	let cube_chip   = document.getElementById("cube-chip");
	let ctx         = cube_chip.getContext("2d");
	const color_num = 360 / COLOR_STEP;
	const bl_w      = g_block_width;
	const bl_w2     = g_block_width / 2;
	const bl_h      = g_block_height;
	
	cube_chip.width  = color_num * bl_w;
	cube_chip.height = bl_w + bl_h;
	
	// Prepare blocks for each color
	for(let i = 0;i < color_num;++i)
	{
		// * Thought about changing color with HLS, but decided to fix it to gray
		
	    // Draw brighter side on the left
	    ctx.fillStyle = "#444";//hls2rgb(i * COLOR_STEP,1.0,0.4);
	    ctx.beginPath();
	    ctx.moveTo(i * bl_w,bl_w2);
	    ctx.lineTo(i * bl_w,bl_w+bl_h);
	    ctx.lineTo(i * bl_w + bl_w2,bl_w+bl_h);
	    ctx.lineTo(i * bl_w + bl_w2,bl_w2);
	    ctx.lineTo(i * bl_w,bl_w2);
	    ctx.closePath();
	    ctx.fill();
	    
	    // Draw darker side on the right
	    ctx.fillStyle = "#111";//hls2rgb(i * COLOR_STEP,1.0,0.2);
	    ctx.beginPath();
	    ctx.moveTo((i+1) * bl_w,bl_w2);
	    ctx.lineTo((i+1) * bl_w,bl_w+bl_h);
	    ctx.lineTo(i * bl_w + bl_w2,bl_w+bl_h);
	    ctx.lineTo(i * bl_w + bl_w2,bl_w2);
	    ctx.lineTo((i+1) * bl_w,bl_w2);
	    ctx.closePath();
	    ctx.fill();
	    
	    // Draw top square
		ctx.fillStyle   = "#666";//hls2rgb(i * COLOR_STEP,1.0,0.5);
		ctx.strokeStyle = ctx.fillStyle;
	    ctx.beginPath();
	    ctx.moveTo(i * bl_w,bl_w2);
	    ctx.lineTo(i * bl_w + bl_w2,0);
	    ctx.lineTo((i+1) * bl_w,bl_w2);
	    ctx.lineTo(i * bl_w + bl_w2,bl_w);
	    ctx.lineTo(i * bl_w,bl_w2);
	    ctx.closePath();
	    ctx.stroke();
	    ctx.fill();
	}
	
	// Generate block arrangement
	const sc_w  = g_game_width;
	const sc_h  = g_game_height;
	const sc_w2 = sc_w / 2;
	const sc_h2 = sc_h / 2;
	const sc_cx = sc_w2;
	const sc_cy = sc_h2;
	
	// Determine center point coordinates of each block
	// Set each parameter from there
	const aZ = rad(45);
	const w  = Math.sqrt(2) * bl_w2;
	for(let y = 0;y < g_block_h_num;++y)
	{
		const ypos = -(w * g_block_h_num / 2) + y * w + (w / 2);		// Center coordinates at (0,0)
		for(let x = 0;x < g_block_w_num;++x)
		{
			const xpos = -(w * g_block_w_num / 2) + x * w + (w / 2);	// Center coordinates at (0,0)
			
			// Rotate 45 degrees on Z axis
			const bl_cx = xpos * Math.cos(aZ) - Math.sin(aZ) * ypos;
			const bl_cy = xpos * Math.sin(aZ) + Math.cos(aZ) * ypos;
			
			// Determine top-left coordinates to draw Cube chip
			const sx = bl_cx - bl_w2 + sc_cx;
			const sy = bl_cy - bl_w2 + sc_cy;
			
			// Calculate distance from center
			const dx   = x - (g_block_w_num / 2);
			const dy   = y - (g_block_h_num / 2);
			let   dist = Math.sqrt(dx*dx+dy*dy);
			
			// Set dist to not move edge parts
			// Make negative to make it recognizable
			if((x == 0) || (y == 0) ||
			   (x == (g_block_w_num - 1)) || 
			   (y == (g_block_h_num - 1)))
		   	{
		   		dist = -1;
		   	}
			
			// Add object
			let obj = { x: sx, y: sy, dist: dist,
						pow: 0, spd: 0, delay: 0, down_spd: 0 };
			g_blocks.push(obj);
		}
	}

	// Generate mask to hide parts protruding from bottom
	let cube_mask = document.getElementById("cube-mask");
	let ctx_mask  = cube_mask.getContext("2d");
	
	ctx_mask.fillStyle = "#000";
    ctx_mask.beginPath();
    ctx_mask.moveTo(sc_w2,sc_h2 + bl_w * g_block_h_num / 2);
    ctx_mask.lineTo(sc_w2 + bl_w * g_block_w_num / 2,sc_h2);
    ctx_mask.lineTo(sc_w2 + bl_w * g_block_w_num / 2,sc_h);
    ctx_mask.lineTo(sc_w2 - bl_w * g_block_w_num / 2,sc_h);
    ctx_mask.lineTo(sc_w2 - bl_w * g_block_w_num / 2,sc_h2);
    ctx_mask.lineTo(sc_w2,sc_h2 + bl_w * g_block_h_num / 2);
    ctx_mask.closePath();
    ctx_mask.fill();

}

function draw_cube()
{
	// Drawing processing of stretching Cube	
	let screen    = document.getElementById("game-screen");	// Drawing destination canvas
	let cube_chip = document.getElementById("cube-chip");	// Canvas for sprite

	// Screen clear for every turn
	let ctx = screen.getContext("2d");
	ctx.clearRect(0,0,screen.width,screen.height);

	// Fast forward depending on current FPS
	let FF = Math.round(60 / (Math.ceil(g_fps / 10) * 10));
	if(FF < 1) 		 { FF =  1; }
	else if(FF > 30) { FF = 30; }
	
	// Move object
	const block_num = g_blocks.length;
	for(let i = 0;i < block_num;++i)
	{
		let bl = g_blocks[i];
		
		// Calculate block length
		let pow = bl.pow;
		for(let f = 0;f < FF;++f)
		{
			if(bl.delay > 0)
			{
				// Wait until can start moving
				bl.delay--;
				pow = 0;
			}
			else
			{
				// Stretch by speed
				pow += bl.spd;
				
				// Update extension allowance
				if(pow < 0){ pow = 0; }
				bl.pow = pow;
				
				// Update velocity
				if(bl.spd > 0)
				{	
					// Add gravitational acceleration during ascent
					bl.spd += g_gravi_accel_up;
				}
				else
				{
					// Fix speed during descent
					bl.spd = bl.down_spd;
				}
			}
		}
		
		// Extend
		pow = 1.0 + pow;
		
		// Object Drawing
		let bl_x = g_color * g_block_width;
		let bl_y = 0;
		let bl_w = g_block_width;
		let bl_h = g_block_width + g_block_height;
		let sp_x = bl.x;
		let sp_y = bl.y - pow * bl_w;
		
		ctx.drawImage(cube_chip,bl_x,bl_y,bl_w,bl_h,sp_x,sp_y,bl_w,bl_h);
	}

}

function check_start()
{
	// Time the start
	
	// Get current time
	let now_time = Date.now();
	
	// Check check period
	if((now_time - g_last_check) >= CHECK_INTERVAL)
	{
		// Check if block is moving
		const block_num = g_blocks.length;
		let action      = 0;
		for(let i = 0;i < block_num;++i)
		{
			if(g_blocks[i].pow != 0)
			{
				// Something is moving, so check and exit
				action = 1;
				break;
			}
		}
		
		// Update last moved time
		if(action)
		{	g_last_action = now_time;	}
		
		// Start moving if motionless period exceeds certain time
		if((now_time - g_last_action) >= CHECK_INTERVAL)
		{
			// Calculate edge distance
			const radius = (g_block_w_num / 2) * Math.sqrt(2);	// Calculate diagonal distance from Pythagorean theorem 1:1:√2

			for(let i = 0;i < block_num;++i)
			{
				// Set parameters according to distance from center
			
				const ratio  = (radius - g_blocks[i].dist) / radius;
				const iratio = 1 - ratio;
				
				g_blocks[i].spd      = (g_first_speed / 6) + g_first_speed
									    - (Math.sin(rad(iratio * 45)) * g_first_speed);		// Adjust so the mountain is rounded like an arc
				g_blocks[i].delay    = (g_blocks[i].dist * 10) * g_delay_speed;				// Delay in manner of moving away from center
				g_blocks[i].down_spd = g_down_speed - g_down_accel * ratio;					// Make center descent speed a bit faster
				g_blocks[i].pow      = -1;
				
				if(g_blocks[i].dist == 0)
				{
					// No delay at center
					g_blocks[i].delay = 0;
				}
				else
				{
					if(g_blocks[i].dist < 0)
					{
						// Because it's an edge block that doesn't move,
						// Set velocity to 0
						g_blocks[i].spd      = 0;
						g_blocks[i].down_spd = 0;
						g_blocks[i].pow      = 0;
					}
					else
					{
						// Give variation
						g_blocks[i].spd   -= (rnd(4) / 10);
						g_blocks[i].delay += (rnd(8) / 10);
					}
				}
			}
		}
	}
	
	// Color change time check
	if((now_time - g_last_color_change) >= COLOR_CHANGE_WAIT)
	{
		// Color Change
		g_color++;
		g_color %= (360 / COLOR_STEP);
		g_last_color_change = now_time;
	}

}

function render_game()
{
	
	// Game drawing processing
	
	// Draw stretching Cube
	draw_cube();
	
	// Time the start
	check_start();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render_game);

}

</script>
</head>
<body onload="init_game()">
	<div id="fps"></div>
	<canvas id="game-screen" class="rotate"></canvas>
	<canvas id="cube-chip"></canvas>
	<canvas id="cube-mask" class="rotate"></canvas>
</body>
</html>
