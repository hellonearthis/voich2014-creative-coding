<!DOCTYPE html>
<html>
<head>
<title>Papa's Sparkling Reflective Text</title>
<meta charset="utf-8">
<meta name="viewport" content="width=320, user-scalable=no, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">

<link rel="stylesheet" href="./../vlib/vl_common_v1.0.0.css">
<script type="text/javascript" src="./../vlib/vl_common_v1.6.0.js"></script>
<script type="text/javascript" src="./../vlib/vl_3d_v1.2.0.js"></script>
<style type="text/css">
</style>
<script type="text/javascript">

// Global Object
let g_game_width    = 320;
let g_game_height   = 500;

let g_time          = 0;		// Current time [ms]
let g_dtime         = 0;		// Elapsed time since last drawing [ms]

const TAU           = 2.0 * Math.PI;
let g_pn            = new Perlin();
let g_screen_ctx    = null;
let g_bloom_offscs  = [];		// Off-screen canvas for Bloom processing
let g_scale         = 1.0;

const MORPH_TIME    = 10000;
const LINE_NUM      = 70;
const MOVE_SPEED    = 0.8;
const MIN_c         = 0.01;
const MAX_c         = 0.15;
const MIN_r         = 8.0;
const MAX_r         = 10.0;
const MIN_nx        = 0.05;
const MAX_nx        = 0.8;

let g_pos           = [];
let g_start_cv      = null;
let g_start_ctx     = null;
let g_next_cv       = null;
let g_next_ctx      = null;
let g_offsc         = null;
let g_nextsc        = null;

let g_start_time    = 0;
let g_next_time     = 0;
let g_start_c       = 0;
let g_next_c        = 0;
let g_start_r       = 0;
let g_next_r        = 0;
let g_start_nx      = 0;
let g_next_nx       = 0;
let g_lasttime      = 0;

let g_def1_colors   = [];
let g_def2_colors   = [];
let g_start_colors  = [];
let g_next1_colors  = [];
let g_next2_colors  = [];

let g_last_fps_time = 0;
let g_fps_count     = 0;
let g_fps           = 60;
let g_fps_list      = [];
let g_fps_visible   = true;

let g_cnt           = 0;

function init()
{
	
	// Initialization processing
	
	// Preparation
	setup();
	
	// Toggle FPS display ON/OFF with click or tap
	toggle_fps_visible();
	window.onmousedown = toggle_fps_visible;
	window.ontouchdown = toggle_fps_visible;
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render);
	
}

function adjust_screen()
{

	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 460;
		g_game_height = 720;
		g_scale       = g_game_width / 320;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width)  / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;
	
}

function setup_obj()
{

	// Preparation of object
	
	// Get Context of main screen in advance
	const screen = document.getElementById("game-screen");
	g_screen_ctx = screen.getContext("2d");
	
	// Generate default palette from coolors.co URL
	const url1    = "https://coolors.co/485696-e7e7e7-f9c784-fc7a1e-f24c00";
	const url2    = "https://coolors.co/e4572e-17bebb-ffc914-2e282a-76b041";
	g_def1_colors = createPaletteNHSL(url1);
	g_def2_colors = createPaletteNHSL(url2);
		
	// Prepare canvas for mask image
	const sc_w  = screen.width;
	const sc_h  = screen.height;
	const sc_w2 = sc_w / 2;
	const sc_h2 = sc_h / 2;
	
	g_start_cv  = document.createElement("canvas");
	g_start_ctx = g_start_cv.getContext("2d");
	g_next_cv   = document.createElement("canvas");
	g_next_ctx  = g_next_cv.getContext("2d");
	
	g_start_cv.width  = sc_w2;
	g_start_cv.height = sc_h2;
	g_next_cv.width   = sc_w2;
	g_next_cv.height  = sc_h2;
	
	// For confirmation
	if(0)
	{
		g_start_cv.style.display  = "block";
		g_start_cv.style.position = "absolute";
		g_start_cv.style.left     = "0px";
		g_start_cv.style.top      = "0px";
		g_next_cv.style.display   = "block";
		g_next_cv.style.position  = "absolute";
		g_next_cv.style.left      = (sc_w2 + 10) + "px";
		g_next_cv.style.top       = "0px";
		
		document.body.appendChild(g_start_cv);
		document.body.appendChild(g_next_cv);
	}
	
	// Prepare line info
	for(let i = 0;i < LINE_NUM;++i)
	{
		g_pos.push({});
	}
	
}

function setup_bloom()
{
	// Preparation for Bloom Processing
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	let scale = 0.5;
	for(let i = 0;i < 2;++i)
	{
		const cv   = document.createElement("canvas");
		const ctx  = cv.getContext("2d");
		const cv_w = sc_w * scale;
		const cv_h = sc_h * scale;
		
		cv.width  = sc_w * scale;
		cv.height = sc_h * scale;
		cv.style.display = "none";
		
		let info =
		{
			cv: cv, cv_w: cv_w, cv_h: cv_h,
			ctx: ctx
		};
		g_bloom_offscs.push(info);
		
		scale /= 2.0;
	}
}

function do_bloom(ctx,draw_screen)
{
	// Execute Bloom Processing
	
	// Apply filter to image after rendering
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	//
	// Doing simple bloom processing.
	//
	// Because it's not extracting only high luminance parts, but whole thing looks glowing,
	// I think it's a bit different from original bloom processing, but anyway
	// Might be easy if you want to make it glow easily (*´ω｀*)
	//
	
	// To off-screen canvas with resolution lowered by half vertically and horizontally in multiple stages
	// Apply Canvas Blur filter, enlarge and additive blend
	const offsc_num = g_bloom_offscs.length;
	let blur_w = [ 5,10 ];
	for(let idx = 0;idx < offsc_num;++idx)
	{
		// Get current state from canvas displayed on screen
		let offsc = g_bloom_offscs[idx];
		offsc.ctx.clearRect(0,0,offsc.cv_w,offsc.cv_h);
		offsc.ctx.drawImage(draw_screen,0,0,sc_w,sc_h,0,0,offsc.cv_w,offsc.cv_h);

		// Reflect on screen (additive blending) while applying filter to reduced image
		ctx.save();
		ctx.globalAlpha = 1.0;
		ctx.globalCompositeOperation = 'lighter';
		ctx.filter="blur("+blur_w[idx]+"px)";
		ctx.drawImage(offsc.cv,0,0,offsc.cv_w,offsc.cv_h,0,0,sc_w,sc_h);
		ctx.restore();
		
		// If draw_screen is the same as the display canvas
		// ^ Get the composited result and enlarge it, so blur
		// I think ... is applied tightly.
	}
}

function reset_pos(info)
{

	// Determine initial position of line
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	while(1)
	{
		// Repeat until movable part
		const x = rnd(sc_w);
		const y = rnd(sc_h);
		if(init_pos(info,x,y))
		{
			// Decision
			break;
		}
	}
	
}

function init_pos(info,x,y)
{
	
	// Initial setting of line
	const mw = g_start_cv.width;
	let data = g_offsc.data;
	let ret  = false;
	
	// Was it a movable place?
	const p  = (Math.floor(y / 2) * mw + Math.floor(x / 2)) * 4;
	if(data[p] >= 128)
	{
		// Decision
		info.x  = x;
		info.y  = y;
		info.a  = rnd(360);
		
		ret = true;
	}
	
	return ret;
	
}

function setup()
{
	
	// Preparation
		
	// Screen Adjustment
	adjust_screen();
	
	// Preparation of object
	setup_obj();
	
	// Preparation for Bloom Processing
	setup_bloom();

	// Determine initial value
	// * Calling reset() twice because start value becomes undefined if called once
	g_next1_colors = g_def1_colors.slice();
	g_next2_colors = g_def2_colors.slice();
	reset();
	reset();
	g_offsc = g_start_ctx.getImageData(0,0,g_start_cv.width,g_start_cv.height);
	for(let i = 0;i < g_pos.length;++i)
	{	reset_pos(g_pos[i]);	}
	
}

function create_text_mask(cv,ctx)
{
	
	// Create text mask image
	
	// Get canvas size
	const cv_w = cv.width;
	const cv_h = cv.height;
	
	// Fill with black
	ctx.fillStyle = "black";
	ctx.fillRect(0,0,cv_w,cv_h);
	
	// Draw white text
	const moji = "1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ";
	const m    = moji.substr(rnd(moji.length),1);
	ctx.fillStyle    = "white";
	ctx.textBaseline = "middle";
	ctx.font = "normal bold "+(cv_h * 0.6)+"px sans-serif";
	ctx.fillText(m,(cv_w - ctx.measureText(m).width) / 2,cv_h / 2);

}

function reset()
{

	// Determine next target value
	
	g_start_c  = g_next_c;
	g_start_r  = g_next_r;
	g_start_nx = g_next_nx;
	
	g_next_c   = Math.min(MIN_c  + rnd(MAX_c *1000)/1000,MAX_c );
	g_next_r   = Math.min(MIN_r  + rnd(MAX_r *1000)/1000,MAX_r );
	g_next_nx  = Math.min(MIN_nx + rnd(MAX_nx*1000)/1000,MAX_nx);
	
	// Determine palette
	g_start_colors = g_next1_colors.slice();	// Pass-by-value copy of array
	g_next1_colors = g_next2_colors.slice();	// Pass-by-value copy of array
	g_next2_colors = g_def1_colors.slice();		// Set as initial value of next palette
	getColormind(function(palette)
	{
		// Get 5-color palette from Colormind
		g_next2_colors = rgbAA2hslNA(palette);		
	});

	// Set text mask
	g_start_ctx.drawImage(g_next_cv,0,0);
	create_text_mask(g_next_cv,g_next_ctx);
	
	// Update off-screen data
	g_offsc = g_nextsc;
	setTimeout(function()
	{
		// Delayed execution because smartphone might freeze during getImageData
		g_nextsc = g_start_ctx.getImageData(0,0,g_start_cv.width,g_start_cv.height);
	},10);
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// Add to FPS history
		g_fps_list.push(g_fps_count);
		if(g_fps_list.length > 10)
		{	
			// Delete first and keep up to past n times
			// Use average of FPS (moving average)
			g_fps_list.shift();
		}
		let fps_ave = 0;
		for(let i = 0;i < g_fps_list.length;++i)
		{	fps_ave += g_fps_list[i];	}
		fps_ave /= g_fps_list.length;
		
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (fps_ave*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;// + " y="+g_y+" z="+g_z+" r="+g_r;
		g_fps = fps_ave;
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function toggle_fps_visible()
{
	// Toggle FPS display ON/OFF
	
	// Invert display flag
	g_fps_visible = !g_fps_visible;
	
	// Control visible based on display flag
	let fps_div = document.getElementById("fps");
	fps_div.style.display = g_fps_visible ? "block" : "none";

}

function draw()
{

	// Drawing Core

	// Save start time
	if(g_start_time == 0)
	{
		g_start_time = g_time;
		g_next_time  = g_time + MORPH_TIME;
	}
	
	// Because if too fast, the goodness is halved
	// Intentionally make it less than 15fps
	if((g_time - g_lasttime) < 66)
	{	return;	 }
	g_lasttime = g_time;
	
	// Screen Clear
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	const ctx  = g_screen_ctx;
	ctx.clearRect(0,0,sc_w,sc_h);
	
	ctx.save();
	ctx.globalCompositeOperation = 'lighter';
	ctx.lineCap = "round";
		
	// Preparation of scene
	let time = (g_time - g_start_time) / MORPH_TIME;
	if(time > 1.0){ time = 1.0; }
	const e    = Ease.easeInExpo(time**8);
	const ce   = Ease.easeInSine(time);
	const pn   = Math.max(g_pn.perlin(g_time * 0.0005,0,0),0.0);
	const dist = Math.max(Math.floor((pn * pn) * 150),1.0);

	// Calculate parameters for this turn
	const add_c  = g_start_c  + e * (g_next_c - g_start_c);
	const r_amp  = g_start_r  + e * (g_next_r  - g_start_r );
	const add_nx = g_start_nx + e * (g_next_nx - g_start_nx);
	const td     = 800;
	const t      = g_time / td;
	const tt     = t / 4;
	
	// Prepare various tables for speed optimization
	const colors = [];
	for(let i = 0;i < g_start_colors.length;++i)
	{
		const col = 
		{
			h: SL.mix(g_start_colors[i].h,
					  g_next1_colors[i].h,ce),
			s: SL.mix(g_start_colors[i].s,
					  g_next1_colors[i].s,ce),
			l: SL.mix(g_start_colors[i].l,
					  g_next1_colors[i].l,ce)
		};
		colors.push(col);
	}
	const hls_colors = [];
	for(let i = 0;i < colors.length;++i)
	{
		const col = colors[i];
		const h   = col.h * 360;
		const s   = Math.floor(col.s * 100)+"%";
		const l   = (col.l < 0.90) ? "50%" : (Math.floor(col.l * 100)+"%");
		hls_colors.push(`hsl(${h},${s},${l})`);
	}
	
	// Move line
	const mw   = g_start_cv.width;
	const data = g_offsc.data;
	let nx     = 0;
	let c      = 0;
	for(let i = 0;i < g_pos.length;++i)
	{
		const ds = MOVE_SPEED;
		let pos  = g_pos[i];
		let sa   = ds * Math.sin(rad(pos.a));
		let ca   = ds * Math.cos(rad(pos.a));
		let move = 0;
		
		// Select color
		let pal = Math.floor(c) % colors.length;
		c += add_c;
		
		// Determine circle size with noise
		const n = Math.abs(g_pn.perlin(t + nx,0,tt) * r_amp) * g_scale;
		nx += add_nx;
		
		ctx.save();
		ctx.lineWidth   = n;
		ctx.strokeStyle = hls_colors[pal];
		ctx.beginPath();
		ctx.moveTo(pos.x,pos.y);
		for(let j = 0;j < dist;++j)
		{
			const nx = pos.x + ca;
			const ny = pos.y + sa;
			const p  = (Math.floor(ny * 0.5) * mw + Math.floor(nx * 0.5)) * 4;
			
			if(data[p] < 128)
			{
				// Hit an immovable place
				
				// Draw a line up to here for now
				ctx.lineTo(pos.x,pos.y);
				ctx.stroke();
				ctx.moveTo(pos.x,pos.y);
				
				// Determine new angle
				pos.a = pos.a - (90 + rnd(180));
				sa    = ds * Math.sin(rad(pos.a));
				ca    = ds * Math.cos(rad(pos.a));

				continue;
			}
			
			pos.x = nx;
			pos.y = ny;
			move++;
		}
		ctx.lineTo(pos.x,pos.y);
		ctx.stroke();
		ctx.restore();
		
		// Reset location if unable to move even once
		if(move == 0)
		{
			reset_pos(pos);
		}
	}
	
	ctx.restore();
	
	// Bloom Processing
	let screen = document.getElementById("game-screen");
	do_bloom(ctx,screen);
	
	// Fade In/Out
	const dt   = g_time - g_start_time;
	const fdin = 500;
	if(dt < fdin)
	{
		// Fade In
		const fade = 1.0 - dt / fdin;
		ctx.fillStyle = `rgba(0,0,0,${fade})`;
		ctx.fillRect(0,0,sc_w,sc_h);
	}
	else if(dt > (MORPH_TIME - fdin))
	{
		// Fade Out
		const fade = 1.0 - (MORPH_TIME - dt) / fdin;
		ctx.fillStyle = `rgba(0,0,0,${fade})`;
		ctx.fillRect(0,0,sc_w,sc_h);
	}
	
	// Deformation end time check
	if(g_time >= g_next_time)
	{
		// Determine next break time and reset
		g_start_time = g_time;
		g_next_time  = g_start_time + MORPH_TIME;
		reset();
	}
	
}

function render()
{
	
	// Drawing processing for every turn
	
	// Time Calculation
	const last_time = g_time;
	g_time = (new Date).getTime();
	if(last_time == 0)
	{	g_dtime = 0;	}
	else
	{	g_dtime = g_time - last_time;	}
	
	// Drawing Core
	draw();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render);

}

</script>
</head>
<body onload="init()">
	<div id="fps"></div>
	<canvas id="game-screen"></canvas>
</body>
</html>
