<script type="text/javascript">

// Global Object
var g_game_width    = 320;
var g_game_height   = 500;

const g_sprite_num  = 2048;		// Total number of sprites

var g_sprite        = [];
var g_r0            = 0;
var g_r1            = 1;
var g_cnt           = 0;
var g_id            = 0;

var g_offsc;					// Off-screen for manual line drawing
var g_color;					// Color object for manual line drawing
var g_funcDrawBegin;			// Pre-drawing processing function object
var g_funcDrawEnd;				// Post-drawing processing function object
var g_funcDrawLine;				// Line drawing processing function object
var g_funcDrawPoint;			// Point drawing processing function object
var g_line_algo;				// Index of currently selected Line drawing algorithm

var g_last_fps_time = 0;
var g_fps_count     = 0;

function rad(deg)
{
	// Degree -> Radian conversion
	return deg * Math.PI / 180;
}

function rnd(x)
{
	// Get random number
	return Math.floor(Math.random() * x);
}

function max(a,b)
{
	// Return larger one
	return Math.max(a,b);
}

function min(a,b)
{
	// Return smaller one
	return Math.min(a,b);
}

function init_game()
{
	
	// Game initialization processing
	
	// Screen Adjustment
	adjust_screen();
	
	// Generation of objects necessary for game
	create_obj();
	
	// Prepare drawing processing method
	g_line_algo = 3-1;
	change_line_algorithm();
	window.onmousedown = change_line_algorithm;
	window.ontouchdown = change_line_algorithm;
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	var requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render_game);
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	var now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// FPS Display
		var fps_div = document.getElementById("fps");
		fps_div.innerText = "FPS:"+(g_fps_count*(1000/(now_time - g_last_fps_time)));
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function adjust_screen()
{
	// Screen Adjustment
	
	// Get window size
	var window_w = window.innerWidth;
	var window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 1280;
		g_game_height = 720;
	}
	
	// Place game screen in center
	var screen  = document.getElementById("game-screen");
	var game_x  = (window_w - g_game_width) / 2;
	var game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

	// Create ImageData for off-screen
	var ctx = screen.getContext("2d");
	g_offsc = ctx.createImageData(g_game_width,g_game_height);
	
}

function create_obj()
{
	// Object Generation
	
	// Initialize sprite object information
	for(var i = 0;i < g_sprite_num;++i)
	{
		var obj = { x: 0, y: 0, z: 0, v: 0 };
		g_sprite.push(obj);
	}

}

function change_line_algorithm()
{
	// Selection of LINE drawing algorithm
	
	g_line_algo = (g_line_algo + 1) % 4;
	
	switch(g_line_algo)
	{
		case 0:	// Default LINE drawing
			setup_draw_default();
			break;
			
		case 1:	// Bresenham LINE Drawing
			setup_draw_bresenham();
			break;
			
		case 2:	// Double Step Bresenham LINE Drawing
			setup_draw_doublestep_bresenham();
			break;
		
		case 3:	// Fake Anti-aliased Bresenham LINE Drawing
			setup_draw_bresenham_aa();
			break;
	}

}

function setup_draw_default()
{
	// Prepare default LINE drawing function
	
	g_funcDrawBegin = drawBegin_default;
	g_funcDrawEnd   = drawEnd_default;
	g_funcDrawLine  = drawLine_default;

	var algo_div = document.getElementById("algo");
	algo_div.innerText = "context.lineTo";
		
}

function drawBegin_default(ctx,sc_w,sc_h)
{
	// Default LINE drawing pre-processing
	
	// Screen Clear
	ctx.clearRect(0,0,sc_w,sc_h);
	
	// Determine wire color
	ctx.strokeStyle = 'lime';
	
	// Instruction to start drawing registration
	ctx.beginPath();
	
}

function drawEnd_default(ctx,sc_w,sc_h)
{
	// Default LINE drawing post-processing
	
	// Instruction to execute drawing
	ctx.stroke();
	
}

function drawLine_default(ctx,sc_w,sc_h,x1,y1,x2,y2)
{
	// Default LINE drawing processing
	
	// LINE Drawing
	ctx.moveTo(x1,y1);
	ctx.lineTo(x2,y2);
	
}

function setup_draw_bresenham()
{
	// Prepare Bresenham LINE drawing function
	
	g_funcDrawBegin = drawBegin_bresenham;
	g_funcDrawEnd   = drawEnd_bresenham;
	g_funcDrawLine  = drawLine_bresenham;
	g_funcDrawPoint = drawPoint_bresenham;

	var algo_div = document.getElementById("algo");
	algo_div.innerText = "bresenham line";
	
}

function drawBegin_bresenham(ctx,sc_w,sc_h)
{
	// Bresenham LINE drawing pre-processing

	// Fast Clear
	var data = g_offsc.data;	// Move reference to local variable temporarily
	data.fill(0);				// Faster than counting with for loop if zero-filling
	
	// Determine wire color
	g_color = { r: 0, g: 255, b: 0, a: 255 };

}

var aaa = 0;

function drawEnd_bresenham(ctx,sc_w,sc_h)
{
	// Bresenham LINE drawing post-processing
	
// For testing
/*	
	var x = 200;
	var y = 200;
	var l = 150;
	var xx = x + Math.cos(rad(aaa)) * l;
	var yy = y + Math.sin(rad(aaa)) * l;
	
	//drawLine_doublestep_bresenham(ctx,sc_w,sc_h,x,y,xx,yy);
	drawLine_bresenham_aa(ctx,sc_w,sc_h,x,y,xx,yy);
	
	//aaa += 1;
	aaa = 360-70;
	aaa = 280;
*/
/*
	var x  = 100;
	var y  = 100;
	var xx = 95;
	var yy = 160;
	//drawLine_doublestep_bresenham(ctx,sc_w,sc_h,x,y,xx,yy);
	drawLine_bresenham(ctx,sc_w,sc_h,x,y,xx,yy);
*/
	
	// Transfer off-screen
	ctx.putImageData(g_offsc,0,0);
	
}

function drawLine_bresenham(ctx,sc_w,sc_h,x1,y1,x2,y2)
{
	// Bresenham LINE drawing processing
	
	// Convert to integer (Important! if not done, writing to ImageData will fail)
	x1 = Math.floor(x1);
	y1 = Math.floor(y1);
	x2 = Math.floor(x2);
	y2 = Math.floor(y2);
	
	// Parameter preparation
	var dx   = Math.abs(x2 - x1);
	var dy   = Math.abs(y2 - y1);
	var addX = (x1 < x2) ? 1 : -1;
	var addY = (y1 < y2) ? 1 : -1;

	// Clipping
	if(((x1 < 0) && (x2 < 0)) || ((x1 >= sc_w) && (x2 >= sc_w)) ||
	   ((y1 < 0) && (y2 < 0)) || ((y1 >= sc_h) && (y2 >= sc_h)))
	{	return;	}
	
	if(dx > dy)
	{
		// Loop by X
		var diff = Math.floor(dy - dx / 2);

		while(x1 != x2)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);

			// Update Coordinates
			x1 += addX;
			if(diff >= 0)
			{
				y1   += addY;
				diff -= dx;
			}
			diff += dy;
		}
	}
	else
	{
		// Loop by Y
		var diff = Math.floor(dx - dy / 2);

		while(y1 != y2)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);

			// Update Coordinates
			y1 += addY;
			if(diff >= 0)
			{
				x1   += addX;
				diff -= dy;
			}
			diff += dx;
		}
	}

	// Draw end point
	g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
	
}

function drawPoint_bresenham(sc_w,sc_h,x,y,color)
{
	// Point drawing for Bresenham line drawing
	
	// Clip and draw
	if((x >= 0) && (x < sc_w) && (y >= 0) && (y < sc_h))
	{
		var pos = sc_w * 4 * y + 4 * x;
		g_offsc.data[pos + 0] = color.r;
		g_offsc.data[pos + 1] = color.g;
		g_offsc.data[pos + 2] = color.b;
		g_offsc.data[pos + 3] = color.a;
	}
	
}

function setup_draw_doublestep_bresenham()
{
	// Prepare double-step Bresenham LINE drawing function
	
	g_funcDrawBegin = drawBegin_bresenham;
	g_funcDrawEnd   = drawEnd_bresenham;
	g_funcDrawLine  = drawLine_doublestep_bresenham;
	g_funcDrawPoint = drawPoint_bresenham;

	var algo_div = document.getElementById("algo");
	algo_div.innerText = "double-step bresenham line";
	
}

function drawLine_doublestep_bresenham(ctx,sc_w,sc_h,x1,y1,x2,y2)
{
	// Double-step Bresenham LINE drawing processing
	
	// Convert to integer (Important! if not done, writing to ImageData will fail)
	x1 = Math.floor(x1);
	y1 = Math.floor(y1);
	x2 = Math.floor(x2);
	y2 = Math.floor(y2);
	
	// Parameter preparation
	var dx   = Math.abs(x2 - x1);
	var dy   = Math.abs(y2 - y1);
	var addX = (x1 < x2) ? 1 : -1;
	var addY = (y1 < y2) ? 1 : -1;
	var e,n,nn; // e is accumulated error value
	
	// Clipping
	if(((x1 < 0) && (x2 < 0)) || ((x1 >= sc_w) && (x2 >= sc_w)) ||
	   ((y1 < 0) && (y2 < 0)) || ((y1 >= sc_h) && (y2 >= sc_h)))
	{	return;	}
	
	// When completely horizontal line
	if(dy == 0)
	{
		// Loop is half the difference since proceeding from both ends
		n = dx >> 1;	//n = dx / 2;
		
		// Drawing Loop
		for(var i = 0;i <= n;++i)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
			g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
			
			// Update drawing position
			x1 += addX;
			x2 -= addX;
		}
	
		// Draw last 1 pixel if drawing amount is odd
		if((dx & 0x01) == 0)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1 - addX,y1,g_color);
		}
	}
	// When completely vertical line
	else if(dx == 0)
	{
		// Loop is half the difference since proceeding from both ends
		n = dy >> 1;	//n = dy / 2;
		
		// Drawing Loop
		for(var i = 0;i <= n;++i)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
			g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);

			// Update drawing position
			y1 += addY;
			y2 -= addY;
		}
	
		// Draw last 1 pixel if drawing amount is odd
		if((dy & 0x01) == 0)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1 - addY,g_color);
		}
	}
	else if(dx >= dy) 
	{
		// When looping for X

		// Initialize error value
		e = -dx;

		// Calculation of loop count
		n = (dx + 1) >> 2;	//n = (dx + 1) / 4;

		// In case m < 1/2, m = |x2 - x1| / |y2 - y1|
		if((dy << 2) < (dx << 1))
		{
			for(var i = 0;i < n;++i)
			{
				// Update error value
				e += (dy << 2);	//e += 4dy;
				
				if(e < 0)
				{
					// ●●○

					// Draw points for 2 pixels simultaneously
					g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
					g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
					g_funcDrawPoint(sc_w,sc_h,x1 + addX,y1,g_color);
					g_funcDrawPoint(sc_w,sc_h,x2 - addX,y2,g_color);
					
					// Update drawing position
					x1 += (addX << 1);	//x1 += 2addX;
					x2 -= (addX << 1);	//x2 -= 2addX;
				}
				else
				{
					if(e < (dy << 1))	//if(e < 2dy)
					{
						//    ○
						// ●●

						// Draw points for 2 pixels simultaneously
						g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
						g_funcDrawPoint(sc_w,sc_h,x1 + addX,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2 - addX,y2,g_color);
						
						// Update drawing position
						x1 += (addX << 1);	//x1 += 2addX;
						x2 -= (addX << 1);	//x2 -= 2addX;
						y1 += addY;
						y2 -= addY;
						
						// Update error value
						e -= (dx << 1);		//e -= 2dx;
					}
					else
					{
						//  ●○
						// ●

						// Draw 2 pixels simultaneously

						// Draw 1st pixel
						g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
						
						// Update drawing position
						y1 += addY;
						y2 -= addY;
						
						// Draw 2nd pixel
						g_funcDrawPoint(sc_w,sc_h,x1 + addX,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2 - addX,y2,g_color);

						// Update drawing position
						x1 += (addX << 1);	//x1 += 2addX; 
						x2 -= (addX << 1);	//x2 -= 2addX;
							
						// Update error value
						e -= (dx << 1);		//e -= 2dx;
					}
				}
			}
		}
		// Case 1/2 ≦ m ≦ 1: m = |y2 - y1| / |x2 - x1|
		else
		{
			for(var i = 0;i < n;++i)
			{
				// Update error value
				e += ((dy << 2) - (dx << 1));	//e += 4dy - 2dx;
				
				if(e >= 0)
				{	
					//    ○
					//  ●
					// ●

					// Draw 2 pixels simultaneously
					g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
					g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
					g_funcDrawPoint(sc_w,sc_h,x1 + addX,y1 + addY,g_color);
					g_funcDrawPoint(sc_w,sc_h,x2 - addX,y2 - addY,g_color);

					// Update drawing position
					x1 += (addX << 1);	//x1 += 2addX;
					x2 -= (addX << 1);	//x2 -= 2addX;
					y1 += (addY << 1);	//y1 += 2addY;
					y2 -= (addY << 1);	//y2 -= 2addY;
					
					// Update error value
					e -= (dx << 1);		//e -= 2dx;
				}
				else
				{
					if(e < ((dy << 1) - (dx << 1)))	//if(e < 2dy - 2dx)
					{
						//    ○
						// ●●

						// Draw 2 pixels simultaneously
						g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
						g_funcDrawPoint(sc_w,sc_h,x1 + addX,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2 - addX,y2,g_color);

						// Update drawing position
						x1 += (addX << 1);	//x1 += 2addX;
						x2 -= (addX << 1);	//x2 -= 2addX;
						y1 += addY;
						y2 -= addY;
					}
					else
					{
						//  ●○
						// ●

						// Draw 2 pixels simultaneously
						
						// Draw 1st pixel
						g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);

						// Update drawing position
						y1 += addY;
						y2 -= addY;
						
						// Draw 2nd pixel
						g_funcDrawPoint(sc_w,sc_h,x1 + addX,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2 - addX,y2,g_color);

						// Update drawing position
						x1 += (addX << 1);	//x1 += 2addX;
						x2 -= (addX << 1);	//x2 -= 2addX;
					}
				}
			}
		}

		// Draw fractional part less than 4 pixels
		
		// Calculate loop count
		n = ((dx + 1) % 4);
		
		for(var i = 0;i < n;++i)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
			
			// Update drawing position
			x1 += addX;
			
			// Update error value
			e += (dy << 1);		//e += 2dy;

			if(e >= 0)
			{
				// Update drawing position
				y1 += addY;

				// Update error value
				e -= (dx << 1);		//e -= 2dx;
			}
		}
	}
	else
	{
		// Loop for Y

		// Initialize error value
		e = -dy;

		// Calculate loop count
		n = (dy + 1) >> 2;	//n = (dy + 1) / 4;

		// In case m < 1/2, m = |y2 - y1| / |x2 - x1|
		if(dy >= (dx << 1))
		{
			for(var i = 0; i < n;++i)
			{
				// Update error value
				e += (dx << 2);	//e += 4dx;
				
				if(e < 0)
				{
					//○
					// ●
					// ● 
					
					// Draw 2 pixels simultaneously
					g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
					g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
					g_funcDrawPoint(sc_w,sc_h,x1,y1 + addY,g_color);
					g_funcDrawPoint(sc_w,sc_h,x2,y2 - addY,g_color);
					
					// Update drawing position
					y1 += (addY << 1);	//y1 += 2addY;
					y2 -= (addY << 1);	//y2 -= 2addY;
				}
				else
				{
					if(e < (dx << 1))	//if(e < 2dx)
					{
						//  ○
						// ●
						// ●

						// Draw 2 pixels simultaneously
						g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
						g_funcDrawPoint(sc_w,sc_h,x1,y1 + addY,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2 - addY,g_color);

						// Update drawing position
						y1 += (addY << 1);	//y1 += 2addY;
						y2 -= (addY << 1);	//y2 -= 2addY;
						x1 += addX;
						x2 -= addX;
						
						// Update error value
						e -= (dy << 1);		//e -= 2dy;
					}
					else
					{
						//  ○
						//  ●
						// ●

						// Draw 2 pixels simultaneously

						// Draw 1st pixel
						g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
						
						// Update drawing position
						x1 += addX;
						x2 -= addX;
						
						// Draw 2nd pixel
						g_funcDrawPoint(sc_w,sc_h,x1,y1 + addY,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2 - addY,g_color);
						
						// Update drawing position
						y1 += (addY << 1);	//y1 += 2addY;
						y2 -= (addY << 1);	//y2 -= 2addY;
						
						// Update error value
						e -= (dy << 1);		//e -= 2dy;
					}
				}
			}
		}
		// Case 1/2 ≦ m ≦ 1: m = |y2 - y1| / |x2 - x1|
		else
		{
			for(var i = 0;i < n;++i)
			{
				// Update error value
				e += (dx << 2) - (dy << 1);		//e += (4dx - 2dy);
				
				if(e >= 0)
				{
					//    ○
					//  ●
					// ●

					// Draw 2 pixels simultaneously
					g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
					g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
					g_funcDrawPoint(sc_w,sc_h,x1 + addX,y1 + addY,g_color);
					g_funcDrawPoint(sc_w,sc_h,x2 - addX,y2 - addY,g_color);
					
					// Update drawing position
					x1 += (addX << 1);	//x1 += 2addX;
					x2 -= (addX << 1);	//x2 -= 2addX;
					y1 += (addY << 1);	//y1 += 2addY;
					y2 -= (addY << 1);	//y2 -= 2addY;
					
					// Update error value
					e -= (dy << 1);		//e -= 2dy;
				}
				else
				{
					if(((dx << 1) - (dy << 1)) > e)	//if((2dx - 2dy) > e)
					{
						//  ○
						// ●　
						// ●

						// Draw 2 pixels simultaneously
						g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
						g_funcDrawPoint(sc_w,sc_h,x1,y1 + addY,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2 - addY,g_color);

						// Update drawing position
						y1 += (addY << 1);	//y1 += 2addY;
						y2 -= (addY << 1);	//y2 -= 2addY;
						x1 += addX;
						x2 -= addX;
					}
					else
					{
						//  ○
						//  ●
						// ●

						// Draw 2 pixels simultaneously

						// Draw 1st pixel
						g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);

						// Update drawing position
						x1 += addX;
						x2 -= addX;
						
						// Draw 2nd pixel
						g_funcDrawPoint(sc_w,sc_h,x1,y1 + addY,g_color);
						g_funcDrawPoint(sc_w,sc_h,x2,y2 - addY,g_color);
						
						// Update drawing position
						y1 += (addY << 1);	//y1 += 2addY;
						y2 -= (addY << 1);	//y2 -= 2addY;
					}
				}
			}
		}

		// Draw fractional part less than 4 pixels 
		
		// Calculate loop count
		n = ((dy + 1) % 4);

		for(var i = 0;i < n;++i)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
			
			// Update drawing position
			y1 += addY;

			// Update error value
			e += (dx << 1);		//e += 2dx;
		
			if(e >= 0)
			{
				// Update drawing position
				x1 += addX;

				// Update error value
				e -= (dy << 1);	//e -= 2dy;
			}
		}
	}

}

function setup_draw_bresenham_aa()
{
	// Prepare fake anti-aliased Bresenham LINE drawing function
	
	g_funcDrawBegin = drawBegin_bresenham;
	g_funcDrawEnd   = drawEnd_bresenham;
	g_funcDrawLine  = drawLine_bresenham_aa;
	g_funcDrawPoint = drawPoint_bresenham;

	var algo_div = document.getElementById("algo");
	algo_div.innerText = "bresenham fake antialiased-line";
	
}

function drawLine_bresenham_aa(ctx,sc_w,sc_h,x1,y1,x2,y2)
{
	// Anti-aliased Bresenham LINE drawing
	
	//
	// Originally, with background color or already drawn color
	// Blending is done, but here only manipulate alpha value,
	// It is always blending with background color,
	// It's fake anti-aliasing (^^;
	//
	// Screen clear is not just changing alpha value, but properly
	// If filled with background color, with current drawing color
	// I think blending is possible, but proper background color
	// Filling with ... makes it very slow, so unavoidably
	// Operation is only for alpha value.
	// Please be forewarned.
	//
	
	// Convert to integer (Important! if not done, writing to ImageData will fail)
	x1 = Math.floor(x1);
	y1 = Math.floor(y1);
	x2 = Math.floor(x2);
	y2 = Math.floor(y2);
	
	// Parameter preparation
	var dx   = Math.abs(x2 - x1);
	var dy   = Math.abs(y2 - y1);
	var addX = (x1 < x2) ? 1 : -1;
	var addY = (y1 < y2) ? 1 : -1;
	var x,y,alpha;
	var alpha_color = { r: g_color.r, g: g_color.g, b: g_color.b, a: 0 };
	
	// Clipping
	if(((x1 < 0) && (x2 < 0)) || ((x1 >= sc_w) && (x2 >= sc_w)) ||
	   ((y1 < 0) && (y2 < 0)) || ((y1 >= sc_h) && (y2 >= sc_h)))
	{	return;	}
	
	// When completely horizontal line
	if(dy == 0)
	{
		// Loop is half the difference since proceeding from both ends
		var n = dx >> 1;	//n = dx / 2;
		
		// Drawing Loop
		for(var i = 0;i <= n;++i)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
			g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);
			
			// Update drawing position
			x1 += addX;
			x2 -= addX;
		}
	
		// Draw last 1 pixel if drawing amount is odd
		if((dx & 0x01) == 0)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1 - addX,y1,g_color);
		}
	}
	// When completely vertical line
	else if(dx == 0)
	{
		// Loop is half the difference since proceeding from both ends
		var n = dy >> 1;	//n = dy / 2;
		
		// Drawing Loop
		for(var i = 0;i <= n;++i)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1,g_color);
			g_funcDrawPoint(sc_w,sc_h,x2,y2,g_color);

			// Update drawing position
			y1 += addY;
			y2 -= addY;
		}
	
		// Draw last 1 pixel if drawing amount is odd
		if((dy & 0x01) == 0)
		{
			// Draw Point
			g_funcDrawPoint(sc_w,sc_h,x1,y1 - addY,g_color);
		}
	}
	else if(dx > dy)
	{
		// Loop by X
		
		// Convert only Y coordinate to fixed point
		y1 = y1 << 16;
		y2 = y2 << 16;
		
		// Calculate fixed-point error value
		var e = (y2 - y1) / dx;

		while(x1 != x2)
		{
			// Get alpha value
			alpha = (y1 & 0xFFFF) >> 8;	// Convert 0-FFFF to 0-FF
			
			// Convert Y coordinate to integer
			y = y1 >> 16;

			// Draw line part
			alpha_color.a = 255 - alpha;
			g_funcDrawPoint(sc_w,sc_h,x1,y,alpha_color);

			// Draw anti-aliased part
			alpha_color.a = alpha;
			if(alpha != 0)
			{	g_funcDrawPoint(sc_w,sc_h,x1,y+1,alpha_color);	}

			// Update Coordinates
			x1 += addX;
			y1 += e;
		}
		
		// Draw end point
		g_funcDrawPoint(sc_w,sc_h,x2,(y2 >> 16),g_color);
	}
	else
	{
		// Loop by Y
		
		// Convert only X coordinate to fixed point
		x1 = x1 << 16;
		x2 = x2 << 16;
		
		// Calculate fixed-point error value
		var e = (x2 - x1) / dy;

		while(y1 != y2)
		{
			// Get alpha value
			alpha = (x1 & 0xFFFF) >> 8;	// Convert 0-FFFF to 0-FF
			
			// Convert X coordinate to integer
			x = x1 >> 16;
			
			// Draw line part
			alpha_color.a = 255 - alpha;
			g_funcDrawPoint(sc_w,sc_h,x,y1,alpha_color);

			// Draw anti-aliased part
			alpha_color.a = alpha;
			if(alpha != 0)
			{	g_funcDrawPoint(sc_w,sc_h,x+1,y1,alpha_color);	}

			// Update Coordinates
			x1 += e;
			y1 += addY;
		}
		
		// Draw end point
		g_funcDrawPoint(sc_w,sc_h,(x2 >> 16),y2,g_color);
	}

}

function set_obj_pos()
{
	// Determine object position
	
	if(!(g_cnt & 7))
	{
		g_r0 = max(-75,min(75,g_r0+g_r1));
		
		var a       = rad(g_r0);
		var cos_a   = Math.cos(a);
		var sin_a   = Math.sin(a);
		var con_cnt = Math.cos(rad(g_cnt));
		var sin_cnt = Math.sin(rad(g_cnt * 2));
		
		for(var i = 0;i < 16;++i)
		{
			var f = (!(i % 15) ? 1 : 0);	// Flag to raise the left and right edge lines
			var x = i * 16 - 120 + con_cnt * 32;
			var y = rnd(8) + 64 - f * 64 + sin_cnt * 8;
			var z = 4096;
			
			var sp = g_sprite[g_id];
			sp.x = x * cos_a - y * sin_a;
			sp.y = x * sin_a + y * cos_a;
			sp.z = z;
			sp.v = 1;
			
			g_id = (g_id + 1) % g_sprite_num;
		}
	}

}

function draw_obj(id,ctx,sc_w,sc_h,wh,hh)
{
	// Draw Wire Object
	
	if(g_sprite[id].v)
	{
		var sp = g_sprite[id];
		var tg = (id + 16) % g_sprite_num;
		var a  = sp.z / 512;
		var ox = sp.x / a + wh;
		var oy = sp.y / a + hh;
		
		// Draw vertical line (Z direction)
		if(g_sprite[tg].v)
		{
			var tsp = g_sprite[tg];
			var tx  = tsp.x;
			var ty  = tsp.y;
			var tz  = tsp.z;
			var b   = tz / 512;
			
			g_funcDrawLine(ctx,sc_w,sc_h,ox,oy,tx / b + wh,ty / b + hh);
		}

		// Draw horizontal line (X/Y direction)
		if((id & 15) != 15)
		{
			var st   = id + 1;
			var stsp = g_sprite[st];
			var sx   = stsp.x;
			var sy   = stsp.y;
			var sz   = stsp.z;
			var c    = sz / 512;
			
			g_funcDrawLine(ctx,sc_w,sc_h,ox,oy,sx / c + wh,sy / c + hh);
		}

		// Hide if it comes to front and becomes invisible
		var z = sp.z - 8;
		sp.z  = z;
		if(z <= 0)
		{	
			sp.v = 0;
		}
	}
	
}

function draw_wire()
{
	// Wireframe-ish drawing processing	
	var screen = document.getElementById("game-screen");	// Drawing destination canvas
	var ctx    = screen.getContext("2d");
	var sc_w   = g_game_width;
	var sc_h   = g_game_height;
	var wh     = sc_w / 2;
	var hh     = sc_h / 2;
	
	// Set new position of object
	set_obj_pos();
	
	// Draw Wire Object
	g_funcDrawBegin(ctx,sc_w,sc_h);
	for(var i = 0;i < g_sprite_num;++i)
	{
		draw_obj(i,ctx,sc_w,sc_h,wh,hh);
	}
	g_funcDrawEnd(ctx,sc_w,sc_h);
	
	// Next
	g_cnt++;
	if(!rnd(16))
	{
		g_r1 = -g_r1;
	}

}

function render_game()
{
	
	// Game drawing processing
	
	// Draw wireframe-ish things
	draw_wire();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render_game);

}

</script>

	<div id="fps"></div>
	<div id="algo"></div>
	<canvas id="game-screen"></canvas>
