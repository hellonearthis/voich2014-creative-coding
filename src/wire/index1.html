<!DOCTYPE html>
<html>
<head>
<title>Papa's Wireframe-ish Thing</title>
<meta charset="utf-8">
<meta name="viewport" content="width=320, user-scalable=no, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<!--
	This demo is based on a SmileBASIC work published by neko800 (@nekohachi1)
	Ported to JavaScript by Voich (@voich2014).
	
	Overwhelming thanks to neko800-san for publishing such a wonderful work!!
	
	neko800-san's SmileBASIC 4 Original Version https://twitter.com/nekohachi1/status/1196444460868980736

-->
<style type="text/css">
<!--
	html
	{
	    overflow: hidden;
	}

	body
	{
		overflow: hidden;
		background-color: black;
		color: #fff;
	}

	*
	{
		-webkit-user-select: none;
		   -moz-user-select: none;
		    -ms-user-select: none;
		        user-select: none;
	}

	#fps
	{
		position:absolute;
		color: #FFF;
		bottom:0px;
		z-index: 100;
	}

	#game-screen 
	{
		position:absolute;
	}
-->
</style>
<script type="text/javascript">

// Global Object
var g_game_width    = 320;
var g_game_height   = 500;

const g_sprite_num  = 2048;		// Total number of sprites

var g_sprite        = [];
var g_r0            = 0;
var g_r1            = 1;
var g_cnt           = 0;
var g_id            = 0;

var g_last_fps_time = 0;
var g_fps_count     = 0;

function rad(deg)
{
	// Degree -> Radian conversion
	return deg * Math.PI / 180;
}

function rnd(x)
{
	// Get random number
	return Math.floor(Math.random() * x);
}

function max(a,b)
{
	// Return larger one
	return Math.max(a,b);
}

function min(a,b)
{
	// Return smaller one
	return Math.min(a,b);
}

function init_game()
{
	
	// Game initialization processing
	
	// Screen Adjustment
	adjust_screen();
	
	// Generation of objects necessary for game
	create_obj();

	// Preparation of requestAnimationFrame (compatible with various browsers)
	var requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render_game);
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	var now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// FPS Display
		var fps_div = document.getElementById("fps");
		fps_div.innerText = "FPS:"+(g_fps_count*(1000/(now_time - g_last_fps_time)));
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function adjust_screen()
{
	// Screen Adjustment
	
	// Get window size
	var window_w = window.innerWidth;
	var window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 1280;
		g_game_height = 720;
	}
	
	// Place game screen in center
	var screen  = document.getElementById("game-screen");
	var game_x  = (window_w - g_game_width) / 2;
	var game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

}

function create_obj()
{
	// Object Generation
	
	// Initialize sprite object information
	for(var i = 0;i < g_sprite_num;++i)
	{
		var obj = { x: 0, y: 0, z: 0, v: 0 };
		g_sprite.push(obj);
	}

}

function set_obj_pos()
{
	// Determine object position
	
	if(!(g_cnt & 7))
	{
		g_r0 = max(-75,min(75,g_r0+g_r1));
		
		var a       = rad(g_r0);
		var cos_a   = Math.cos(a);
		var sin_a   = Math.sin(a);
		var con_cnt = Math.cos(rad(g_cnt));
		var sin_cnt = Math.sin(rad(g_cnt * 2));
		
		for(var i = 0;i < 16;++i)
		{
			var f = (!(i % 15) ? 1 : 0);	// Flag to raise the left and right edge lines
			var x = i * 16 - 120 + con_cnt * 32;
			var y = rnd(4) + 64 - f * 64 + sin_cnt * 8;
			var z = 2048;
			
			var sp = g_sprite[g_id];
			sp.x = x * cos_a - y * sin_a;
			sp.y = x * sin_a + y * cos_a;
			sp.z = z;
			sp.v = 1;
			
			g_id = (g_id + 1) % g_sprite_num;
		}
	}

}

function draw_obj(id,ctx,wh,hh)
{
	// Draw Wire Object
	
	if(g_sprite[id].v)
	{
		var sp = g_sprite[id];
		var tg = (id + 16) % g_sprite_num;
		var a  = sp.z / 512;
		var ox = sp.x / a + wh;
		var oy = sp.y / a + hh;
		
		// Draw vertical line (Z direction)
		if(g_sprite[tg].v)
		{
			var tsp = g_sprite[tg];
			var tx  = tsp.x;
			var ty  = tsp.y;
			var tz  = tsp.z;
			var b   = tz / 512;
			
			ctx.beginPath();
			ctx.moveTo(ox,oy);
			ctx.lineTo(tx / b + wh,ty / b + hh);
			ctx.closePath();
			ctx.stroke();
		}
		
		// Draw horizontal line (X/Y direction)
		if((id & 15) != 15)
		{
			var st   = id + 1;
			var stsp = g_sprite[st];
			var sx   = stsp.x;
			var sy   = stsp.y;
			var sz   = stsp.z;
			var c    = sz / 512;
			
			ctx.beginPath();
			ctx.moveTo(ox,oy);
			ctx.lineTo(sx / c + wh,sy / c + hh);
			ctx.closePath();
			ctx.stroke();
		}

		// Hide if it comes to front and becomes invisible
		var z = sp.z - 4;
		sp.z  = z;
		if(z <= 0)
		{	
			sp.v = 0;
		}
	}
	
}

function draw_wire()
{
	// Wireframe-ish drawing processing	
	var screen  = document.getElementById("game-screen");	// Drawing destination canvas

	// Screen clear for every turn
	var ctx = screen.getContext("2d");
	ctx.clearRect(0,0,screen.width,screen.height);
	
	// Set new position of object
	set_obj_pos();
	
	// Determine wire color
	ctx.strokeStyle = 'lime';
	
	// Draw Wire Object
	var wh = g_game_width  / 2;
	var hh = g_game_height / 2;
	for(var i = 0;i < g_sprite_num;++i)
	{
		draw_obj(i,ctx,wh,hh);
	}
	
	// Next
	g_cnt++;
	if(!rnd(16))
	{
		g_r1 = -g_r1;
	}

}

function render_game()
{
	
	// Game drawing processing
	
	// Draw wireframe-ish things
	draw_wire();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render_game);

}

</script>
</head>
<body onload="init_game()">
	<div id="fps"></div>
	<canvas id="game-screen"></canvas>
</body>
</html>
