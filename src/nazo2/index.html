// Global Object
let g_game_width    = 340;
let g_game_height   = 340;

let g_time          = 0;		// Current time [ms]
let g_dtime         = 0;		// Elapsed time since last drawing [ms]

let g_pn            = new Perlin();
let g_screen_ctx    = null;
let g_bloom_offscs  = [];		// Off-screen canvas for Bloom processing

const MORPH_TIME    = 5000;
const FADE_TIME     = 500;
const POS_NUM       = 10;

let g_start_time    = 0;
let g_next_time     = 0;

let g_scale         = g_game_width / 600;
let g_seed          = 0;
let g_col_url       = '';
let g_col_cache     = [];

let g_last_fps_time = 0;
let g_fps_count     = 0;
let g_fps           = 60;
let g_fps_list      = [];
let g_fps_visible   = true;

let g_cnt           = 0;

function init()
{
	
	// Initialization processing
	
	// Preparation
	setup();
	
	// Toggle FPS display ON/OFF with click or tap
	toggle_fps_visible();
	window.onmousedown = toggle_fps_visible;
	window.ontouchdown = toggle_fps_visible;
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render);
	
}

function adjust_screen()
{

	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 600;
		g_game_height = 600;
		g_scale       = 1.0;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width)  / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

}

function setup_obj()
{

	// Preparation of object
	
	// Get Context of main screen in advance
	const sc_w   = g_game_width;
	const sc_h   = g_game_height;
	const screen = document.getElementById("game-screen");
	g_screen_ctx = screen.getContext("2d");
	
}

function setup_bloom()
{
	// Preparation for Bloom Processing
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	let scale = 0.5;
	for(let i = 0;i < 2;++i)
	{
		const cv   = document.createElement("canvas");
		const ctx  = cv.getContext("2d");
		const cv_w = sc_w * scale;
		const cv_h = sc_h * scale;
		
		cv.width  = sc_w * scale;
		cv.height = sc_h * scale;
		cv.style.display = "none";
		
		let info =
		{
			cv: cv, cv_w: cv_w, cv_h: cv_h,
			ctx: ctx
		};
		g_bloom_offscs.push(info);
		
		scale /= 2.0;
	}
}

function do_bloom(ctx,draw_screen)
{
	// Execute Bloom Processing
	
	// Apply filter to image after rendering
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	//
	// Doing simple bloom processing.
	//
	// Because it's not extracting only high luminance parts, but whole thing looks glowing,
	// I think it's a bit different from original bloom processing, but anyway
	// Might be easy if you want to make it glow easily (*´ω｀*)
	//
	
	// To off-screen canvas with resolution lowered by half vertically and horizontally in multiple stages
	// Apply Canvas Blur filter, enlarge and additive blend
	const offsc_num = g_bloom_offscs.length;
	let blur_w = [ 5,10 ];
	for(let idx = 0;idx < offsc_num;++idx)
	{
		// Get current state from canvas displayed on screen
		let offsc = g_bloom_offscs[idx];
		offsc.ctx.clearRect(0,0,offsc.cv_w,offsc.cv_h);
		offsc.ctx.drawImage(draw_screen,0,0,sc_w,sc_h,0,0,offsc.cv_w,offsc.cv_h);

		// Reflect on screen (additive blending) while applying filter to reduced image
		ctx.save();
		ctx.globalAlpha = 1.0;
		ctx.globalCompositeOperation = 'lighter';
		ctx.filter="blur("+blur_w[idx]+"px)";
		ctx.drawImage(offsc.cv,0,0,offsc.cv_w,offsc.cv_h,0,0,sc_w,sc_h);
		ctx.restore();
		
		// If draw_screen is the same as the display canvas
		// ^ Get the composited result and enlarge it, so blur
		// I think ... is applied tightly.
	}
}

function setup()
{
	
	// Preparation
		
	// Screen Adjustment
	adjust_screen();
	
	// Preparation of object
	setup_obj();
	
	// Preparation for Bloom Processing
	setup_bloom();

	// Determine initial value
	reset();
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// Add to FPS history
		g_fps_list.push(g_fps_count);
		if(g_fps_list.length > 10)
		{	
			// Delete first and keep up to past n times
			// Use average of FPS (moving average)
			g_fps_list.shift();
		}
		let fps_ave = 0;
		for(let i = 0;i < g_fps_list.length;++i)
		{	fps_ave += g_fps_list[i];	}
		fps_ave /= g_fps_list.length;
		
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (fps_ave*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;
		g_fps = fps_ave;
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function toggle_fps_visible()
{
	// Toggle FPS display ON/OFF
	
	// Invert display flag
	g_fps_visible = !g_fps_visible;
	
	// Control visible based on display flag
	let fps_div = document.getElementById("fps");
	fps_div.style.display = g_fps_visible ? "block" : "none";

}

// Quoted from Sayama-san's workshop materials
//PCDJapan_WS_Generative Illustrations
//https://www.openprocessing.org/sketch/1102169
function separateGrid(x, y, w, h)
{
	// Number of divisions
	let num = 2;
	for(let yi = 0; yi < num; yi++)
	{
		for(let xi = 0; xi < num; xi++)
		{
			let dx = x + w / num * xi;
			let dy = y + h / num * yi;
			let dw = w / num;
			let dh = h / num;
			let rn = random();
			if(rn < 0.5 && min(dw, dh) > 50){
				separateGrid(dx, dy, dw, dh);
			}
			else{
				// Drawing command
				drawNazo2(dx,dy,dw,dh);
			}
		}
	}
}

function drawNazo2(x,y,w,h)
{
	// Draw mysterious creature (intending to walk)
		
	// Parameter preparation
	const sc_w  = g_game_width;
	const ctx   = g_screen_ctx;
	const cx    = x + w / 2;
	const cy    = y + h * 2/3;
	const scale = w / sc_w * 8 * g_scale;
	const body  = 12;
	const foot  = 0.3;
	const ls    = (random(3,30) / 10);
	const lw    = 12 * ls;
	const lr    =  6 * ls;
	const blur  =  5 * scale;
 	const pos   = [];
	for(let i = 0;i < POS_NUM;++i)
	{
		pos.push({ x:0,y:0 });
	}
	
	if(g_col_cache.length <= g_cnt)
	{
		// Set color information to cache
		// (Use cache method since color calculation is heaviest in whole)
		
		// Color Selection
		const col    = shuffle(createPaletteNHSL(g_col_url));	// Get with normalized HSL object
		const col1_h = col[0].h * 360;
		const col1_s = Math.floor(col[0].s * 100)+"%";
		const col2_h = col[1].h * 360;
		const col2_s = Math.floor(col[1].s * 100)+"%";
		const col2_l = Math.floor(col[1].l * 100)+"%";
		const hsl1   = `hsl(${col1_h},${col1_s},50%)`;
		const hsl2   = `hsl(${col2_h},${col2_s},${col2_l})`;
		const hsl3   = `hsl(${col1_h},${col1_s},70%)`;
		
		// Once process the color string specified in hsl format
		// Specify as fillStyle then retrieve
		// by converting to "#rrggbb" format
		ctx.save();
		ctx.fillStyle = hsl1;
		const col1 = ctx.fillStyle;
		ctx.fillStyle = hsl2;
		const col2 = ctx.fillStyle;
		ctx.fillStyle = hsl3;
		const col3 = ctx.fillStyle;
		ctx.restore();
		
		// Create gradation
		const grad = [];
		const num  = POS_NUM * 2;
		for(let i = 0;i < num;++i)
		{
			const e   = Ease.easeInQuint(i / num);
			grad.push(mixPalette(col1,col3,e));
		}
		
		// Create cache
		g_col_cache.push({ col1:col1,col2:col2,col3:col3,grad:grad });
	}
	
	// Get color from cache
	const col1 = g_col_cache[g_cnt].col1;
	const col2 = g_col_cache[g_cnt].col2;
	const col3 = g_col_cache[g_cnt].col3;
	const grad = g_col_cache[g_cnt].grad;

	
	// Move boing boing
	const t  = g_time / 600;
	const tx = body * scale * (g_pn.perlin(t/2,cx,cy) - 0.5) * 1.0;
	const ty = body * scale * g_pn.perlin(t,cx,cy) * 5.0;
	const an = 1.0 / POS_NUM;
	for(let i = 0;i < POS_NUM;++i)
	{
		pos[i].x = Ease.easeInExpo(i * an) * tx;
		pos[i].y = Ease.easeInExpo(i * an) * ty;
	}
	
	
	ctx.save();
	ctx.translate(cx,cy);
	ctx.rotate(rad(-45));
		
	// Ensure shadow is applied
	ctx.shadowColor   = 'rgba(0,0,0,0.5)';
	ctx.shadowOffsetX = 10;
	ctx.shadowOffsetY = 10;
	ctx.shadowBlur    = 32;
	
	// Body
	ctx.beginPath();
	ctx.strokeStyle = col1;
	ctx.lineWidth   = lw * scale;
	ctx.lineCap     = "round";
	ctx.lineJoin    = "round";
	ctx.moveTo(0,0);
	for(let i = 0;i < POS_NUM;++i)
	{
		const p = pos[i]; 
		ctx.lineTo(0,-p.y);
	}
	ctx.stroke();
	
	// Ensure no shadow is applied
	ctx.shadowColor   = 'rgba(0,0,0,0.0)';
	ctx.shadowOffsetX = 0;
	ctx.shadowOffsetY = 0;
	ctx.shadowBlur    = 0;
	
	// Tail
	const len = body * foot * scale;
	const num = POS_NUM * 2;
	const a   = (len / num) * 3.6;
	const sw  = 1.6 - (1.0 - lw / 20);
	for(let i = 0;i < num;++i)
	{
		const ii = Math.floor(i / 2);
		const e  = Ease.easeInQuint(i / num);
		const p  = pos[ii]; 
		const y  = i * a;
		const r  = (lr * scale) * (1 - e);

		ctx.beginPath();
		ctx.fillStyle = grad[i];
		ctx.arc(-p.x*sw,y,r,0,TAU);
		ctx.fill();
	}
	
	// Eyes
	const p     = pos[POS_NUM-1]; 
	const eyew2 = lw / random(3,11) * scale;
	const eyeh2 = lw / random(6,16) * scale;
	ctx.translate(p.x,-p.y - eyeh2 * 1.2);
	ctx.beginPath();
	ctx.strokeStyle = col2;
	ctx.lineWidth   = lw / 10 * scale;
	ctx.moveTo(-eyew2,-eyeh2);
	ctx.lineTo(-eyew2, eyeh2);
	ctx.moveTo( eyew2,-eyeh2);
	ctx.lineTo( eyew2, eyeh2);
	ctx.stroke();

	ctx.restore();
	
	g_cnt++;
}

function draw()
{

	// Drawing Core
	
	// Save start time
	if(g_start_time == 0)
	{
		g_start_time = g_time;
		g_next_time  = g_time + MORPH_TIME;
	}
	
	// Screen Clear
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	const ctx  = g_screen_ctx;
	ctx.fillStyle = "#FFF";
	ctx.fillRect(0,0,sc_w,sc_h);
	
	ctx.save();
	
	g_cnt = 0;
	randomSeed(g_seed);	// Fix seed so divisions are same every time
	separateGrid(0,0,sc_w,sc_h);
	
	ctx.restore();
	
	// Bloom Processing
	//let screen = document.getElementById("game-screen");
	//do_bloom(ctx,screen);

	ctx.save();
	
	// Fade In/Out
	const time_ms = g_time - g_start_time;
	if(time_ms < FADE_TIME)
	{
		ctx.globalAlpha = 1.0 - (time_ms / FADE_TIME);
		ctx.fillStyle = "#FFFFFF";
		ctx.fillRect(0,0,sc_w,sc_h);
	}
	else if(time_ms >= (MORPH_TIME - FADE_TIME))
	{
		ctx.globalAlpha = (time_ms - (MORPH_TIME - FADE_TIME)) / FADE_TIME;
		ctx.fillStyle = "#FFFFFF";
		ctx.fillRect(0,0,sc_w,sc_h);
	}

	ctx.restore();
	
	// Color change time check
	if(g_time >= g_next_time)
	{
		// Determine next break time and reset
		g_start_time = g_time;
		g_next_time  = g_start_time + MORPH_TIME;
		reset();
	}
	
}

function render()
{
	
	// Drawing processing for every turn
	
	// Time Calculation
	const last_time = g_time;
	g_time = (new Date).getTime();
	if(last_time == 0)
	{	g_dtime = 0;	}
	else
	{	g_dtime = g_time - last_time;	}
	
	// Drawing Core
	draw();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render);

}
