<!DOCTYPE html>
<html>
<head>
<title>Papa's Sparkling Rotating Crystal v2.5</title>
<meta charset="utf-8">
<meta name="viewport" content="width=320, user-scalable=no, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<!--

	In this demo, I tried drawing point sparkling art in JavaScript.
	
	This time, I am compositing by further rotating the crystal drawn with points.
	In v2, using the method adopted in Sparkling Rope to increase rotations
	Adding fine adjustments.
	In v2.5, seeing what happens if point sparkles are desynchronized and scattered
	I tried to see if.
	I was making things sparkle separately in a work called gumo2, but that one
	Because I thought the sparkling feeling might increase?
	As a pattern, I think it looks more beautiful if synchronized.

<link rel="stylesheet" href="./../vlib/vl_common_v1.0.0.css">
<script type="text/javascript" src="./../vlib/vl_common_v1.6.0.js"></script>
<script type="text/javascript" src="./../vlib/vl_3d_v1.2.0.js"></script>
<style type="text/css">
</style>
<script type="text/javascript">

// Global Object
let g_game_width    = 320;
let g_game_height   = 500;

let g_time          = 0;		// Current time [ms]
let g_dtime         = 0;		// Elapsed time since last drawing [ms]

const TAU           = 2.0 * Math.PI;
let g_pn            = new Perlin();
let g_screen_ctx    = null;
let g_bloom_offscs  = [];		// Off-screen canvas for Bloom processing
let g_scale         = 1.0;

const MORPH_TIME    = 5000;
const POINT_NUM     = 120;
const MIN_S         = 11;
const MAX_S         = 14;
const MIN_c         = 0.01;
const MAX_c         = 0.25;
const MIN_r_amp     = 1.0;
const MAX_r_amp     = 3.0;
const MIN_nx        = 0.01;
const MAX_nx        = 0.4;
const MIN_ra        = 2;
const MAX_ra        = 8;
const MIN_a         = 0.001;
const MAX_a         = 0.5;
const MIN_b         = 0.001;
const MAX_b         = 0.5;
const MIN_ob        = 0;
const MAX_ob        = rad(90);
const MIN_sr        = 0.5;
const MAX_sr        = 1.5;
const MIN_sr_off    = 0.4;
const MAX_sr_off    = 1.8;

let g_start_time    = 0;
let g_next_time     = 0;
let g_start_S       = 0;
let g_next_S        = 0;
let g_start_c       = 0;
let g_next_c        = 0;
let g_start_r_amp   = 0;
let g_next_r_amp    = 0;
let g_start_nx      = 0;
let g_next_nx       = 0;
let g_start_ra      = 0;
let g_next_ra       = 0;
let g_start_a       = 0;
let g_next_a        = 0;
let g_start_b       = 0;
let g_next_b        = 0;
let g_start_ob      = 0;
let g_next_ob       = 0;
let g_start_sr      = 0;
let g_next_sr       = 0;
let g_start_sr_off  = 0;
let g_next_sr_off   = 0;

let g_def1_colors   = [];
let g_def2_colors   = [];
let g_start_colors  = [];
let g_next1_colors  = [];
let g_next2_colors  = [];

let g_mtx_vp        = new MatrixMan4();
let g_mtx_scale     = new MatrixMan4();
let g_mtx_move      = new MatrixMan4();
let g_mtx_rotateA   = new MatrixMan4();
let g_mtx_rotateB   = new MatrixMan4();
let g_mtx_rotateC   = new MatrixMan4();
let g_mtx_rotateZ   = new MatrixMan4();
let g_mtx_model     = new MatrixMan4();
let g_vec_pos       = new VectorMan4();

let g_ry            = 0;
let g_rz            = 0;

let g_last_fps_time = 0;
let g_fps_count     = 0;
let g_fps           = 60;
let g_fps_list      = [];
let g_fps_visible   = true;

let g_cnt           = 0;

function init()
{
	
	// Initialization processing
	
	// Preparation
	setup();
	
	// Toggle FPS display ON/OFF with click or tap
	toggle_fps_visible();
	window.onmousedown = toggle_fps_visible;
	window.ontouchdown = toggle_fps_visible;
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render);
	
}

function adjust_screen()
{

	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		// Create an atmosphere unique to PC side
		const       h = 600;
		g_game_width  = 500 / 320 * h;
		g_game_height = h;
		g_scale       = h / 320;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width)  / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

}

function setup_obj()
{

	// Preparation of object
	
	// Get Context of main screen in advance
	const sc_w   = g_game_width;
	const sc_h   = g_game_height;
	const screen = document.getElementById("game-screen");
	g_screen_ctx = screen.getContext("2d");
	
	// Generate default palette from coolors.co URL
	const url1    = "https://coolors.co/485696-e7e7e7-f9c784-fc7a1e-f24c00";
	const url2    = "https://coolors.co/e4572e-17bebb-ffc914-2e282a-76b041";
	g_def1_colors = createPaletteNHSL(url1);
	g_def2_colors = createPaletteNHSL(url2);

}

function setup_matrix()
{
	
	// Preparation of Projection/View Transformation Matrix
	
	// Generate Projection Matrix
	let mtx_projection = new MatrixMan4();
	mtx_projection.projectionOpenGL(NEAR_Z_POS,FAR_Z_POS,rad(60),g_game_width/g_game_height);
	
	// Generate View Matrix
	let vFrom    = new VectorMan3(0.0,0.0,100.0);
	let vTo      = new VectorMan3(0.0,0.0,0.0);
	let vUp      = new VectorMan3(0.0,1.0,0.0);
	let mtx_view = new MatrixMan4();
	mtx_view.view(vFrom,vTo,vUp);
	
	// Create composition matrix
	g_mtx_vp.initialize();
	g_mtx_vp.mul(mtx_view);
	g_mtx_vp.mul(mtx_projection);
	
}

function setup_bloom()
{
	// Preparation for Bloom Processing
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	let scale = 0.5;
	for(let i = 0;i < 2;++i)
	{
		const cv   = document.createElement("canvas");
		const ctx  = cv.getContext("2d");
		const cv_w = sc_w * scale;
		const cv_h = sc_h * scale;
		
		cv.width  = sc_w * scale;
		cv.height = sc_h * scale;
		cv.style.display = "none";
		
		let info =
		{
			cv: cv, cv_w: cv_w, cv_h: cv_h,
			ctx: ctx
		};
		g_bloom_offscs.push(info);
		
		scale /= 2.0;
	}
}

function do_bloom(ctx,draw_screen)
{
	// Execute Bloom Processing
	
	// Apply filter to image after rendering
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	//
	// Doing simple bloom processing.
	//
	// Because it's not extracting only high luminance parts, but whole thing looks glowing,
	// I think it's a bit different from original bloom processing, but anyway
	// Might be easy if you want to make it glow easily (*´ω｀*)
	//
	
	// To off-screen canvas with resolution lowered by half vertically and horizontally in multiple stages
	// Apply Canvas Blur filter, enlarge and additive blend
	const offsc_num = g_bloom_offscs.length;
	let blur_w = [ 5,10 ];
	for(let idx = 0;idx < offsc_num;++idx)
	{
		// Get current state from canvas displayed on screen
		let offsc = g_bloom_offscs[idx];
		offsc.ctx.clearRect(0,0,offsc.cv_w,offsc.cv_h);
		offsc.ctx.drawImage(draw_screen,0,0,sc_w,sc_h,0,0,offsc.cv_w,offsc.cv_h);

		// Reflect on screen (additive blending) while applying filter to reduced image
		ctx.save();
		ctx.globalAlpha = 1.0;
		ctx.globalCompositeOperation = 'lighter';
		ctx.filter="blur("+blur_w[idx]+"px)";
		ctx.drawImage(offsc.cv,0,0,offsc.cv_w,offsc.cv_h,0,0,sc_w,sc_h);
		ctx.restore();
		
		// If draw_screen is the same as the display canvas
		// ^ Get the composited result and enlarge it, so blur
		// I think ... is applied tightly.
	}
}

function setup()
{
	
	// Preparation
		
	// Screen Adjustment
	adjust_screen();
	
	// Preparation of object
	setup_obj();
	
	// Preparation of Transformation Matrix
	setup_matrix();
	
	// Preparation for Bloom Processing
	setup_bloom();

	// Determine initial value
	// * Calling reset() twice because start value becomes undefined if called once
	g_next1_colors = g_def1_colors.slice();
	g_next2_colors = g_def2_colors.slice();
	reset();
	reset();
	
}

function reset()
{

	// Determine next target value
	
	g_start_S      = g_next_S;
	g_start_c      = g_next_c;
	g_start_r_amp  = g_next_r_amp;
	g_start_nx     = g_next_nx;
	g_start_ra     = g_next_ra;
	g_start_a      = g_next_a;
	g_start_b      = g_next_b;
	g_start_ob      = g_next_ob;
	g_start_sr     = g_next_sr;
	g_start_sr_off = g_next_sr_off;
	
	g_next_S       = Math.min(MIN_S     + rnd(MAX_S     *1000)/1000,MAX_S     );
	g_next_c       = Math.min(MIN_c     + rnd(MAX_c     *1000)/1000,MAX_c     );
	g_next_r_amp   = Math.min(MIN_r_amp + rnd(MAX_r_amp *1000)/1000,MAX_r_amp );
	g_next_nx      = Math.min(MIN_nx    + rnd(MAX_nx    *1000)/1000,MAX_nx    );
	g_next_ra      = Math.floor(Math.min(MIN_ra + rnd(MAX_ra),MAX_ra));
	g_next_a       = Math.min(MIN_a     + rnd(MAX_a     *1000)/1000,MAX_a     );
	g_next_b       = Math.min(MIN_b     + rnd(MAX_b     *1000)/1000,MAX_b     );
	g_next_ob      = Math.min(MIN_ob    + rnd(MAX_ob    *1000)/1000,MAX_ob    );
	g_next_sr      = Math.min(MIN_sr    + rnd(MAX_sr    *1000)/1000,MAX_sr    );
	g_next_sr_off  = Math.min(MIN_sr    + rnd(MAX_sr_off*1000)/1000,MAX_sr_off);
	
	// Determine palette
	g_start_colors = g_next1_colors.slice();	// Pass-by-value copy of array
	g_next1_colors = g_next2_colors.slice();	// Pass-by-value copy of array
	g_next2_colors = g_def1_colors.slice();	// Set as initial value of next palette
	getColormind(function(palette)
	{
		// Get 5-color palette from Colormind
		g_next2_colors = rgbAA2hslNA(palette);		
	});
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// Add to FPS history
		g_fps_list.push(g_fps_count);
		if(g_fps_list.length > 10)
		{	
			// Delete first and keep up to past n times
			// Use average of FPS (moving average)
			g_fps_list.shift();
		}
		let fps_ave = 0;
		for(let i = 0;i < g_fps_list.length;++i)
		{	fps_ave += g_fps_list[i];	}
		fps_ave /= g_fps_list.length;
		
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (fps_ave*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;
		g_fps = fps_ave;
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function toggle_fps_visible()
{
	// Toggle FPS display ON/OFF
	
	// Invert display flag
	g_fps_visible = !g_fps_visible;
	
	// Control visible based on display flag
	let fps_div = document.getElementById("fps");
	fps_div.style.display = g_fps_visible ? "block" : "none";

}

function draw()
{

	// Drawing Core
	
	// Save start time
	if(g_start_time == 0)
	{
		g_start_time = g_time;
		g_next_time  = g_time + MORPH_TIME;
	}
	
	// Screen Clear
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	const ctx  = g_screen_ctx;
	ctx.clearRect(0,0,sc_w,sc_h);
	
	ctx.save();

	// Preparation of scene
	let time = (g_time - g_start_time) / MORPH_TIME;
	if(time > 1.0){ time = 1.0; }
	const e  = Ease.easeInOutExpo(time**8);
	const ce = Ease.easeInSine(time);

	// Because I don't want to new every time drawing, and global variable
	// Heard it's faster to hold reference in local variable
	// More like avoiding occasional micro-freezes than speed up
	// Intending to use it. Not sure if it was effective lol
	let mtx_vp      = g_mtx_vp;
	let mtx_scale   = g_mtx_scale;
	let mtx_move    = g_mtx_move;
	let mtx_rotateA = g_mtx_rotateA;
	let mtx_rotateB = g_mtx_rotateB;
	let mtx_rotateC = g_mtx_rotateC;
	let mtx_rotateZ = g_mtx_rotateZ;
	let mtx_model   = g_mtx_model;
	let vec_pos     = g_vec_pos;
	
	// Calculate parameters for this turn
	const S         = (g_start_S     + e * (g_next_S      - g_start_S    )) * g_scale;
	const add_c     = g_start_c      + e * (g_next_c      - g_start_c     );
	const r_amp     = g_start_r_amp  + e * (g_next_r_amp  - g_start_r_amp );
	const add_nx    = g_start_nx     + e * (g_next_nx - g_start_nx);
	const add_ra    = TAU / (g_start_ra + e * (g_next_ra  - g_start_ra));
	const add_a     = g_start_a      + e * (g_next_a      - g_start_a     );
	const add_b     = g_start_b      + e * (g_next_b      - g_start_b     );
	const sr        = g_start_sr     + e * (g_next_sr     - g_start_sr    );
	const sr_off    = g_start_sr_off + e * (g_next_sr_off - g_start_sr_off);
	const oa        = g_ry;
	const ob        = g_start_ob     + e * (g_next_ob     - g_start_ob    );
	const td        = 500;
	const t         = g_time / td;
	const tt        = t / 4;
	const sc_w2     = sc_w * 0.5;
	const sc_h2     = sc_h * 0.5;
	
	// Calculate perpendicular length from circle center to chord when central angle is 90 degrees
	//
	// If the radius of the circle is √2, the length of perpendicular and half the chord is 1, so
	// Perpendicular length = 1 / √2 * Radius
	//
	const p_len   = 1.0 / Math.sqrt(2) * sr;
	const p_ratio = p_len / sr;
	const p2      = Math.PI / 2;
	const p4      = Math.PI / 4;
			
	mtx_scale.scale(S,S,S);
	mtx_move.translate(0,-sr_off*S,0);
	
	mtx_rotateA.rotateZ(oa);
	mtx_rotateB.rotateX(ob);
	mtx_rotateZ.rotateZ(g_rz);

	const rt = (g_dtime) / 5000;
	g_ry += (rt * 3.0);
	g_rz += (rt * 1.5);

	// Prepare various tables for speed optimization
	const colors = [];
	for(let i = 0;i < g_start_colors.length;++i)
	{
		const col = 
		{
			h: SL.mix(g_start_colors[i].h,
					  g_next1_colors[i].h,ce),
			s: SL.mix(g_start_colors[i].s,
					  g_next1_colors[i].s,ce),
			l: SL.mix(g_start_colors[i].l,
					  g_next1_colors[i].l,ce)
		};
		colors.push(col);
	}
	const hls_colors = [];
	for(let i = 0;i < colors.length;++i)
	{
		const col = colors[i];
		const h   = col.h * 360;
		const s   = Math.floor(col.s * 100)+"%";
		const l   = (col.l < 0.90) ? "50%" : (Math.floor(col.l * 100)+"%");
		hls_colors.push(`hsl(${h},${s},${l})`);
	}
	const x = [];
	const y = [];
	const z = [];
	let a   = 0.0;
	let b   = 0.0;
	for(let i = 0;i < POINT_NUM;++i)
	{
		// Radius is 1.0x when angle is 0 and 90 degrees, but p_ratio times when 45 degrees
		// Becomes ..., so interpolate ratio centering on 45 degrees to calculate radius
		const aa        = a % p2;
		const bb        = b % p2;
		const sra_ratio = p_ratio + (Math.abs(aa - p4) / p4) * (1.0 - p_ratio);
		const srb_ratio = p_ratio + (Math.abs(bb - p4) / p4) * (1.0 - p_ratio);
		const srb       = sr * srb_ratio;
		const sra       = srb * Math.cos(b) * sra_ratio;

		// Calculate point location
		//
		// The calculation to draw this sphere is from 'Generative Art [Popular Edition]' by Matt Pearson
		// I referred to '5.3.3 The Wrong Way to Draw a Sphere' in the Processing Practice Guide. 
		//
		x.push(sra * Math.cos(a));
		y.push(srb * Math.sin(b));
		z.push(sra * Math.sin(a));

		// Update angle for sphere
		a += add_a;
		b += add_b;
	}
	
	
	// Going to draw!
	ctx.globalCompositeOperation = 'lighter';
	ctx.translate(sc_w / 2,sc_h / 2);
	ctx.lineWidth = 0.0;

	let c   = 0.0;
	let nx  = 0.0;
	const tau = TAU - 0.02;	// Avoid overlapping just a little bit before
	for(let ra = 0;ra < tau;ra += add_ra)
	{
		mtx_rotateC.rotateZ(ra);
		
		// Compose transformation matrix first
		mtx_model.copy(mtx_scale);
		mtx_model.mul(mtx_rotateA);
		mtx_model.mul(mtx_rotateB);
		mtx_model.mul(mtx_move);
		mtx_model.mul(mtx_rotateC);
		mtx_model.mul(mtx_rotateZ);
		mtx_model.mul(mtx_vp);
	
		for(let i = 0;i < POINT_NUM;++i)
		{
			// Select color
			let pal = Math.floor(c) % colors.length;
			c += add_c;
			
			// Determine circle size with noise
			const n = Math.abs(g_pn.perlin(t + nx,0,tt) * r_amp) * g_scale;
			nx += add_nx;

			ctx.beginPath();
			ctx.fillStyle = hls_colors[pal];
			
			// Coordinate Transformation
			vec_pos.setValue(x[i],y[i],z[i],1.0);
			vec_pos.mul_matrix(mtx_model);
			vec_pos.x /= vec_pos.w;
			vec_pos.y /= vec_pos.w;
			vec_pos.x *= sc_w2;
			vec_pos.y *= sc_h2;
			
			// Draw Point
			ctx.arc(vec_pos.x,vec_pos.y,n,0,TAU,false);
			ctx.fill();
		}
	}
	
	ctx.restore();
	
	// Bloom Processing
	let screen = document.getElementById("game-screen");
	do_bloom(ctx,screen);
	
	if(g_time >= g_next_time)
	{
		// Determine next break time and reset
		g_start_time = g_time;
		g_next_time  = g_start_time + MORPH_TIME;
		reset();
	}
	
}

function render()
{
	
	// Drawing processing for every turn
	
	// Time Calculation
	const last_time = g_time;
	g_time = (new Date).getTime();
	if(last_time == 0)
	{	g_dtime = 0;	}
	else
	{	g_dtime = g_time - last_time;	}
	
	// Drawing Core
	draw();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render);

}

</script>
</head>
<body onload="init()">
	<div id="fps"></div>
	<canvas id="game-screen"></canvas>
</body>
</html>
