<!DOCTYPE html>
<html>
<head>
<title>Papa's Rose Curve</title>
<meta charset="utf-8">
<meta name="viewport" content="width=320, user-scalable=no, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">

<link rel="stylesheet" href="./../vlib/vl_common_v1.0.0.css">
<script type="text/javascript" src="./../vlib/vl_common_v1.0.0.js"></script>
<!--<script type="text/javascript" src="./../vlib/vl_3d_v1.0.0.js"></script>-->

<script type="text/javascript">

// Global Object
let g_game_width    = 320;
let g_game_height   = 320;

let g_time   = 0;			// Current time [ms]
let g_dtime  = 0;			// Elapsed time since last drawing [ms]

let g_screen_ctx    = null;
let g_start_time    = 0;
let g_next_time     = 0;

let g_last_fps_time = 0;
let g_fps_count     = 0;
let g_fps           = 60;
let g_fps_list      = [];

let g_cnt           = 0;

function init()
{
	
	// Initialization processing
	
	// Preparation
	setup();
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render);
	
}

function adjust_screen()
{

	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 512;
		g_game_height = 512;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width)  / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

	// Create ImageData for off-screen
	let ctx = screen.getContext("2d");
	g_offsc = ctx.createImageData(g_game_width,g_game_height);
	
	// Fill so alpha value becomes 255 at first
	g_offsc.data.fill(255);
	
}

function setup_obj()
{

	// Preparation of object
	
	// Get Context of main screen in advance
	const screen = document.getElementById("game-screen");
	g_screen_ctx = screen.getContext("2d");
	
}

function setup()
{
	
	// Preparation
		
	// Screen Adjustment
	adjust_screen();
	
	// Preparation of object
	setup_obj();

}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// Add to FPS history
		g_fps_list.push(g_fps_count);
		if(g_fps_list.length > 10)
		{	
			// Delete first and keep up to past n times
			// Use average of FPS (moving average)
			g_fps_list.shift();
		}
		let fps_ave = 0;
		for(let i = 0;i < g_fps_list.length;++i)
		{	fps_ave += g_fps_list[i];	}
		fps_ave /= g_fps_list.length;
		
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (fps_ave*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;
		g_fps = fps_ave;
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

// Processing compatible methods
const TAU = 2.0 * Math.PI;

function stroke(c)
{
	g_screen_ctx.strokeStyle = `rgb(${c},${c},${c})`;
}

function background(gray)
{
	g_screen_ctx.save();
	g_screen_ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
	g_screen_ctx.fillRect(0,0,g_game_width,g_game_height);
	g_screen_ctx.restore();
}

function push()
{
	g_screen_ctx.save();
	g_screen_ctx.beginPath();
}

function pop()
{
	g_screen_ctx.restore();
}

function translate(x,y)
{
	g_screen_ctx.translate(x,y);
}

function point(x,y,z)
{
	// Ignore z for now
	g_screen_ctx.moveTo(x,y);
	g_screen_ctx.lineTo(x+0.01,y+0.01);
	g_screen_ctx.stroke();
}

function draw()
{

	// Drawing Core
	
	// Save start time
	if(g_start_time  == 0)
	{
		g_start_time = g_time;
	}
	
	// Decompose and transcribe ayato-san's Tweet Processing code
	stroke(255);
	const c = Math.cos;
	const S = g_game_width;
	
	background(8);
	
	const V = S / 7;
	const t = g_time / 2000;
	const s = S / 800;		// Match to original source Canvas
	const d = 18 * s;		// Adjust radius ratio
	let k;

	for(let i = 0;(i++) < 6;)
	{
		for(let j = 0;(j++) < 6;)
		{
			push();
			translate(i * V,j * V);
			const r = d * (2 + c((i + j) * t - j));
			stroke(r * 12);
			for(let l = 0;(l += 0.03) < TAU;)
			{
				point(r * c(i * l) * c(k = l - t),
					  r * c(j * l) * Math.sin(k),
					  9);
			}
			pop();
		}
	}

}

function render()
{
	
	// Drawing processing for every turn
	
	// Time Calculation
	const last_time = g_time;
	g_time = (new Date).getTime();
	if(last_time == 0)
	{	g_dtime = 0;	}
	else
	{	g_dtime = g_time - last_time;	}
	
	// Drawing Core
	draw();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render);

}

</script>
</head>
<body onload="init()">
	<div id="fps"></div>
	<canvas id="game-screen"></canvas>
</body>
</html>
