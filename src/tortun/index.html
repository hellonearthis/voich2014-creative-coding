// Torus Object Manager
class TorusObjMan extends Obj3dManBase
{
	// Constructor
	constructor()
	{
		// Initialization
		super();
		
		// Generate Vertex List
		this.create(DEF_TORUS_NUM);
	}

	// Generate object vertex list
	create(n)
	{
		// Secure data area
		const totalVertex    = n * n;							// Number of vertices
		const totalPolygon   = totalVertex * 2;					// Number of polygons
		const totalPolyIndex = totalPolygon *					// Vertex Index
							   this.vertexNumForPrimitive;		// Total amount of info
		this.vertexList = [];
		for(let i = 0;i < totalVertex;++i)
		{
			this.vertexList.push(new VertexMan());
		}
		this.polyIndexList = new Array(totalPolyIndex);
		this.vertexNum     = totalVertex;
		this.primitiveNum  = totalPolygon;

		//
		// Rotate coordinates of each vertex of n-gon around Y-axis to form an n-gon looking from the top
		// Complete the torus figure
		// This creates a basic n-gon on the X-Y plane, translates it by the diameter of the n-gon in the X direction
		// After moving, coordinates can be calculated by rotating 360/n degrees around Y axis
		//

		// Set basic coordinates of n-gon
		let baseVectors = [];
		const radius    = 0.4;					// Radius of n-gon
		let   angle     = 0.0;					// Angle of n-gon
		let   addAngle  = (Math.PI * 2.0 / n);	// Angle increment value for n-gon
		for(let i = 0;i < n;++i,angle += addAngle)
		{
			baseVectors.push(new VectorMan4());
			baseVectors[i].x = radius * Math.cos(angle);
			baseVectors[i].y = radius * Math.sin(angle);
			baseVectors[i].z = 0.0;
		}

		// To translate basic figure by n-gon diameter in X direction
		// Create Translation Matrix
		let mMove = new MatrixMan4();
		mMove.translate(radius * 2.0,0.0,0.0);

		// After translating basic figure, rotate around Y axis
		// Calculate vertex coordinates of torus shape
		let index = 0;
		angle = 0.0;
		for(let i = 0;i < n;++i,angle += addAngle)
		{
			// Create rotation matrix
			let mRotate = new MatrixMan4();
			mRotate.rotateY(angle);

			// Compose with Translation Matrix
			let m = new MatrixMan4();
			m = m.mul(mMove);
			m = m.mul(mRotate);

			// Transform basic figure to create coordinates
			for(let j = 0;j < n;++j)
			{
				this.vertexList[index].vv.copy(baseVectors[j]);
				this.vertexList[index].vv.mul_matrix(m);
				index++;
			}
		}	
		baseVectors = [];	// won't use anymore

		// Create drawing order index list of vertices for polygon
		index = 0;
		
		// Rotation loop around Y axis (X-Z plane)	
		for(let xz = 0;xz < n;++xz)
		{
			const firstpos = n * xz;	// Index of first vertex of each polygon

			// Polygon vertex loop on X-Y plane
			//
			// Set the vertex drawing order as explained below so that the polygon surface faces outward
			//
			// The face direction (normal vector) of a triangle polygon is determined by 3 vertices
			// When there is (A,B,C), as a vector extending from A to B
			// Vector and vector extending from A to C are both positive direction
			// If it was (see figure below), the normal vector of triangle ABC is
			// Becomes front direction (-Z direction).
			// 
			//       B-----D
			//  +Y   |＼　 |
			//  |    |　＼ |
			//  |    A-----C
			//  |
			//  +------+X (Left-handed coordinate system, +Z is the far side)
			//
			// In other words, the face visible to the line of sight facing the +Z direction
			// Let's make (normal vector and view vector face each other)
			// I thought so, but the vertex drawing order is A, B, C
			// There is a need.
			// Based on this rule, in front of the other triangle BCD
			// The drawing order of vertices to face is C, B, D.
			//	
			for(let xy = 0;xy < n;++xy)
			{
				// Order is index order in tetragonal torus
				this.polyIndexList[index++] =   firstpos +   xy;									//0
				this.polyIndexList[index++] =   firstpos + ((xy + n - 1)  % n);						//3
				this.polyIndexList[index++] =  (firstpos +  (xy + n    ))           % totalVertex;	//4
				this.polyIndexList[index++] =   firstpos + ((xy + n - 1)  % n);						//3
				this.polyIndexList[index++] = ((firstpos +  (xy + n - 1)  % n) + n) % totalVertex;	//7
				this.polyIndexList[index++] =  (firstpos +  (xy + n    ))           % totalVertex;	//4
			}
		}
	}
}

// Twisted Torus Object Manager
class TwistTorusObjMan extends Obj3dManBase
{
	// Constructor
	constructor()
	{
		// Initialization
		super();
		
		// Generate Vertex List
		this.create(8);
		
		// Initialize Twist Action Counter
		this.act_cnt = 0;
	}
	
	// Generate object vertex list
	create(n)
	{
		// Secure data area
		const r_n            = 16;								// Number of cross sections
		const totalVertex    = n * r_n;							// Number of vertices
		const totalPolygon   = totalVertex * 2;					// Number of polygons
		const totalPolyIndex = totalPolygon *					// Vertex Index
							   this.vertexNumForPrimitive;		// Total amount of info
		this.vertexList = [];
		for(let i = 0;i < totalVertex;++i)
		{
			this.vertexList.push(new VertexMan());
		}
		this.polyIndexList   = new Array(totalPolyIndex);
		this.vertexNum       = totalVertex;
		this.primitiveNum    = totalPolygon;
		this.unit_vertex_num = n;				// Number of vertices per cross section
		this.unit_round_num  = r_n;				// Number of cross sections
		
		//
		// Rotate coordinates of each vertex of n-gon around Y-axis to form an n-gon looking from the top
		// Complete the torus figure
		// This creates a basic n-gon on the X-Y plane, translates it by in_radius in the X direction
		// After moving, coordinates can be calculated by rotating 360/r_n degrees around Y axis
		//

		// Set basic coordinates of n-gon
		let baseVectors = [];
		const radius    = 0.8;					// Radius of n-gon
		let   angle     = 0.0;					// Angle of n-gon
		let   addAngle  = (Math.PI * 2.0 / n);	// Angle increment value for n-gon
		for(let i = 0;i < n;++i,angle += addAngle)
		{
			baseVectors.push(new VectorMan4());
			baseVectors[i].x = radius * Math.cos(angle);
			baseVectors[i].y = radius * Math.sin(angle);
			baseVectors[i].z = 0.0;
		}

		// To translate basic figure by inner radius
		// Create Translation Matrix
		const in_radius = 1.8;
		let mMove = new MatrixMan4();
		mMove.translate(in_radius,0.0,0.0);

		// Initialize information array for Twist Action
		this.act_info = [];
		for(let i = 0;i < r_n;++i)
		{
			let info = { tx: in_radius, ry: 0, dir: 0, a: 0, r: 0 };
			this.act_info.push(info);
		}

		// After translating basic figure, rotate around Y axis
		// Calculate vertex coordinates of torus shape
		let index       = 0;
		let r_angle     = 0.0;
		let r_addAngle  = (Math.PI * 2.0 / r_n);	// Angle increment value for n-gon
		for(let i = 0;i < r_n;++i,r_angle += r_addAngle)
		{
			// Create rotation matrix
			let mRotate = new MatrixMan4();
			mRotate.rotateY(r_angle);

			// Compose with Translation Matrix
			let m = new MatrixMan4();
			m = m.mul(mMove);
			m = m.mul(mRotate);

			// Transform basic figure to create coordinates
			for(let j = 0;j < n;++j)
			{
				this.vertexList[index].vv.copy(baseVectors[j]);
				this.vertexList[index].vv.mul_matrix(m);
				index++;
			}
			
			// Remember arrangement info
			this.act_info[i].ry = r_angle;
		}	
		baseVectors = [];	// won't use anymore

		// Create drawing order index list of vertices for polygon
		index = 0;
		
		// Rotation loop around Y axis (X-Z plane)	
		for(let xz = 0;xz < r_n;++xz)
		{
			const firstpos = n * xz;	// Index of first vertex of each polygon

			// Polygon vertex loop on X-Y plane
			//
			// Set the vertex drawing order as explained below so that the polygon surface faces outward
			//
			// The face direction (normal vector) of a triangle polygon is determined by 3 vertices
			// When there is (A,B,C), as a vector extending from A to B
			// Vector and vector extending from A to C are both positive direction
			// If it was (see figure below), the normal vector of triangle ABC is
			// Becomes front direction (-Z direction).
			// 
			//       B-----D
			//  +Y   |＼　 |
			//  |    |　＼ |
			//  |    A-----C
			//  |
			//  +------+X (Left-handed coordinate system, +Z is the far side)
			//
			// In other words, the face visible to the line of sight facing the +Z direction
			// Let's make (normal vector and view vector face each other)
			// I thought so, but the vertex drawing order is A, B, C
			// There is a need.
			// Based on this rule, in front of the other triangle BCD
			// The drawing order of vertices to face is C, B, D.
			//	
			for(let xy = 0;xy < n;++xy)
			{
				// Order is index order in tetragonal torus
				this.polyIndexList[index++] =   firstpos +   xy;									//0
				this.polyIndexList[index++] =   firstpos + ((xy + n - 1)  % n);						//3
				this.polyIndexList[index++] =  (firstpos +  (xy + n    ))           % totalVertex;	//4
				this.polyIndexList[index++] =   firstpos + ((xy + n - 1)  % n);						//3
				this.polyIndexList[index++] = ((firstpos +  (xy + n - 1)  % n) + n) % totalVertex;	//7
				this.polyIndexList[index++] =  (firstpos +  (xy + n    ))           % totalVertex;	//4
			}
		}
	}
	
	// Twist Action
	action()
	{
		const r_n = this.unit_round_num;
			
		// Decide action
		if(!(this.act_cnt++ % 100))
		{
			for(let i = 0;i < r_n;++i)
			{
				const unitAngle      = rad(2);						// Angle per rotation
				this.act_info[i].dir = rnd(2) * (-1 * rnd(2));		// One of -1, 0, 1
				this.act_info[i].a   = unitAngle * (rnd(2) + 1)		// Randomly double the rotation angle
									   * this.act_info[i].dir;		// Direction is determined by dir
			}
		}
		
		// Rotate vertices of all cross sections
		const v_n = this.unit_vertex_num;
		for(let i = 0;i < r_n;++i)
		{
			// Once revert rotation on Y axis and translation on X axis,
			// After bringing cross section to center, rotate on Z axis, then translate again
			// Generate matrix multiplying translation and rotation
			//
			// Order of multiplication is,
			// Negative Y-axis rotation -> Negative translation -> Z-axis rotation -> Positive translation -> Positive Y-axis rotation
			// It becomes.
			//
			let m        = new MatrixMan4();
			let mRYplus  = new MatrixMan4();
			let mRYminus = new MatrixMan4();
			let mTXplus  = new MatrixMan4();
			let mTXMinus = new MatrixMan4();
			let mRZ      = new MatrixMan4();
			const tx     = this.act_info[i].tx;
			const ry     = this.act_info[i].ry;
			
			mRYplus.rotateY(ry);
			mRYminus.rotateY(-ry);
			mTXplus.translate(tx,0.0,0.0);
			mTXMinus.translate(-tx,0.0,0.0);
			
			// Reverse rotation if rotated more than 60 degrees
			if(Math.abs(this.act_info[i].r) >= Math.PI/3)
			{
				this.act_info[i].a   *= -1;
				this.act_info[i].dir *= -1;
			}
			
			mRZ.rotateZ(this.act_info[i].a);
			this.act_info[i].r += this.act_info[i].a;
			
			// Composition
			m = m.mul(mRYminus);
			m = m.mul(mTXMinus);
			m = m.mul(mRZ);
			m = m.mul(mTXplus);
			m = m.mul(mRYplus);
			
			const first = i * this.unit_vertex_num;
			for(let j = 0;j < v_n;++j)
			{
				// Apply to vertex coordinates
				this.vertexList[first+j].vv.mul_matrix(m);
			}
		}
	}
}

// Fan-shaped Torus Object Manager
class FanTorusObjMan extends Obj3dManBase
{
	// Constructor
	constructor(cvn,cr,ivn,ir,ia)
	{
		// Initialization
		super();
		
		// Meaning of parameters
		// cvn : Number of divided vertices of cut surface 
		// cr  : Radius of cut surface
		// ivn : Number of divided vertices of sector
		// ir  : Radius of sector center
		// ia  : Angle of sector
		
		// Generate Vertex List
		this.create(cvn,cr,ivn,ir,ia);
	}

	// Generate object vertex list
	create(cvn,cr,ivn,ir,ia)
	{
		// Secure data area
		const totalVertex    = cvn * ivn;						// Number of vertices
		const totalPolygon   = cvn * (ivn-1) * 2 * 2;			// Number of polygons
		const totalPolyIndex = totalPolygon *					// Vertex Index
							   this.vertexNumForPrimitive;		// Total amount of info
		this.vertexList = [];
		for(let i = 0;i < totalVertex;++i)
		{
			this.vertexList.push(new VertexMan());
		}
		this.polyIndexList = new Array(totalPolyIndex);
		this.vertexNum     = totalVertex;
		this.primitiveNum  = totalPolygon;

		//
		// Coordinates of each vertex of cvn-gon are formed by dividing angle ia into ivn parts looking from top around Y-axis
		// Rotate so that to complete the sector torus shape
		// This creates a basic cvn-gon on the X-Y plane, translates it by ir in the X direction, and then
		// Coordinates can be calculated by rotating ia degrees around the Y axis
		//

		// Set basic coordinates of cvn-gon
		let baseVectors = [];
		const radius    = cr;						// Radius of cvn-gon
		let   angle     = 0.0;						// Angle of cvn-gon
		let   addAngle  = (Math.PI * 2.0 / cvn);	// Angle increment value for cvn-gon
		for(let i = 0;i < cvn;++i,angle += addAngle)
		{
			baseVectors.push(new VectorMan4());
			baseVectors[i].x = radius * Math.cos(angle);
			baseVectors[i].y = radius * Math.sin(angle);
			baseVectors[i].z = 0.0;
		}

		// To translate basic figure by ir in X direction
		// Create Translation Matrix
		let mMove = new MatrixMan4();
		mMove.translate(ir,0.0,0.0);

		// After translating basic figure, rotate around Y axis
		// Calculate vertex coordinates of torus shape
		let index = 0;
		addAngle  = (rad(ia) / ivn);	// Sector angle increment value
		angle     = 0.0;
		for(let i = 0;i < ivn;++i,angle += addAngle)
		{
			// Create rotation matrix
			let mRotate = new MatrixMan4();
			mRotate.rotateY(angle);

			// Compose with Translation Matrix
			let m = new MatrixMan4();
			m = m.mul(mMove);
			m = m.mul(mRotate);

			// Transform basic figure to create coordinates
			for(let j = 0;j < cvn;++j)
			{
				this.vertexList[index].vv.copy(baseVectors[j]);
				this.vertexList[index].vv.mul_matrix(m);
				index++;
			}
		}	
		baseVectors = [];	// won't use anymore

		// Create drawing order index list of vertices for polygon
		index = 0;
		
		// Rotation loop around Y axis (X-Z plane)	
		for(let xz = 0;xz < (ivn-1);++xz)
		{
			const firstpos = cvn * xz;	// Index of first vertex of each polygon

			// Polygon vertex loop on X-Y plane
			//
			// Set the vertex drawing order as explained below so that the polygon surface faces outward
			//
			// The face direction (normal vector) of a triangle polygon is determined by 3 vertices
			// When there is (A,B,C), as a vector extending from A to B
			// Vector and vector extending from A to C are both positive direction
			// If it was (see figure below), the normal vector of triangle ABC is
			// Becomes front direction (-Z direction).
			// 
			//       B-----D
			//  +Y   |＼　 |
			//  |    |　＼ |
			//  |    A-----C
			//  |
			//  +------+X (Left-handed coordinate system, +Z is the far side)
			//
			// In other words, the face visible to the line of sight facing the +Z direction
			// Let's make (normal vector and view vector face each other)
			// I thought so, but the vertex drawing order is A, B, C
			// There is a need.
			// Based on this rule, in front of the other triangle BCD
			// The drawing order of vertices to face is C, B, D.
			//
			// Since I'm making inward faces too this time, normal vectors in the opposite direction
			// Drawing order of polygon vertices held becomes A,C,B and C,D,B
			// It becomes.
			// 
			// Front: A,B,C,C,B,D
			// Back: A,C,B,C,D,B
			//	
			for(let xy = 0;xy < cvn;++xy)
			{
				// Case of cvn = 4
				// Since I'm making both sides this time, I arranged them in an easy-to-understand order
				
				//   0+--+4  Front: 1,0,5,5,0,4
				//    |＼|   Back: 1,5,0,5,4,0
				//   1+--+5  Front: 2,1,6,6,1,5
				//    |＼|   Back: 2,6,1,6,5,1
				//   2+--+6  :
				//    |＼|   :
				//   3+--+7  Front: 0,3,4,4,3,7
				//    |＼|   Back: 0,4,3,4,7,3
				//   0+--+4
				//   ↑
				//   firstpos
				//
				this.polyIndexList[index++] =   firstpos +   xy;							//0
				this.polyIndexList[index++] =   firstpos + ((xy + cvn - 1)  % cvn);			//3
				this.polyIndexList[index++] =  (firstpos +  (xy + cvn    ));				//4
				this.polyIndexList[index++] =  (firstpos +  (xy + cvn    ));				//4
				this.polyIndexList[index++] =   firstpos + ((xy + cvn - 1)  % cvn);			//3
				this.polyIndexList[index++] = ((firstpos +  (xy + cvn - 1)  % cvn) + cvn);	//7
				
				this.polyIndexList[index++] =   firstpos +   xy;							//0
				this.polyIndexList[index++] =  (firstpos +  (xy + cvn    ));				//4
				this.polyIndexList[index++] =   firstpos + ((xy + cvn - 1)  % cvn);			//3
				this.polyIndexList[index++] =  (firstpos +  (xy + cvn    ));				//4
				this.polyIndexList[index++] = ((firstpos +  (xy + cvn - 1)  % cvn) + cvn);	//7
				this.polyIndexList[index++] =   firstpos + ((xy + cvn - 1)  % cvn);			//3

			}
		}
	}
}

// Cylinder Object Manager
class CylinderObjMan extends Obj3dManBase
{
	// Constructor
	constructor()
	{
		// Initialization
		super();
		
		// Generate Vertex List
		this.create(DEF_CYLINDER_NUM);
	}

	// Generate object vertex list
	create(n)
	{
		// Secure data area
		const totalVertex    = n * 2;							// Number of vertices
		const totalPolygon   = totalVertex * 2;					// Number of polygons
		const totalPolyIndex = totalPolygon *					// Vertex Index
							   this.vertexNumForPrimitive;		// Total amount of info
		this.vertexList = [];
		for(let i = 0;i < totalVertex;++i)
		{
			this.vertexList.push(new VertexMan());
		}
		this.polyIndexList = new Array(totalPolyIndex);
		this.vertexNum     = totalVertex;
		this.primitiveNum  = totalPolygon;

		//
		// A cylinder is created by placing vertices of an n-gon on the X-Z plane and expanding them along the Y axis
		// Create object.
		//
		
		// Set basic coordinates of n-gon
		const radius   = 0.4;					// Radius of n-gon
		let   angle    = 0.0;					// Angle of n-gon
		let   addAngle = (Math.PI * 2.0 / n);	// Angle increment value for n-gon
		for(let i = 0;i < n;++i,angle += addAngle)
		{
			this.vertexList[  i].vv.x = radius * Math.cos(angle);	// Upper n-gon
			this.vertexList[  i].vv.z = radius * Math.sin(angle);
			this.vertexList[  i].vv.y =  0.5;
			this.vertexList[n+i].vv.x = radius * Math.cos(angle);	// Lower n-gon
			this.vertexList[n+i].vv.z = radius * Math.sin(angle);
			this.vertexList[n+i].vv.y = -0.5;
		}

		// Create drawing order index list of vertices for polygon
		let index = 0;
		
		for(let i = 0;i < n;++i)
		{
			// Polygon vertex loop on X-Y plane
			//
			// Set the vertex drawing order as explained below so that the polygon surface faces outward
			//
			// The face direction (normal vector) of a triangle polygon is determined by 3 vertices
			// When there is (A,B,C), as a vector extending from A to B
			// Vector and vector extending from A to C are both positive direction
			// If it was (see figure below), the normal vector of triangle ABC is
			// Becomes front direction (-Z direction).
			// 
			//       B-----D
			//  +Y   |＼　 |
			//  |    |　＼ |
			//  |    A-----C
			//  |
			//  +------+X (Left-handed coordinate system, +Z is the far side)
			//
			// In other words, the face visible to the line of sight facing the +Z direction
			// Let's make (normal vector and view vector face each other)
			// I thought so, but the vertex drawing order is A, B, C
			// There is a need.
			// Based on this rule, in front of the other triangle BCD
			// The drawing order of vertices to face is C, B, D.
			//	
			
			// Order is index order in quadrangular prism

			// Create outward polygon
			this.polyIndexList[index++] =   i + n;				//4
			this.polyIndexList[index++] =   i;					//0
			this.polyIndexList[index++] =   (i + 1) % n + n;	//5
			this.polyIndexList[index++] =   (i + 1) % n + n;	//5
			this.polyIndexList[index++] =   i;					//0
			this.polyIndexList[index++] =   (i + 1) % n;		//1
			
			// Create inward polygon
			this.polyIndexList[index++] =   i + n;				//4
			this.polyIndexList[index++] =   (i + 1) % n + n;	//5
			this.polyIndexList[index++] =   i;					//0
			this.polyIndexList[index++] =   (i + 1) % n + n;	//5
			this.polyIndexList[index++] =   (i + 1) % n;		//1
			this.polyIndexList[index++] =   i;					//0
		}
	}
}

const MAX_Z_POS             = 1000;			// Max Z direction value allowed for drawing
const INVALID_Z_VALUE       = 10000.0;		// Invalid Z value
const INVALID_DP_VALUE      = 10000.0;		// Invalid dot product value
const DEFAULT_AMBIENT_LIGHT = 0.0;			// Default ambient light value (Common for R/G/B)
const DEFAULT_DEFUSE_LIGHT  = 0.7;			// Default diffuse light value (Common for R/G/B)
const DEFAULT_LIGHT_X       = 2.0;			// Default light source vector X direction
const DEFAULT_LIGHT_Y       = -4.0;			// Default light source vector Y direction
const DEFAULT_LIGHT_Z       = 1.0;			// Default light source vector Z direction
											// ^ It's not coordinates, it's a vector (direction)
											//  It's the direction the light source is facing

class RenderingMan
{
	// Constructor
	constructor(screen,offscreen,algo_label)
	{
		// Initialization
		this.sc             = screen;
		this.sc_w           = screen.width;
		this.sc_h           = screen.height;
		this.sc_ctx         = screen.getContext("2d");
		this.offsc          = offscreen;
		this.algo           = algo_label;
		
		this.mtx_master     = new MatrixMan4();
		this.mtx_world      = new MatrixMan4();
		this.mtx_view       = new MatrixMan4();
		this.mtx_projection = new MatrixMan4();
		this.mtx_viewport   = new MatrixMan4();
		
		this.vEye           = new VectorMan3(0,0,1);					// View vector facing Z+
		this.vLight         = new VectorMan3(DEFAULT_LIGHT_X,			// Light source direction vector
						  					 DEFAULT_LIGHT_Y,
						  					 DEFAULT_LIGHT_Z);
		this.vAmbientColor  = new VectorMan3(DEFAULT_AMBIENT_LIGHT,		// Ambient Light Color
											 DEFAULT_AMBIENT_LIGHT,
											 DEFAULT_AMBIENT_LIGHT);
		this.vDiffuseColor = new VectorMan3(DEFAULT_DEFUSE_LIGHT,		// Diffuse Light Color
											DEFAULT_DEFUSE_LIGHT,
											DEFAULT_DEFUSE_LIGHT);
		
		// Min/Max X coordinate value list
		this.aMinX     = new Array(this.sc_h);
		this.aMaxX     = new Array(this.sc_h);
		
		// Various Z buffers
		this.aZBuffer  = new Array(this.sc_w * this.sc_h);
		this.aMinZ     = new Array(this.sc_h);
		this.aMaxZ     = new Array(this.sc_h);
		this.aDpBuffer = new Array(this.sc_w * this.sc_h);	// Dot product value buffer
		this.aCZBuffer = new Array(this.sc_w * this.sc_h);	// Center Z value buffer
		
		// Initialize rendering method
		this.setupFlatShading();
	}
	
	// Set ambient light color
	setAmbientLightColor(r,g,b)
	{
		this.vAmbientColor  = new VectorMan3(r,g,b);
	}
	
	// Set diffuse light color
	setDefuseLightColor(r,g,b)
	{
		this.vDiffuseColor  = new VectorMan3(r,g,b);
	}
	
	// Prepare with Canvas LINE drawing
	setupContextLine()
	{
		this.funcDrawBegin     = this.drawBegin_context_line;
		this.funcDrawEnd       = this.drawEnd_context_line;
		this.funcDrawLine      = this.drawLine_context_line;
		this.funcDrawPrimitive = this.drawPolygonWithWireframe;
		
		this.algo.innerText = "context.lineTo";
	}
	
	// Canvas LINE drawing pre-processing
	drawBegin_context_line(ctx,sc_w,sc_h)
	{
		// Screen Clear
		ctx.clearRect(0,0,sc_w,sc_h);
		
		// Determine wire color
		ctx.strokeStyle = 'lime';
		
		// Instruction to start drawing registration
		ctx.beginPath();
	}
	
	// Canvas LINE drawing post-processing
	drawEnd_context_line(ctx,sc_w,sc_h)
	{
		// Instruction to execute drawing
		ctx.stroke();
	}
	
	// Canvas LINE drawing processing
	drawLine_context_line(ctx,sc_w,sc_h,x1,y1,x2,y2)
	{
		// LINE Drawing
		ctx.moveTo(x1,y1);
		ctx.lineTo(x2,y2);
	}
	
	// Prepare with Bresenham LINE drawing
	setupBresenhamLine()
	{
		this.funcDrawBegin     = this.drawBegin_bresenham;
		this.funcDrawEnd       = this.drawEnd_bresenham;
		this.funcDrawLine      = this.drawLine_bresenham;
		this.funcDrawPrimitive = this.drawPolygonWithWireframe;
		
		this.algo.innerText = "bresenham line";
	}
	
	// Bresenham LINE drawing pre-processing
	drawBegin_bresenham(ctx,sc_w,sc_h)
	{
		// Fast Clear
		let data = this.offsc.data;	// Move reference to local variable temporarily
		data.fill(0);				// Faster than counting with for loop if zero-filling
		
		// Determine wire color
		this.line_color = { r: 0, g: 255, b: 0, a: 255 };
	}
	
	// Bresenham LINE drawing post-processing
	drawEnd_bresenham(ctx,sc_w,sc_h)
	{
		// Transfer off-screen
		ctx.putImageData(this.offsc,0,0);
	}
	
	// Bresenham LINE drawing processing
	drawLine_bresenham(ctx,sc_w,sc_h,x1,y1,x2,y2)
	{
		// Convert to integer (Important! if not done, writing to ImageData will fail)
		x1 = Math.floor(x1);
		y1 = Math.floor(y1);
		x2 = Math.floor(x2);
		y2 = Math.floor(y2);
		
		// Parameter preparation
		let dx   = Math.abs(x2 - x1);
		let dy   = Math.abs(y2 - y1);
		let addX = (x1 < x2) ? 1 : -1;
		let addY = (y1 < y2) ? 1 : -1;

		// Clipping
		if(((x1 < 0) && (x2 < 0)) || ((x1 >= sc_w) && (x2 >= sc_w)) ||
		   ((y1 < 0) && (y2 < 0)) || ((y1 >= sc_h) && (y2 >= sc_h)))
		{	return;	}
		
		if(dx > dy)
		{
			// Loop by X
			let diff = Math.floor(dy - dx / 2);

			while(x1 != x2)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);

				// Update Coordinates
				x1 += addX;
				if(diff >= 0)
				{
					y1   += addY;
					diff -= dx;
				}
				diff += dy;
			}
		}
		else
		{
			// Loop by Y
			let diff = Math.floor(dx - dy / 2);

			while(y1 != y2)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);

				// Update Coordinates
				y1 += addY;
				if(diff >= 0)
				{
					x1   += addX;
					diff -= dy;
				}
				diff += dx;
			}
		}

		// Draw end point
		this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
	}
	
	// Point drawing for Bresenham LINE drawing
	drawPoint_bresenham(sc_w,sc_h,x,y,color)
	{
		// Clip and draw
		if((x >= 0) && (x < sc_w) && (y >= 0) && (y < sc_h))
		{
			const pos = (sc_w << 2) * y + (x << 2);		// = (sc_w * 4) * y + (x * 4)
			this.offsc.data[pos + 0] = color.r;
			this.offsc.data[pos + 1] = color.g;
			this.offsc.data[pos + 2] = color.b;
			this.offsc.data[pos + 3] = color.a;
		}
	}
	
	// Prepare with double-step Bresenham LINE drawing
	setupDoubleStepBresenhamLine()
	{
		this.funcDrawBegin     = this.drawBegin_bresenham;
		this.funcDrawEnd       = this.drawEnd_bresenham;
		this.funcDrawLine      = this.drawLine_doublestep_bresenham;
		this.funcDrawPrimitive = this.drawPolygonWithWireframe;
		
		this.algo.innerText = "double-step bresenham line";
	}
	
	// Double-step Bresenham LINE drawing processing
	drawLine_doublestep_bresenham(ctx,sc_w,sc_h,x1,y1,x2,y2)
	{
		// Convert to integer (Important! if not done, writing to ImageData will fail)
		x1 = Math.floor(x1);
		y1 = Math.floor(y1);
		x2 = Math.floor(x2);
		y2 = Math.floor(y2);
		
		// Parameter preparation
		let dx   = Math.abs(x2 - x1);
		let dy   = Math.abs(y2 - y1);
		let addX = (x1 < x2) ? 1 : -1;
		let addY = (y1 < y2) ? 1 : -1;
		let e,n,nn; // e is accumulated error value
		
		// Clipping
		if(((x1 < 0) && (x2 < 0)) || ((x1 >= sc_w) && (x2 >= sc_w)) ||
		   ((y1 < 0) && (y2 < 0)) || ((y1 >= sc_h) && (y2 >= sc_h)))
		{	return;	}
		
		// When completely horizontal line
		if(dy == 0)
		{
			// Loop is half the difference since proceeding from both ends
			n = dx >> 1;	//n = dx / 2;
			
			// Drawing Loop
			for(let i = 0;i <= n;++i)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
				this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
				
				// Update drawing position
				x1 += addX;
				x2 -= addX;
			}
		
			// Draw last 1 pixel if drawing amount is odd
			if((dx & 0x01) == 0)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1 - addX,y1,this.line_color);
			}
		}
		// When completely vertical line
		else if(dx == 0)
		{
			// Loop is half the difference since proceeding from both ends
			n = dy >> 1;	//n = dy / 2;
			
			// Drawing Loop
			for(let i = 0;i <= n;++i)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
				this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);

				// Update drawing position
				y1 += addY;
				y2 -= addY;
			}
		
			// Draw last 1 pixel if drawing amount is odd
			if((dy & 0x01) == 0)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1 - addY,this.line_color);
			}
		}
		else if(dx >= dy) 
		{
			// When looping for X

			// Initialize error value
			e = -dx;

			// Calculation of loop count
			n = (dx + 1) >> 2;	//n = (dx + 1) / 4;

			// In case m < 1/2, m = |x2 - x1| / |y2 - y1|
			if((dy << 2) < (dx << 1))
			{
				for(let i = 0;i < n;++i)
				{
					// Update error value
					e += (dy << 2);	//e += 4dy;
					
					if(e < 0)
					{
						// ●●○

						// Draw points for 2 pixels simultaneously
						this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x1 + addX,y1,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x2 - addX,y2,this.line_color);
						
						// Update drawing position
						x1 += (addX << 1);	//x1 += 2addX;
						x2 -= (addX << 1);	//x2 -= 2addX;
					}
					else
					{
						if(e < (dy << 1))	//if(e < 2dy)
						{
							//    ○
							// ●●

							// Draw points for 2 pixels simultaneously
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x1 + addX,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2 - addX,y2,this.line_color);
							
							// Update drawing position
							x1 += (addX << 1);	//x1 += 2addX;
							x2 -= (addX << 1);	//x2 -= 2addX;
							y1 += addY;
							y2 -= addY;
							
							// Update error value
							e -= (dx << 1);		//e -= 2dx;
						}
						else
						{
							//  ●○
							// ●

							// Draw 2 pixels simultaneously

							// Draw 1st pixel
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
							
							// Update drawing position
							y1 += addY;
							y2 -= addY;
							
							// Draw 2nd pixel
							this.drawPoint_bresenham(sc_w,sc_h,x1 + addX,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2 - addX,y2,this.line_color);

							// Update drawing position
							x1 += (addX << 1);	//x1 += 2addX; 
							x2 -= (addX << 1);	//x2 -= 2addX;
								
							// Update error value
							e -= (dx << 1);		//e -= 2dx;
						}
					}
				}
			}
			// Case 1/2 ≦ m ≦ 1: m = |y2 - y1| / |x2 - x1|
			else
			{
				for(let i = 0;i < n;++i)
				{
					// Update error value
					e += ((dy << 2) - (dx << 1));	//e += 4dy - 2dx;
					
					if(e >= 0)
					{	
						//    ○
						//  ●
						// ●

						// Draw 2 pixels simultaneously
						this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x1 + addX,y1 + addY,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x2 - addX,y2 - addY,this.line_color);

						// Update drawing position
						x1 += (addX << 1);	//x1 += 2addX;
						x2 -= (addX << 1);	//x2 -= 2addX;
						y1 += (addY << 1);	//y1 += 2addY;
						y2 -= (addY << 1);	//y2 -= 2addY;
						
						// Update error value
						e -= (dx << 1);		//e -= 2dx;
					}
					else
					{
						if(e < ((dy << 1) - (dx << 1)))	//if(e < 2dy - 2dx)
						{
							//    ○
							// ●●

							// Draw 2 pixels simultaneously
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x1 + addX,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2 - addX,y2,this.line_color);

							// Update drawing position
							x1 += (addX << 1);	//x1 += 2addX;
							x2 -= (addX << 1);	//x2 -= 2addX;
							y1 += addY;
							y2 -= addY;
						}
						else
						{
							//  ●○
							// ●

							// Draw 2 pixels simultaneously
							
							// Draw 1st pixel
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);

							// Update drawing position
							y1 += addY;
							y2 -= addY;
							
							// Draw 2nd pixel
							this.drawPoint_bresenham(sc_w,sc_h,x1 + addX,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2 - addX,y2,this.line_color);

							// Update drawing position
							x1 += (addX << 1);	//x1 += 2addX;
							x2 -= (addX << 1);	//x2 -= 2addX;
						}
					}
				}
			}

			// Draw fractional part less than 4 pixels
			
			// Calculate loop count
			n = ((dx + 1) % 4);
			
			for(let i = 0;i < n;++i)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
				
				// Update drawing position
				x1 += addX;
				
				// Update error value
				e += (dy << 1);		//e += 2dy;

				if(e >= 0)
				{
					// Update drawing position
					y1 += addY;

					// Update error value
					e -= (dx << 1);		//e -= 2dx;
				}
			}
		}
		else
		{
			// Loop for Y

			// Initialize error value
			e = -dy;

			// Calculate loop count
			n = (dy + 1) >> 2;	//n = (dy + 1) / 4;

			// In case m < 1/2, m = |y2 - y1| / |x2 - x1|
			if(dy >= (dx << 1))
			{
				for(let i = 0; i < n;++i)
				{
					// Update error value
					e += (dx << 2);	//e += 4dx;
					
					if(e < 0)
					{
						//○
						// ●
						// ● 
						
						// Draw 2 pixels simultaneously
						this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x1,y1 + addY,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x2,y2 - addY,this.line_color);
						
						// Update drawing position
						y1 += (addY << 1);	//y1 += 2addY;
						y2 -= (addY << 1);	//y2 -= 2addY;
					}
					else
					{
						if(e < (dx << 1))	//if(e < 2dx)
						{
							//  ○
							// ●
							// ●

							// Draw 2 pixels simultaneously
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1 + addY,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2 - addY,this.line_color);

							// Update drawing position
							y1 += (addY << 1);	//y1 += 2addY;
							y2 -= (addY << 1);	//y2 -= 2addY;
							x1 += addX;
							x2 -= addX;
							
							// Update error value
							e -= (dy << 1);		//e -= 2dy;
						}
						else
						{
							//  ○
							//  ●
							// ●

							// Draw 2 pixels simultaneously

							// Draw 1st pixel
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
							
							// Update drawing position
							x1 += addX;
							x2 -= addX;
							
							// Draw 2nd pixel
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1 + addY,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2 - addY,this.line_color);
							
							// Update drawing position
							y1 += (addY << 1);	//y1 += 2addY;
							y2 -= (addY << 1);	//y2 -= 2addY;
							
							// Update error value
							e -= (dy << 1);		//e -= 2dy;
						}
					}
				}
			}
			// Case 1/2 ≦ m ≦ 1: m = |y2 - y1| / |x2 - x1|
			else
			{
				for(let i = 0;i < n;++i)
				{
					// Update error value
					e += (dx << 2) - (dy << 1);		//e += (4dx - 2dy);
					
					if(e >= 0)
					{
						//    ○
						//  ●
						// ●

						// Draw 2 pixels simultaneously
						this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x1 + addX,y1 + addY,this.line_color);
						this.drawPoint_bresenham(sc_w,sc_h,x2 - addX,y2 - addY,this.line_color);
						
						// Update drawing position
						x1 += (addX << 1);	//x1 += 2addX;
						x2 -= (addX << 1);	//x2 -= 2addX;
						y1 += (addY << 1);	//y1 += 2addY;
						y2 -= (addY << 1);	//y2 -= 2addY;
						
						// Update error value
						e -= (dy << 1);		//e -= 2dy;
					}
					else
					{
						if(((dx << 1) - (dy << 1)) > e)	//if((2dx - 2dy) > e)
						{
							//  ○
							// ●　
							// ●

							// Draw 2 pixels simultaneously
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1 + addY,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2 - addY,this.line_color);

							// Update drawing position
							y1 += (addY << 1);	//y1 += 2addY;
							y2 -= (addY << 1);	//y2 -= 2addY;
							x1 += addX;
							x2 -= addX;
						}
						else
						{
							//  ○
							//  ●
							// ●

							// Draw 2 pixels simultaneously

							// Draw 1st pixel
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);

							// Update drawing position
							x1 += addX;
							x2 -= addX;
							
							// Draw 2nd pixel
							this.drawPoint_bresenham(sc_w,sc_h,x1,y1 + addY,this.line_color);
							this.drawPoint_bresenham(sc_w,sc_h,x2,y2 - addY,this.line_color);
							
							// Update drawing position
							y1 += (addY << 1);	//y1 += 2addY;
							y2 -= (addY << 1);	//y2 -= 2addY;
						}
					}
				}
			}

			// Draw fractional part less than 4 pixels 
			
			// Calculate loop count
			n = ((dy + 1) % 4);

			for(let i = 0;i < n;++i)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
				
				// Update drawing position
				y1 += addY;

				// Update error value
				e += (dx << 1);		//e += 2dx;
			
				if(e >= 0)
				{
					// Update drawing position
					x1 += addX;

					// Update error value
					e -= (dy << 1);	//e -= 2dy;
				}
			}
		}
	}
	
	// Prepare with anti-aliased Bresenham LINE drawing
	setupBresenhamLineAA()
	{
		this.funcDrawBegin = this.drawBegin_bresenham;
		this.funcDrawEnd   = this.drawEnd_bresenham;
		this.funcDrawLine  = this.drawLine_bresenham_aa;
		
		this.algo.innerText = "bresenham antialiased-line";
	}
	
	getPixelColor(sc_w,sc_h,x,y)
	{
		// Get color of specified coordinate
		
		let color = { r:0, g:0, b:0, a:0 };
		if((x >= 0) && (x < sc_w) && (y >= 0) && (y < sc_h))
		{
			const pos = (sc_w << 2) * y + (x << 2);		// = (sc_w * 4) * y + (x * 4)
			color.r = this.offsc.data[pos + 0];
			color.g = this.offsc.data[pos + 1];
			color.b = this.offsc.data[pos + 2];
			color.a = this.offsc.data[pos + 3];
		}
		
		return color;
	}

	calcAlphaBrendColor(dst_color,src_color,alpha)
	{
		// Calculate color processed with alpha blending
		//
		// dst_color	Color at the drawing destination
		// src_color	Drawing color
		// alpha		Alpha value (16bit fractional part of fixed point)
		//
		
		// Blend color at drawing destination with (1 - alpha) and drawing color with alpha
		let color = { r:0, g:0, b:0, a:255 };
		
		//
		// color = (dst * (1 - a)) + (src * a)
		//       = dst - dst * a + src * a
		//       = dst + src * a - dst * a
		//       = dst + (src - dst) * a
		//
		
		color.r = dst_color.r + (((src_color.r - dst_color.r) * alpha) >> 16);
		color.g = dst_color.g + (((src_color.g - dst_color.g) * alpha) >> 16);
		color.b = dst_color.b + (((src_color.b - dst_color.b) * alpha) >> 16);

		return color;
	}

	// Anti-aliased Bresenham LINE drawing processing
	drawLine_bresenham_aa(ctx,sc_w,sc_h,x1,y1,x2,y2)
	{
		// Convert to integer (Important! if not done, writing to ImageData will fail)
		x1 = Math.floor(x1);
		y1 = Math.floor(y1);
		x2 = Math.floor(x2);
		y2 = Math.floor(y2);
		
		// Parameter preparation
		const dx   = Math.abs(x2 - x1);
		const dy   = Math.abs(y2 - y1);
		const addX = (x1 < x2) ? 1 : -1;
		const addY = (y1 < y2) ? 1 : -1;
		let x,y,alpha;
		let alpha_color = { r: this.line_color.r, g: this.line_color.g, b: this.line_color.b, a: 0 };
		
		// Clipping
		if(((x1 < 0) && (x2 < 0)) || ((x1 >= sc_w) && (x2 >= sc_w)) ||
		   ((y1 < 0) && (y2 < 0)) || ((y1 >= sc_h) && (y2 >= sc_h)))
		{	return;	}
		
		// When completely horizontal line
		if(dy == 0)
		{
			// Loop is half the difference since proceeding from both ends
			const n = dx >> 1;	//n = dx / 2;
			
			// Drawing Loop
			for(let i = 0;i <= n;++i)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
				this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);
				
				// Update drawing position
				x1 += addX;
				x2 -= addX;
			}
		
			// Draw last 1 pixel if drawing amount is odd
			if((dx & 0x01) == 0)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1 - addX,y1,this.line_color);
			}
		}
		// When completely vertical line
		else if(dx == 0)
		{
			// Loop is half the difference since proceeding from both ends
			const n = dy >> 1;	//n = dy / 2;
			
			// Drawing Loop
			for(let i = 0;i <= n;++i)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1,this.line_color);
				this.drawPoint_bresenham(sc_w,sc_h,x2,y2,this.line_color);

				// Update drawing position
				y1 += addY;
				y2 -= addY;
			}
		
			// Draw last 1 pixel if drawing amount is odd
			if((dy & 0x01) == 0)
			{
				// Draw Point
				this.drawPoint_bresenham(sc_w,sc_h,x1,y1 - addY,this.line_color);
			}
		}
		else if(dx > dy)
		{
			// Loop by X
			
			// Convert only Y coordinate to fixed point
			y1 = y1 << 16;
			y2 = y2 << 16;
			
			// Calculate fixed-point error value
			let e = (y2 - y1) / dx;

			while(x1 != x2)
			{
				// Get alpha value
				alpha = (y1 & 0xFFFF);
				
				// Convert Y coordinate to integer
				y = y1 >> 16;

				// Draw line part
				const color_line = this.calcAlphaBrendColor(this.getPixelColor(sc_w,sc_h,x1,y),this.line_color,0x10000-alpha);
				this.drawPoint_bresenham(sc_w,sc_h,x1,y,color_line);

				// Draw anti-aliased part
				const color_anti = this.calcAlphaBrendColor(this.getPixelColor(sc_w,sc_h,x1,y+1),this.line_color,alpha);
				this.drawPoint_bresenham(sc_w,sc_h,x1,y+1,color_anti);

				// Update Coordinates
				x1 += addX;
				y1 += e;
			}
			
			// Draw end point
			this.drawPoint_bresenham(sc_w,sc_h,x2,(y2 >> 16),this.line_color);
		}
		else
		{
			// Loop by Y
			
			// Convert only X coordinate to fixed point
			x1 = x1 << 16;
			x2 = x2 << 16;
			
			// Calculate fixed-point error value
			let e = (x2 - x1) / dy;

			while(y1 != y2)
			{
				// Get alpha value
				alpha = (x1 & 0xFFFF);
				
				// Convert X coordinate to integer
				x = x1 >> 16;
				
				// Draw line part
				const color_line = this.calcAlphaBrendColor(this.getPixelColor(sc_w,sc_h,x,y1),this.line_color,0x10000-alpha);
				this.drawPoint_bresenham(sc_w,sc_h,x,y1,color_line);

				// Draw anti-aliased part
				const color_anti = this.calcAlphaBrendColor(this.getPixelColor(sc_w,sc_h,x+1,y1),this.line_color,alpha);
				this.drawPoint_bresenham(sc_w,sc_h,x+1,y1,color_anti);

				// Update Coordinates
				x1 += e;
				y1 += addY;
			}
			
			// Draw end point
			this.drawPoint_bresenham(sc_w,sc_h,(x2 >> 16),y2,this.line_color);
		}
	}
	
	// Prepare with flat shading
	setupFlatShading()
	{
		this.funcDrawBegin     = this.drawBegin_flatshading;
		this.funcDrawEnd       = this.drawEnd_bresenham;
		this.funcDrawLine      = this.drawLine_bresenham;
		this.funcDrawPrimitive = this.drawPolygonWithFlatShading;
		
		this.algo.innerText = "Flat Shading";
	}
	
	// Flat shading drawing pre-processing
	drawBegin_flatshading(ctx,sc_w,sc_h)
	{
		// Fast Clear
		let data = this.offsc.data;	// Move reference to local variable temporarily
		data.fill(0);				// Faster than counting with for loop if zero-filling
		
		// Clear Z buffer
		this.aZBuffer.fill(INVALID_Z_VALUE);

		// Clear dot product value buffer
		this.aDpBuffer.fill(INVALID_DP_VALUE);
		
		// Clear center Z value buffer
		this.aCZBuffer.fill(INVALID_Z_VALUE);
	}
	
	
	// Set World Transformation Matrix
	setWorldMatrix(m)
	{
		this.mtx_world.copy(m);
	}
	
	// Set View Transformation Matrix
	setViewMatrix(m)
	{
		this.mtx_view.copy(m);
	}
	
	// Set Projection Transformation Matrix
	setProjectionMatrix(m)
	{
		this.mtx_projection.copy(m);
	}
	
	// Set Viewport Transformation Matrix
	setViewPortMatrix(m)
	{
		this.mtx_viewport.copy(m);
	}
	
	// Pre-drawing processing
	drawBegin()
	{
		this.funcDrawBegin(this.sc_ctx,this.sc_w,this.sc_h);
	}
	
	// Post-drawing processing
	drawEnd()
	{
		this.funcDrawEnd(this.sc_ctx,this.sc_w,this.sc_h);
	}
	
	// Draw Primitives
	drawIndexedPrimitive(vertex_list,vertex_count,index_list,primitive_count)
	{
		//
		// vertex_list		Object vertex data list
		// vertex_count		Number of items in vertex list
		// index_list		Vertex order list
		// primitive_count	Number of primitives
		//					Since one primitive is a triangle with 3 vertices
		//					Number of vertex order lists divided by 3
		//

		// Create Master Matrix
		let m = this.mtx_master;
		m.initialize();
		m.mul(this.mtx_world);		// Origin of local coordinates in world coordinates
									// Convert to position
		m.mul(this.mtx_view)		// Adjust entire world to camera position
									// Move/Rotate
		
		// Coordinate Transformation and Projection/ViewPort Transformation
		let dst_vertex_list = [];
		
		for(let i = 0;i < vertex_count;++i)
		{
			// Coordinate Transformation
			//
			// From local coordinate system of each 3D object to world coordinate system
			// Transform coordinates so it becomes scenery seen from camera at
			dst_vertex_list.push( new VertexMan());
			dst_vertex_list[i].copy(vertex_list[i]);
			dst_vertex_list[i].vv.mul_matrix(m);
			
			// Trace to coordinate system of screen actually drawing
			// (3D object coordinate system has positive Y direction upwards
			// However, the coordinate system of the drawing destination Canvas has the positive Y direction
			// Since it is facing down, convert it, and the actual
			// According to the number of pixels of width and height of the display range of drawing destination
			// Scale)		

			// Projection Transformation
			//
			// Convert 3D coordinates to 2D screen coordinates with projection transformation.
			// In this projection transformation, normalize coordinates by delimiting visible range (frustum) from viewpoint
			// Do.											
			// By this, range of X/Y/Z values in visible range is converted to -1.0 - 1.0,
			// Need to transform coordinates according to drawing destination screen resolution by next ViewPort transformation
			// There is.
			//
			dst_vertex_list[i].vv.mul_matrix(this.mtx_projection);
			
			// Dividing projected X/Y coordinates by w completes X/Y scaling
			dst_vertex_list[i].vv.x /= dst_vertex_list[i].vv.w;
			dst_vertex_list[i].vv.y /= dst_vertex_list[i].vv.w;
			// Since w value is not needed after scaling, initialize to 1.0
			dst_vertex_list[i].vv.w = 1.0;

			// ViewPort Transformation
			//
			// Matching Y coordinate direction to screen coordinate system, and X/Y/Z coordinate values to -1.0 to 1.0
			// Convert from range of to number of pixels of screen width/height.
			dst_vertex_list[i].vv.mul_matrix(this.mtx_viewport);
		}

		// Draw Polygon
		
		this.funcDrawPrimitive(dst_vertex_list,index_list,primitive_count);

	}
	
	// Draw polygon in wireframe
	drawPolygonWithWireframe(vertex_list,index_list,primitive_count)
	{
		// Draw primitives in order
		let point_index = 0;
		while(primitive_count > 0)
		{
			// Draw triangle in wireframe

			let i1 = index_list[point_index    ];
			let i2 = index_list[point_index + 1];
			let i3 = index_list[point_index + 2];

			// Omit items with Z coordinate behind viewpoint (camera position)
			//
			// * Coordinates passed through View (Camera) transformation matrix are viewpoint (camera position)
			//  Because the coordinates are transformed as (x,y,z)=(0.0,0.0,0.0), Z is negative
			//  Being a value means it is located behind the camera
			//  This will be the case.
			//
			if(((vertex_list[i1].vv.z > 0.0) ||
			    (vertex_list[i2].vv.z > 0.0) ||
			    (vertex_list[i3].vv.z > 0.0)) &&
			   ((vertex_list[i1].vv.z < MAX_Z_POS) ||
			    (vertex_list[i2].vv.z < MAX_Z_POS) ||
			    (vertex_list[i3].vv.z < MAX_Z_POS))
			  )
			{
				// Draw triangle (Bresenham)
				this.funcDrawLine(this.sc_ctx,this.sc_w,this.sc_h,
								  vertex_list[i1].vv.x,vertex_list[i1].vv.y,
						   		  vertex_list[i2].vv.x,vertex_list[i2].vv.y);

				this.funcDrawLine(this.sc_ctx,this.sc_w,this.sc_h,
								  vertex_list[i2].vv.x,vertex_list[i2].vv.y,
								  vertex_list[i3].vv.x,vertex_list[i3].vv.y);

				this.funcDrawLine(this.sc_ctx,this.sc_w,this.sc_h,
								  vertex_list[i3].vv.x,vertex_list[i3].vv.y,
								  vertex_list[i1].vv.x,vertex_list[i1].vv.y);
			}

			// Update index
			point_index += DEF_VERTEX_NUM_FOR_PRIMITIVE;

			// Reduce Primitives
			primitive_count--;
		}
	}
	
	// Calculate normal vector of triangle polygon (left-handed coordinate system)
	getNormalVectorFromPolygon(v1,v2,v3)
	{
		let n = new VectorMan3();
		let a = new VectorMan3();
		let b = new VectorMan3();

		// Vector a extending from vertex v1 to vertex v2 and
		// Calculate vector b extending from vertex v1 to vertex v3
		a.x = v2.x - v1.x;
		a.y = v2.y - v1.y;
		a.z = v2.z - v1.z;
		b.x = v3.x - v1.x;
		b.y = v3.y - v1.y;
		b.z = v3.z - v1.z;

		// Taking cross product of vectors a,b results in
		// Vector n perpendicular to plane is obtained.
		n.crossProduct(a,b);

		// The unit vector version of this vector is from vertices v1, v2, v3
		// Becomes normal vector of triangle polygon that becomes
		n.normalize();

		return n;
	}
	
	// Scanline for flat shading (Edge check Bresenham version)
	scanlineForFlat(v1,v2)
	{
		let   x1   = Math.floor(v1.x);
		let   y1   = Math.floor(v1.y);
		const x2   = Math.floor(v2.x);
		const y2   = Math.floor(v2.y);
		const dx   = Math.abs(x2 - x1);
		const dy   = Math.abs(y2 - y1);
		const addX = (x1 < x2) ? 1 : -1;
		const addY = (y1 < y2) ? 1 : -1;
		
		if(dx > dy)
		{
			// Loop by X
			let diff = Math.floor(dy - dx / 2);
			let addZ = (v2.z - v1.z) / dx;
			let Z    = v1.z;

			while(x1 != x2)
			{
				// Y range check
				if((y1 >= 0) && (y1 < this.sc_h))
				{
					// Write value
					if(this.aMinX[y1] > x1)
					{
						this.aMinX[y1] = x1;
						this.aMinZ[y1] = Z;
					}
					if(this.aMaxX[y1] < x1)
					{
						this.aMaxX[y1] = x1;
						this.aMaxZ[y1] = Z;
					}
				}

				// Update Coordinates
				x1 += addX;
				if(diff >= 0)
				{
					y1   += addY;
					diff -= dx;
				}
				diff += dy;
				Z    += addZ;
			}
		}
		else
		{
			// Loop by Y
			let diff = Math.floor(dx - dy / 2);
			let addZ = (v2.z - v1.z) / dy;
			let Z    = v1.z;
			
			while(y1 != y2)
			{
				// Y range check
				if((y1 >= 0) && (y1 < this.sc_h))
				{
					// Write value
					if(this.aMinX[y1] > x1)
					{
						this.aMinX[y1] = x1;
						this.aMinZ[y1] = Z;
					}
					if(this.aMaxX[y1] < x1)
					{
						this.aMaxX[y1] = x1;
						this.aMaxZ[y1] = Z;
					}
				}

				// Update Coordinates
				y1 += addY;
				if(diff >= 0)
				{
					x1   += addX;
					diff -= dy;
				}
				diff += dx;			
				Z    += addZ;
			}
		}

		// Check end point
		if((y2 >= 0) && (y2 < this.sc_h))
		{
			if(this.aMinX[y2] > x2)
			{
				this.aMinX[y2] = x2;
				this.aMinZ[y2] = v2.z;
			}
			if(this.aMaxX[y2] < x2)
			{
				this.aMaxX[y2] = x2;
				this.aMaxZ[y2] = v2.z;
			}
		}
	}
	
	// Draw polygon with flat shading
	drawPolygonWithFlatShading(vertex_list,index_list,primitive_count)
	{
		// Draw primitives in order
		let point_index = 0;
		while(primitive_count > 0)
		{
			// Draw triangle polygon with flat shading
			
			let i1 = index_list[point_index    ];
			let i2 = index_list[point_index + 1];
			let i3 = index_list[point_index + 2];

			// Omit items with Z coordinate behind viewpoint (camera position)
			//
			// * Coordinates passed through View (Camera) transformation matrix are viewpoint (camera position)
			//  Because the coordinates are transformed as (x,y,z)=(0.0,0.0,0.0), Z is negative
			//  Being a value means it is located behind the camera
			//  This will be the case.
			//
			if(((vertex_list[i1].vv.z > 0.0) ||
			    (vertex_list[i2].vv.z > 0.0) ||
			    (vertex_list[i3].vv.z > 0.0)) &&
			   ((vertex_list[i1].vv.z < MAX_Z_POS) ||
			    (vertex_list[i2].vv.z < MAX_Z_POS) ||
			    (vertex_list[i3].vv.z < MAX_Z_POS))
			  )
			{
				// Skip if not in screen range in the first place
				const x1 = Math.abs(vertex_list[i1].vv.x);
				const x2 = Math.abs(vertex_list[i2].vv.x);
				const x3 = Math.abs(vertex_list[i3].vv.x);
				const y1 = Math.abs(vertex_list[i1].vv.y);
				const y2 = Math.abs(vertex_list[i2].vv.y);
				const y3 = Math.abs(vertex_list[i3].vv.y);

				if(((x1 >= this.sc_w) && (x2 >= this.sc_w) && (x3 >= this.sc_w)) ||
				   ((y1 >= this.sc_h) && (y2 >= this.sc_h) && (y3 >= this.sc_h)) )
				{
					// To next polygon vertex index
					point_index += DEF_VERTEX_NUM_FOR_PRIMITIVE;

					// Reduce Primitives
					primitive_count--;
					
					continue;
				}

				// Initialize min/max X coordinate/Z value of each line
				for(let i = 0;i < this.sc_h;++i)
				{
					this.aMinX[i] = this.sc_w;
					this.aMaxX[i] = -1;
					this.aMinZ[i] = INVALID_Z_VALUE;
					this.aMaxZ[i] = INVALID_Z_VALUE;
				}
				
				// Check polygon edges		
				this.scanlineForFlat(vertex_list[i1].vv,
								     vertex_list[i2].vv);
				this.scanlineForFlat(vertex_list[i2].vv,
								     vertex_list[i3].vv);
				this.scanlineForFlat(vertex_list[i3].vv,
								     vertex_list[i1].vv);

				// Calculate polygon normal and determine face color
				//
				// * In this flat shading, coordinates are ViewPort transformed at this point
				//  is sent with ... completed.
				//  As a result, Y coordinates are flipped upside down, so calculating normal normally
				//  Then, the normal of the polygon face will be flipped inside out.
				//  So, change the vertex drawing order slightly so that the normal is correct
				//  You can obtain it, so please think about it.
				//
				let vNormal = this.getNormalVectorFromPolygon(vertex_list[i1].vv,
															  vertex_list[i3].vv,	// <- Here
															  vertex_list[i2].vv);
				
				// Take dot product of line of sight/light source and polygon normal
				let vLight   = new VectorMan3( this.vLight.x,
											  -this.vLight.y,	//Invert Y coordinate of light ray vector too
											   this.vLight.z);	
				let lightDot = vNormal.dotProduct(vLight);		// With light source vector
																// Dot product result with normal vector
				const eyeDot = vNormal.dotProduct(this.vEye);	// With line of sight vector
																// Dot product result with normal vector
				
				//
				// If the dot product result is a negative value, the line of sight vector and the polygon's normal vector
				// Represents that they are roughly facing each other, and if the result is a positive value, the view vector
				// and the normal vector are facing roughly the same direction, meaning it is invisible
				// So, draw only if it's a negative value facing each other.
				// * When performing perspective correction, this judgment may not be correct...
				//
				if(eyeDot <= 0.0)
				{
					//
					// Calculate surface color
					// * lightDot is the ratio of light hitting the polygon surface relative to the light ray,
					//   Adjust the diffuse light value.
					//   However, the dot product result of the polygon's normal vector and the light ray vector is negative
					//   value, so multiply by minus to invert it to positive.
					//
					//   If the dot product result becomes a positive number, it means light does not hit
					//   So correct it to 0.
					//
					if(lightDot > 0.0){ lightDot = 0.0; }
					let r = Math.floor((this.vAmbientColor.x + -lightDot * this.vDiffuseColor.x) * 255);
					let g = Math.floor((this.vAmbientColor.y + -lightDot * this.vDiffuseColor.y) * 255);
					let b = Math.floor((this.vAmbientColor.z + -lightDot * this.vDiffuseColor.z) * 255);

					// Saturate to range 0-255
					if(r < 0){ r = 0; }
					else if(r > 255){ r = 255; }
					if(g < 0){ g = 0; }
					else if(g > 255){ g = 255; }
					if(b < 0){ b = 0; }
					else if(b > 255){ b = 255; }

					// Set color
					const color = { r: r, g: g, b: b };

					// Check polygon center Z value
					//
					// On the polygon boundary, inward polygon and outward
					// If vertices are shared in polygons of, Z values become the same
					// and the color drawn first takes precedence.
					// If inward polygons are prioritized here, visually
					// because it becomes strange, the color of the outward polygon
					// Get the center Z value of the polygon to prioritize.
					//
					let polyMinZ = vertex_list[i1].vv.z;
					let polyMaxZ = vertex_list[i1].vv.z;
					if(polyMinZ < vertex_list[i2].vv.z){ polyMinZ = vertex_list[i2].vv.z; }
					if(polyMinZ < vertex_list[i3].vv.z){ polyMinZ = vertex_list[i3].vv.z; }
					if(polyMaxZ > vertex_list[i2].vv.z){ polyMaxZ = vertex_list[i2].vv.z; }
					if(polyMaxZ > vertex_list[i3].vv.z){ polyMaxZ = vertex_list[i3].vv.z; }
					const centerZ = (polyMaxZ - polyMinZ) / 2 + polyMinZ;
					
		//const centerZ = vertex_list[i2].vv.z;
					
					// Draw polygon one line at a time while looking at Z buffer of each Y coordinate
					// Draw by filling
					// (Scanline conversion)
					for(let y = 0;y < this.sc_h;++y)
					{
						// Skip if buffer is not updated
						if(this.aMinX[y] == this.sc_w)
						{	continue;	}

						// Calculate address of drawing destination Y coordinate
						const pos = this.sc_w * y;

						// Calculate increment value of Z value to interpolate
						const dx   = (this.aMaxX[y] - this.aMinX[y] + 1);
						const addZ = (dx == 1) ? 0 : ((this.aMaxZ[y] - this.aMinZ[y]) / (dx-1));
						
						let Z = this.aMinZ[y];
						for(let x = this.aMinX[y];
							x <= this.aMaxX[y];++x,Z+=addZ)
						{						
							// Clipping by X coordinate
							if((x < 0) || (x >= this.sc_w))
							{	continue;	}

							// Draw if it is in front of Z coordinate of pixel already drawn
							//
							// If Z values are about the same, prioritize the one with polygon center Z value closer
							// * Dot product value is saved, but probably won't be used for comparison anymore
							//
							
							if((((Z - this.aZBuffer[pos + x]) < 1) && (this.aCZBuffer[pos + x] > centerZ)) ||
							   (this.aZBuffer[pos + x] > Z))
						
						//	if(this.aZBuffer[pos + x] >= Z)
							{
								let c = { r: color.r, g: color.g, b: color.b, a: 255 };
								
								// Draw in black if edge (this was insufficient so stopped for now)
								//if((x == this.aMinX[y]) || (x == this.aMaxX[y]))
								//{	c = { r: 0, g: 0, b: 0, a: 255 };	}
								
								this.drawPoint_bresenham(this.sc_w,this.sc_h,x,y,c);
								this.aZBuffer [pos + x] = Z;			// Update Z value of pixel
								this.aDpBuffer[pos + x] = -lightDot;	// Update dot product value of pixel
								this.aCZBuffer[pos + x] = centerZ;		// Update polygon center Z value of pixel
							}
						}
					}
				}
			}
			
			// To next polygon vertex index
			point_index += DEF_VERTEX_NUM_FOR_PRIMITIVE;

			// Reduce Primitives
			primitive_count--;
		}
	}

}


// Global Object
let g_game_width    = 320;
let g_game_height   = 500;

let g_offsc;							// Off-screen for manual drawing
let g_draw_algo;						// Index of currently selected drawing algorithm
let g_renderingman;						// Rendering Manager

const TORUS_NUM            = 10;		// Number of stacked sector tori
const TORUS_CUT_RADIUS_MAX = 4.0;		// Max radius of cut surface
const TORUS_CUT_RADIUS_MIN = 0.2;		// Min radius of cut surface
const TORUS_CUT_VERTEX_NUM = 12;		// Number of vertices of cut surface
const TORUS_IN_VERTEX_NUM  = 8;			// Number of vertices for sector angle
const TORUS_IN_RADIUS      = 14;		// Radius of sector center
const TORUS_IN_ANGLE       = 60;		// Sector angle [deg]
const TORUS_SCALE          = 1.2;		// Torus scale factor

let g_objs                 = [];		// Object management
let g_rX                   = 0;			// X-axis rotation angle for entire object
let g_rY                   = 0;			// Y-axis rotation angle for entire object
let g_rZ                   = 0;			// Z-axis rotation angle for entire object

let g_mtx_scale;						// Scaling matrix for entire object

let g_last_fps_time = 0;
let g_fps_count     = 0;
let g_fps           = 60;

function init_game()
{
	
	// Game initialization processing
	
	// Screen Adjustment
	adjust_screen();
	
	// Generation of objects necessary for game
	create_obj();
	
	// Prepare drawing processing method
	g_draw_algo = 1;
	change_draw_algorithm();
	window.onmousedown = change_draw_algorithm;
	window.ontouchdown = change_draw_algorithm;
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render_game);
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (g_fps_count*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;
		g_fps = (g_fps + fps) / 2;			// Mitigate FPS changes referenced during speed adjustment by averaging
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function adjust_screen()
{
	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 1280;
		g_game_height = 720;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width) / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

	// Create ImageData for off-screen
	let ctx = screen.getContext("2d");
	g_offsc = ctx.createImageData(g_game_width,g_game_height);
	
}

function create_obj()
{
	// Object Generation
	
	// Prepare rendering handler
	const screen     = document.getElementById("game-screen");	// Drawing destination canvas
	const algo_label = document.getElementById("algo");
	g_renderingman = new RenderingMan(screen,g_offsc,algo_label);
	
	// Set ViewPort matrix and Projection matrix
	let mtx_viewport   = new MatrixMan4();
	let mtx_projection = new MatrixMan4();
	
	mtx_viewport.viewPort(0,0,g_game_width,g_game_height);
	mtx_projection.projection(10,MAX_Z_POS,rad(60),g_game_height/g_game_width);
	g_renderingman.setViewPortMatrix(mtx_viewport);
	g_renderingman.setProjectionMatrix(mtx_projection);
	
	// Set View Matrix
	let vFrom    = new VectorMan3(0.0,0.0,-60.0);
	let vTo      = new VectorMan3(0.0,0.0,0.0);
	let vUp      = new VectorMan3(0.0,1.0,0.0);
	let mtx_view = new MatrixMan4();
		
	mtx_view.view(vFrom,vTo,vUp);
	g_renderingman.setViewMatrix(mtx_view);

	// Set diffuse light color
	g_renderingman.setDefuseLightColor(0.8,0.8,0.8);
	
		
	// Preparation of object
	const dec_r = (TORUS_CUT_RADIUS_MAX - TORUS_CUT_RADIUS_MIN) / TORUS_NUM;
	let cut_r   = TORUS_CUT_RADIUS_MAX;
	for(let i = 0;i < TORUS_NUM;++i)
	{
		let torus = new FanTorusObjMan(TORUS_CUT_VERTEX_NUM,
									   cut_r,TORUS_IN_VERTEX_NUM,
									   TORUS_IN_RADIUS,TORUS_IN_ANGLE);
		let obj = { obj: torus, speed: i * 0.8 };
		g_objs.push(obj);
		
		cut_r -= dec_r;
	}
	
	// Generate matrix to enlarge object size
	g_mtx_scale = new MatrixMan4();
	g_mtx_scale.scale(TORUS_SCALE,TORUS_SCALE,TORUS_SCALE);

}

function change_draw_algorithm()
{
	// Selection of drawing algorithm
	
	g_draw_algo = (g_draw_algo + 1) % 2;	// Try changing % 2
	
	switch(g_draw_algo)
	{
		case 0:	// Flat Shading Drawing
			g_renderingman.setupFlatShading();
			break;
			
		case 1:	// Context LINE drawing
			g_renderingman.setupContextLine();
			break;
			
		case 2:	// Bresenham LINE Drawing
			g_renderingman.setupBresenhamLine();
			break;
			
		case 3:	// Double Step Bresenham LINE Drawing
			g_renderingman.setupDoubleStepBresenhamLine();
			break;
		
		case 4:	// Anti-aliased Bresenham LINE Drawing
			g_renderingman.setupBresenhamLineAA();
			break;
	}

}

function draw_obj()
{
	// Object drawing processing
	
	// Pre-drawing processing
	g_renderingman.drawBegin();
	
	// Fast forward depending on current FPS
	let FF = Math.round(60 / (Math.ceil(g_fps / 10) * 10));
	if(FF < 1) 		 { FF =  1; }
	else if(FF > 60) { FF = 60; }
	
	// Create rotation matrix for entire object
	let mtx_rotateX = new MatrixMan4();
	let mtx_rotateZ = new MatrixMan4();
	
	mtx_rotateX.rotateX(rad(g_rX));
	mtx_rotateZ.rotateZ(rad(g_rZ));

	// Move object
	for(let i = 0;i < TORUS_NUM;++i)
	{
		let mtx_world   = new MatrixMan4();
		let mtx_rotateY = new MatrixMan4();
		let torus       = g_objs[i];
		
		// Create Y-axis rotation matrix for each object
		mtx_rotateY.rotateY(rad(g_rY) * torus.speed);
		
		// Scale
		mtx_world.mul(g_mtx_scale);
		
		// Rotation
		mtx_world.mul(mtx_rotateY);
		mtx_world.mul(mtx_rotateX);
		mtx_world.mul(mtx_rotateZ);
		
		// Set to renderer
		g_renderingman.setWorldMatrix(mtx_world);
		
		// Object Drawing
		g_renderingman.drawIndexedPrimitive(torus.obj.vertexList,torus.obj.vertexNum,
											torus.obj.polyIndexList,torus.obj.primitiveNum);
	}

	// Post-drawing processing (Transfer to screen)
	g_renderingman.drawEnd();

	// Advance rotation
	for(let f = 0;f < FF;++f)
	{
		g_rX += 0.7;
		g_rY += 0.7;
		g_rZ += 0.7;
	}
}

function render_game()
{
	
	// Game drawing processing
	
	// Draw object
	draw_obj();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render_game);

}

</script>
</head>
<body onload="init_game()">
	<div id="fps"></div>
	<div id="algo"></div>
	<canvas id="game-screen"></canvas>
</body>
</html>
