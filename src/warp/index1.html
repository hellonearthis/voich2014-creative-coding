<!DOCTYPE html>
<html>
<head>
<title>Papa's Infinite Warp</title>
<meta charset="utf-8">
<meta name="viewport" content="width=320, user-scalable=no, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">

<link rel="stylesheet" href="./../vlib/vl_common_v1.0.0.css">
<script type="text/javascript" src="./../vlib/vl_common_v1.6.0.js"></script>
<script type="text/javascript" src="./../vlib/vl_3d_v1.2.0.js"></script>
<style type="text/css">
</style>
<script type="text/javascript">

// Global Object
let g_game_width    = 320;
let g_game_height   = 500;

let g_time          = 0;		// Current time [ms]
let g_dtime         = 0;		// Elapsed time since last drawing [ms]

const TAU           = 2.0 * Math.PI;
let g_pn            = new Perlin();
let g_screen_ctx    = null;
let g_bloom_offscs  = [];		// Off-screen canvas for Bloom processing

const MORPH_TIME    = 8000;
const WARP_START    = 6000;
const OBJ_NUM       = 50;
const STAR_STRIDE   = 500;
const ZOOM_TIME     = 12000;
const FADE_TIME     = 200;

let g_start_time    = 0;
let g_next_time     = 0;
let g_warp_start    = 0;

let g_obj           = [];
let g_nx            = 0;
let g_ny            = 0;
let g_nz            = 0;

let g_def1_colors   = [];
let g_def2_colors   = [];
let g_start_colors  = [];
let g_next1_colors  = [];
let g_next2_colors  = [];
let g_colors        = [];

let g_last_fps_time = 0;
let g_fps_count     = 0;
let g_fps           = 60;
let g_fps_list      = [];
let g_fps_visible   = true;

let g_cnt           = 0;

function init()
{
	
	// Initialization processing
	
	// Preparation
	setup();
	
	// Toggle FPS display ON/OFF with click or tap
	toggle_fps_visible();
	window.onmousedown = toggle_fps_visible;
	window.ontouchdown = toggle_fps_visible;
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render);
	
}

function adjust_screen()
{

	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 600;
		g_game_height = 600;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width)  / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

}

function setup_obj()
{

	// Preparation of object
	
	// Get Context of main screen in advance
	const sc_w   = g_game_width;
	const sc_h   = g_game_height;
	const screen = document.getElementById("game-screen");
	g_screen_ctx = screen.getContext("2d");
	
	// Generate default palette from coolors.co URL
	const url1    = "https://coolors.co/3c1518-69140e-a44200-d58936-fff94f";
	const url2    = "https://coolors.co/e4572e-17bebb-ffc914-2e282a-76b041";
	g_def1_colors = createPaletteNHSL(url1);
	g_def2_colors = createPaletteNHSL(url2);

}

function setup_bloom()
{
	// Preparation for Bloom Processing
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	let scale = 0.5;
	for(let i = 0;i < 2;++i)
	{
		const cv   = document.createElement("canvas");
		const ctx  = cv.getContext("2d");
		const cv_w = sc_w * scale;
		const cv_h = sc_h * scale;
		
		cv.width  = sc_w * scale;
		cv.height = sc_h * scale;
		cv.style.display = "none";
		
		let info =
		{
			cv: cv, cv_w: cv_w, cv_h: cv_h,
			ctx: ctx
		};
		g_bloom_offscs.push(info);
		
		scale /= 2.0;
	}
}

function do_bloom(ctx,draw_screen)
{
	// Execute Bloom Processing
	
	// Apply filter to image after rendering
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	
	//
	// Doing simple bloom processing.
	//
	// Because it's not extracting only high luminance parts, but whole thing looks glowing,
	// I think it's a bit different from original bloom processing, but anyway
	// Might be easy if you want to make it glow easily (*´ω｀*)
	//
	
	// To off-screen canvas with resolution lowered by half vertically and horizontally in multiple stages
	// Apply Canvas Blur filter, enlarge and additive blend
	const offsc_num = g_bloom_offscs.length;
	let blur_w = [ 5,10 ];
	for(let idx = 0;idx < offsc_num;++idx)
	{
		// Get current state from canvas displayed on screen
		let offsc = g_bloom_offscs[idx];
		offsc.ctx.clearRect(0,0,offsc.cv_w,offsc.cv_h);
		offsc.ctx.drawImage(draw_screen,0,0,sc_w,sc_h,0,0,offsc.cv_w,offsc.cv_h);

		// Reflect on screen (additive blending) while applying filter to reduced image
		ctx.save();
		ctx.globalAlpha = 1.0;
		ctx.globalCompositeOperation = 'lighter';
		ctx.filter="blur("+blur_w[idx]+"px)";
		ctx.drawImage(offsc.cv,0,0,offsc.cv_w,offsc.cv_h,0,0,sc_w,sc_h);
		ctx.restore();
		
		// If draw_screen is the same as the display canvas
		// ^ Get the composited result and enlarge it, so blur
		// I think ... is applied tightly.
	}
}

function setup()
{
	
	// Preparation
		
	// Screen Adjustment
	adjust_screen();
	
	// Preparation of object
	setup_obj();
	
	// Preparation for Bloom Processing
	setup_bloom();

	// Determine initial value
	g_next1_colors = g_def1_colors.slice();
	g_next2_colors = g_def2_colors.slice();
	g_colors       = g_def1_colors.slice();
	reset();
	
}

function reset()
{

	// Determine next target value
	
	// Determine palette
	g_start_colors = g_next1_colors.slice();	// Pass-by-value copy of array
	g_next1_colors = g_next2_colors.slice();	// Pass-by-value copy of array
	g_next2_colors = g_def1_colors.slice();		// Set as initial value of next palette
	getColormind(function(palette)
	{
		// Get 5-color palette from Colormind
		g_next2_colors = rgbAA2hslNA(palette);		
	});
	
}

function init_obj()
{
	
	// Initialize Star Object
	
	// Clear
	g_obj = [];
	
	// Preparation of start time
	let start_time = g_time - STAR_STRIDE * OBJ_NUM;
	
	g_nx = start_time;
	g_ny = start_time;
	g_nz = start_time;
	
	// Fill all object information
	for(let i = 0;i < OBJ_NUM;++i)
	{
		g_obj.push(create_obj(start_time));
		start_time += STAR_STRIDE;
	}
	
}

function create_obj(start_time)
{
	
	// Generate Star Object Info
	
	const idx = Math.floor(start_time / STAR_STRIDE);
	const col = g_colors[idx % g_colors.length];
	const h   = col.h * 360;
	const s   = Math.floor(col.s * 100)+"%";
	const l   = (col.l < 0.6) ? "60%" : Math.floor(col.l * 100)+"%";
	const hsl = `hsl(${h},${s},${l})`;
	const num = 5 + rnd(5);
	
	g_nx += rnd(10) / 500;
	g_ny += rnd(5)  / 10000;
	g_nz += rnd(5)  / 10000;
	
	const apos = [];
	for(let i = 0;i < num;++i)
	{
		const pos = 
		{
  			a:      rnd(TAU * 1000) / 1000,
			offset: (rnd(300) - 150) / 800
		};
		apos.push(pos);
	}
	
	const info =
	{
		start_time: start_time,
		end_time  : start_time + ZOOM_TIME + rnd(100),
		nx        : g_nx,
		ny        : g_ny,
		nz        : g_nz,
		a_pos     : apos,
		color     : hsl,
	}
	
	return info;
	
}

function update_obj()
{

	// Update Star Object Info
	
	let need_sort = false;
	for(let i = 0;i < g_obj.length;++i)
	{
		// Reset if enough time has passed
		const info = g_obj[i];
		if(info.end_time <= g_time)
		{
			g_obj[i]  = create_obj(info.end_time);
			need_sort = true;
		}
	}
	
	// Sort to draw from oldest time
	if(need_sort)
	{
		g_obj.sort(function(a,b){
			if(a.start_time < b.start_time) return -1;
			if(a.start_time > b.start_time) return  1;
			return 0;
		});
	}
	
}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// Add to FPS history
		g_fps_list.push(g_fps_count);
		if(g_fps_list.length > 10)
		{	
			// Delete first and keep up to past n times
			// Use average of FPS (moving average)
			g_fps_list.shift();
		}
		let fps_ave = 0;
		for(let i = 0;i < g_fps_list.length;++i)
		{	fps_ave += g_fps_list[i];	}
		fps_ave /= g_fps_list.length;
		
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (fps_ave*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;
		g_fps = fps_ave;
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function toggle_fps_visible()
{
	// Toggle FPS display ON/OFF
	
	// Invert display flag
	g_fps_visible = !g_fps_visible;
	
	// Control visible based on display flag
	let fps_div = document.getElementById("fps");
	fps_div.style.display = g_fps_visible ? "block" : "none";

}

function draw()
{

	// Drawing Core
	
	// Save start time
	if(g_start_time == 0)
	{
		g_start_time = g_time;
		g_next_time  = g_time + MORPH_TIME;
		g_warp_start = g_time + WARP_START;
		
		// Object Initialization
		init_obj();
	}
	
	// Preparation of colors
	let time = (g_time - g_start_time) / MORPH_TIME;
	if(time > 1.0){ time = 1.0; }
	const ce = Ease.easeInSine(time);
	
	g_colors = [];
	for(let i = 0;i < g_start_colors.length;++i)
	{
		const col = 
		{
			h: SL.mix(g_start_colors[i].h,
					  g_next1_colors[i].h,ce),
			s: SL.mix(g_start_colors[i].s,
					  g_next1_colors[i].s,ce),
			l: SL.mix(g_start_colors[i].l,
					  g_next1_colors[i].l,ce)
		};
		g_colors.push(col);
	}

	// Screen Clear
	const sc_w = g_game_width;
	const sc_h = g_game_height;
	const ctx  = g_screen_ctx;
	ctx.clearRect(0,0,sc_w,sc_h);
	
	ctx.save();
	
	// Create shake at end of warp
	const time_ms = g_time - g_start_time;
	let ox = 0;
	let oy = 0;
	if(time_ms < (FADE_TIME + 200))
	{
		const ratio = 1.0  - (time_ms / (FADE_TIME + 200));
		ox = (rnd(50) - 25) * ratio;
		oy = (rnd(50) - 25) * ratio;
	}
		
	ctx.translate(sc_w / 2 + ox,sc_h / 2 + oy);
	
	// Draw Star Object
	const speed_ratio = (g_time - g_warp_start) / (MORPH_TIME - WARP_START);
	for(let i = 0;i < g_obj.length;++i)
	{
		const info = g_obj[i];
		
		const sp  = (g_time < g_warp_start) ? 2000 : (2000 - 1800 * speed_ratio);
		const tw  = (g_warp_start - info.start_time) / sp;
		const t   = (g_time - info.start_time) / sp;
		const tt  = t * 10;
		const len = 300;
		
		if(t < 0)
		{	continue;	}
		
		const a_len = info.a_pos.length;
		for(let pos = 0;pos < a_len;++pos)
		{
			const base = 1.0 + info.a_pos[pos].offset;
			const r0    = (len * tw) * base;
			const r1    = (len * t ) * base;
			const n    = (1 + Math.abs(g_pn.perlin(info.nx,0,tt) * 0.9)) * t * 1.8;
			const a    = info.a_pos[pos].a;
			const x0   = r0 * Math.cos(a);
			const y0   = r0 * Math.sin(a);
			const x1   = r1 * Math.cos(a);
			const y1   = r1 * Math.sin(a);
			
			ctx.beginPath();
			
			if(g_time >= g_warp_start)
			{
				// Draw extending line
				ctx.strokeStyle = info.color;
				ctx.lineWidth   = n * 2;
				ctx.lineCap     = 'round';
				ctx.moveTo(x0,y0);
				ctx.lineTo(x1,y1);
				ctx.stroke();
			}
			else
			{
				// Draw Point
				ctx.fillStyle = info.color;
				ctx.arc(x1,y1,n,0,TAU,false);
				ctx.fill();
			}
		}
	}
	
	ctx.restore();
	
	// Bloom Processing
	let screen = document.getElementById("game-screen");
	do_bloom(ctx,screen);

	ctx.save();
	
	// Fade In/Out
	if(time_ms < FADE_TIME)
	{
		ctx.globalAlpha = 1.0 - (time_ms / FADE_TIME);
		ctx.fillStyle = "#FFFFFF";
		ctx.fillRect(0,0,sc_w,sc_h);
	}
	else if(time_ms >= (MORPH_TIME - FADE_TIME))
	{
		ctx.globalAlpha = (time_ms - (MORPH_TIME - FADE_TIME)) / FADE_TIME;
		ctx.fillStyle = "#FFFFFF";
		ctx.fillRect(0,0,sc_w,sc_h);
	}

	ctx.restore();
	
	// Update Star Object Info
	update_obj();
	
	// Color change time check
	if(g_time >= g_next_time)
	{
		// Determine next break time and reset
		g_start_time = g_time;
		g_next_time  = g_start_time + MORPH_TIME;
		g_warp_start = g_time + WARP_START;
		reset();
	}
	
}

function render()
{
	
	// Drawing processing for every turn
	
	// Time Calculation
	const last_time = g_time;
	g_time = (new Date).getTime();
	if(last_time == 0)
	{	g_dtime = 0;	}
	else
	{	g_dtime = g_time - last_time;	}
	
	// Drawing Core
	draw();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render);

}

</script>
</head>
<body onload="init()">
	<div id="fps"></div>
	<canvas id="game-screen"></canvas>
</body>
</html>
