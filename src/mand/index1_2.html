<!--
	This demo draws Mandelbrot Sets on JavaScript Canvas.
	
	Mandelbrot Set (Wikipedia)
	https://ja.wikipedia.org/wiki/%E3%83%9E%E3%83%B3%E3%83%87%E3%83%AB%E3%83%96%E3%83%AD%E9%9B%86%E5%90%88
	
	According to Wikipedia, the Mandelbrot set is defined by the following recurrence formula
	It is written that it is defined...
	
	Zn+1 = Zn^2 + C
	Z0   = 0
	
	I don't understand it well, so I implemented it referencing the explanation on the site below.
	Thank you!
	https://wgld.org/d/glsl/g005.html
	http://turanegaku.hateblo.jp/entry/2016/02/06/020958
	https://azisava.sakura.ne.jp/mandelbrot/algorithm.html
	https://www.programmingmat.jp/soft_dev/mandjs.html
	https://woodhero2357.hatenablog.com/entry/2018/06/06/235830
	
	The Mandelbrot set is defined as the set of points that do not diverge when a certain calculation is repeated
	It seems to mean a set of points.
	
	Divergence here means a state where the value becomes infinitely large.
	Conversely, values that do not diverge do not move, or go back and forth between + and - sides
	values that do that, and this is called oscillation.
	
	In other words, the Mandelbrot set did not diverge even after repeating calculation a certain number of times
	It means it represents the part.
	
	The color of the Mandelbrot set is determined by judging if it diverges within a certain number of calculations
	It seems to be decided by the number of times until it happens.
	If it does not diverge, the calculation count becomes the Max value.
	
	Whether it is diverging or not, referencing the explanation site above,
	It seems the condition is √(a*a+b*b) > 2, where complex number z = a+bi,
	Omitting square root calculation, judge by (a*a+b*b) > 4.
	(Values larger than 4 are considered to diverge)
	
	Mandelbrot set is difficult, isn't it (*´ω｀*)
	
	
	(C)2020 Voich(@voich2014)

<!-- Self-made Libraries -->
<script type="text/javascript">

// Global Object
let g_game_width    = 320;
let g_game_height   = 320;

let g_pn     = new Perlin();			// For generating Perlin Noise
let g_time   = 0;						// Current time [ms]
let g_dtime  = 0;						// Elapsed time since last drawing [ms]

const MANDEL_WIDTH  = 400;				// Initial width of Mandelbrot set plane
const MANDEL_HEIGHT = 400;				// Initial height of Mandelbrot set plane

const MANDEL_R_MIN       = -2.0;
const MANDEL_R_MAX       =  0.5;
const MANDEL_I_MIN       = -1.25;
const MANDEL_I_MAX       =  1.25;
const MANDEL_R_DISTANCE  = MANDEL_R_MAX - MANDEL_R_MIN;
const MANDEL_I_DISTANCE  = MANDEL_I_MAX - MANDEL_I_MIN;

// Range of r (real axis) of Mandelbrot set is -2.00 to 0.50
//                  Range of i (imaginary axis) is -1.25 to 1.25
//

const MORPH_TIME    = 3000;
let g_screen_ctx    = null;
let g_start_time    = 0;
let g_next_time     = 0;
let g_ease          = null;
let g_pos_r         = 0;
let g_pos_i         = 0;
let g_pos_dr        = 0;
let g_pos_di        = 0;
let g_target_r      = 0;
let g_target_i      = 0;
let g_target_end    = 0;
let g_base_hue      = 0;
let g_last_draw     = 0;

let g_last_fps_time = 0;
let g_fps_count     = 0;
let g_fps           = 60;
let g_fps_list      = [];

let g_cnt = 0;

function init()
{
	
	// Initialization processing
	
	// Preparation
	setup();
	
	// Preparation of requestAnimationFrame (compatible with various browsers)
	let requestAnimationFrame = window.requestAnimationFrame       ||
                                window.mozRequestAnimationFrame    ||
                                window.webkitRequestAnimationFrame ||
                                window.msRequestAnimationFrame;
    window.requestAnimationFrame = requestAnimationFrame;
    
	// Register drawing
	window.requestAnimationFrame(render);
	
}

function adjust_screen()
{

	// Screen Adjustment
	
	// Get window size
	let window_w = window.innerWidth;
	let window_h = window.innerHeight;
	
	// Assuming it's a PC if window width is wide enough
	// Change screen size
	if((g_game_width * 2) <= window_w)
	{
		g_game_width  = 480;
		g_game_height = 480;
	}
	
	// Place game screen in center
	let screen  = document.getElementById("game-screen");
	let game_x  = (window_w - g_game_width)  / 2;
	let game_y  = (window_h - g_game_height) / 2;

	screen.style.left = game_x+"px";
	screen.style.top  = game_y+"px";
	screen.width      = g_game_width;
	screen.height     = g_game_height;

	// Create ImageData for off-screen
	let ctx = screen.getContext("2d");
	g_offsc = ctx.createImageData(g_game_width,g_game_height);
	
	// Fill so alpha value becomes 255 at first
	g_offsc.data.fill(255);
	
}

function setup_obj()
{

	// Preparation of object
	
	// Get Context of main screen in advance
	const screen = document.getElementById("game-screen");
	g_screen_ctx = screen.getContext("2d");
	
}

function setup()
{
	
	// Preparation
		
	// Screen Adjustment
	adjust_screen();
	
	// Preparation of object
	setup_obj();

}

function draw_fps()
{
	
	// FPS Measurement
	
	// Get current time
	let now_time = Date.now();
	
	if((now_time - g_last_fps_time) >= 1000)
	{
		// Add to FPS history
		g_fps_list.push(g_fps_count);
		if(g_fps_list.length > 10)
		{	
			// Delete first and keep up to past n times
			// Use average of FPS (moving average)
			g_fps_list.shift();
		}
		let fps_ave = 0;
		for(let i = 0;i < g_fps_list.length;++i)
		{	fps_ave += g_fps_list[i];	}
		fps_ave /= g_fps_list.length;
		
		// FPS Display
		let fps_div = document.getElementById("fps");
		let fps     = (fps_ave*(1000/(now_time - g_last_fps_time)));
		fps_div.innerText = "FPS:"+fps;
		g_fps = fps_ave;
		
		g_last_fps_time = now_time;
		g_fps_count     = 0;
	}
	g_fps_count++;

}

function draw()
{

	// Drawing Core
	
	// Save start time
	if(g_start_time  == 0)
	{
		g_start_time = g_time;
		g_base_hue   = rnd(360);
	}
	
	if((g_time - g_last_draw) >= 100)
	{
		// Calculate elapsed time
		const t  = (g_time - g_start_time);
		const tz = g_cnt / 100;
		const tp = 2 + g_cnt / 10;
		
		// Determine and color all pixels of screen canvas
		const sc_w     = g_game_width;
		const sc_h     = g_game_height;
		let   zoom     = 1.0/*0.25*/ + Math.pow(tz,tp);	// Scale factor
		let   data     = g_offsc.data;
		let   pos_list = [];
		
		// From current scale factor, screen top-left coordinates and
		// Calculate movement amount per pixel
		const zr       = 1.0 / zoom;
		const md_w     = MANDEL_R_DISTANCE;
		const md_h     = MANDEL_I_DISTANCE;
		const md_w2    = md_w / 2;
		const md_h2    = md_h / 2;
		const md_left  = (MANDEL_R_MIN + md_w2) - md_w2 * zr;
		const md_top   = (MANDEL_I_MIN + md_h2) - md_h2 * zr;
		const md_wzr   = md_w * zr;
		const md_hzr   = md_h * zr
		const step_w   = md_wzr / sc_w;
		const step_h   = md_hzr / sc_h;
		const offset_r = g_pos_r;
		const offset_i = g_pos_i;
		
		for(let i = 0;i < sc_h;++i)		// Imaginary axis of complex plane
		{
			let i_pos = sc_w * i;
			for(let r = 0;r < sc_w;++r)	// Real axis of complex plane
			{
				// Normalize by screen resolution and use
				const tr = md_left + (r * step_w);
				const ti = md_top  + (i * step_h);
				cr = offset_r + tr;
				ci = offset_i + ti;
				
				// Check number of times until divergence
				const CALC_MAX = 300;
				let x = 0;
				let y = 0;
				let n = 0;
				for(;n < CALC_MAX;++n)
				{
					const xx = (x * x) - (y * y) + cr;
					const yy = 2.0 * x * y + ci;
					x = xx;
					y = yy;
					
					// Can be determined to diverge?
					if(((x * x) + (y * y)) > 4)
					{	break;	}
				}
			
				// Black if did not diverge
				let col = { r:0.0,g:0.0,b:0.0 };
				if(n < CALC_MAX)
				{
					// Make darker as divergence gets closer to MAX count
					// Make it slightly brighter according to the size of g_cnt
					const MAX_L = 1.0;
					const nr    = n / CALC_MAX;
					col = hsl2rgb(g_base_hue + nr * 360 + tr * 120 + ti * 180,1.0,
								  (nr > 0.8) ? (nr * 0.25) : (MAX_L - nr * MAX_L + (g_cnt / 4000)));
					
					if(0.5 < nr)
					{
						let a;
						a = 0;
					}
					
					// Remember where it barely diverges
					//if((0.75 < nr) && (nr < 0.90))
					if((0.80 < nr) && (nr < 0.99))
					{
						pos_list.push({ r:r,i:i });
					}
				}
				
				const pos = (i_pos + r) << 2;
				data[pos + 0] = col.r * 255;
				data[pos + 1] = col.g * 255;
				data[pos + 2] = col.b * 255;
			}
		}
		
		// Determine target position
		const MOVE_TIMES = 100;
		if((g_pos_r == 0) && (g_pos_i == 0))
		{
			const pos  = rnd(pos_list.length);
			g_target_r = (pos_list[pos].r * step_w) - md_w2 * zr;
			g_target_i = (pos_list[pos].i * step_h) - md_h2 * zr;
			g_pos_dr   = g_target_r / MOVE_TIMES;
			g_pos_di   = g_target_i / MOVE_TIMES;
		}
		
		// Update target
		if(g_cnt < MOVE_TIMES)
		{
			g_pos_r+= g_pos_dr;
			g_pos_i+= g_pos_di;
		}
		
		// Target completion check
		if((g_cnt > 200) && (g_target_end == 0))
		{
			g_target_end = g_time;
		}
		
		// Update canvas for main screen
		g_screen_ctx.putImageData(g_offsc,0,0);
		g_last_draw = g_time;
		g_cnt++;
		
		// Fade In
		if(t < 500)
		{
			g_screen_ctx.save();
			g_screen_ctx.fillStyle = "rgba(0,0,0,"+(1.0 - t / 500)+")";
			g_screen_ctx.fillRect(0,0,sc_w,sc_h);
			g_screen_ctx.restore();
		}
		// Fade Out
		if(g_target_end != 0)
		{
			let fo = (g_time - g_target_end) / 1000;
			if(fo >= 1.0)
			{
				// Apply reset
				g_start_time = 0;
				g_pos_r      = 0;
				g_pos_i      = 0;
				g_target_end = 0;
				g_last_draw  = 0;
				g_cnt        = 0;
				fo           = 1.0;
			}
			
			g_screen_ctx.save();
			g_screen_ctx.fillStyle = "rgba(0,0,0,"+fo+")";
			g_screen_ctx.fillRect(0,0,sc_w,sc_h);
			g_screen_ctx.restore();
		}
	}

}

function render()
{
	
	// Drawing processing for every turn
	
	// Time Calculation
	const last_time = g_time;
	g_time = (new Date).getTime();
	if(last_time == 0)
	{	g_dtime = 0;	}
	else
	{	g_dtime = g_time - last_time;	}
	
	// Drawing Core
	draw();
	
	// Draw FPS
	draw_fps();
	
	// Register next drawing call
	window.requestAnimationFrame(render);

}

</script>
